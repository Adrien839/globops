      display: flex;

    .terminal-viewport {

      padding: 24px 20px 32px 20px;
      cursor: text;
      display: flex;
      flex-direction: column;
      align-items: center;

    .terminal-inner {

      margin: 0 auto;

      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }

      background-color: var(--c-magenta);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;

    .badge-gold {

      font-weight: bold;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      margin-top: 4px;
      width: 100%;
    }

    .prompt-prefix {
      white-space: nowrap;
      margin-right: 8px;
      user-select: none;
    }

      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--c-fg);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: var(--c-cyan);

      background-color: var(--c-bar-bg);
      color: var(--c-bar-fg);
      border-top: 1px solid var(--c-border);
      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 12px;
      user-select: none;
      flex-shrink: 0;
      overflow-x: auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-weight: bold;
      padding: 2px 7px;
      border-radius: 2px;
    }

    .nav-cmd {

    .nav-cmd:hover {

  { id: 1, diff: 1, theme: "NET", title: "Le piège du point en RegEx (. vs \\.) & Ancres (^ $)",

    solution: "^10\\.0\\.0\\.[0-9]$",
    debrief: "Différence fondamentale avec le Globbing : en RegEx, '.' est le joker universel (1 caractère quelconque). Pour matcher un vrai point, il faut l'échapper '\\.'. De plus, '^' et '$' empêchent les correspondances partielles dans '210.0.0.1' ou '10.0.0.10'." },
  { id: 2, diff: 1, theme: "SYS", title: "Ancrage de début de ligne (^)",

    debrief: "L'accent circonflexe '^' hors crochets ancre l'expression au tout début de la ligne. Pas besoin d'ajouter '.*' à la fin : en RegEx (comme avec grep), un motif matche dès qu'il est trouvé dans la ligne." },

    debrief: "En RegEx, '+' répète l'élément qui le précède immédiatement 1 à N fois. Contrairement au glob 'eth*', '^eth[0-9]+$' exige que tous les caractères après 'eth' soient des chiffres." },
  { id: 5, diff: 1, theme: "SYS", title: "Le piège du '?' en RegEx (Optionnalité 0 ou 1)",

    hint: "Place '?' juste après la lettre 's' pour la rendre facultative : '^https?://$'.",

    targets: ["64 bytes:icmp_seq=1", "64 bytes: icmp_seq=2", "64 bytes:    icmp_seq=9"],
    decoys: ["64 bytes:_icmp_seq=1", "64 bytes: -- icmp_seq=1", "64 bytes: icmp_seq=10", "128 bytes: icmp_seq=1"],
    hint: "Place l'étoile après un espace littéral : '^64 bytes: *icmp_seq=[0-9]$'.",
    solution: "^64 bytes: *icmp_seq=[0-9]$",
    debrief: "Erreur numéro 1 des débutants : penser que '*' signifie « n'importe quoi ». En RegEx, ' *' signifie « 0 ou N espaces », tandis que « 0 ou N caractères quelconques » s'écrit '.*'." },
  { id: 8, diff: 1, theme: "SYS", title: "Filtrage OUI MAC Hexadécimal Majuscule",
    scenario: "Cible uniquement les identifiants commençant par l'OUI '00:1A:2B:' suivi d'exactement 2 caractères hexadécimaux MAJUSCULES (0-9 ou A-F).",
    targets: ["00:1A:2B:00", "00:1A:2B:FF", "00:1A:2B:9A", "00:1A:2B:C4"],
    decoys: ["00:1A:2B:ff", "00:1A:2B:0G", "00:1A:2B:0", "00:1A:2B:000", "00-1A-2B-FF"],
    hint: "Utilise '^00:1A:2B:[0-9A-F][0-9A-F]$' (ou '{2}').",
    solution: "^00:1A:2B:[0-9A-F]{2}$",
    debrief: "Tu peux écrire '[0-9A-F][0-9A-F]' ou utiliser le quantifieur de répétition exacte '[0-9A-F]{2}'." },
  { id: 9, diff: 1, theme: "SEC", title: "Échappement des crochets littéraux (\\[ et \\])",
    scenario: "Dans un journal d'authentification, cible les lignes contenant 'sshd[NNN]:' où NNN est un PID d'exactement 3 chiffres entre crochets.",
    targets: ["sshd[104]: Accepted publickey", "sshd[999]: Failed password", "sshd[420]: Disconnected"],
    decoys: ["sshd104: Accepted publickey", "sshd[12]: Accepted", "sshd[1040]: Failed", "sshd[abc]: Error"],
    hint: "Échappe les crochets externes avec '\\[' et '\\]' : 'sshd\\[[0-9]{3}\\]:'.",
    solution: "sshd\\[[0-9]{3}\\]:",
    debrief: "Puisque '[' et ']' servent à définir des classes de caractères en RegEx, il faut les précéder d'un antislash ('\\[', '\\]') lorsqu'on cherche de vrais crochets dans des logs." },

  // --- TIER 2 : ADMIN SYSTÈME N2 (Classes PCRE \d \w \s, Bornes \b & Quantifieurs {n,m}) ---
  { id: 10, diff: 2, theme: "NET", title: "Codes d'erreur HTTP 4xx/5xx (\\d et {n})",
    scenario: "Isole les requêtes Nginx ayant retourné un code d'erreur client (400-499) ou serveur (500-599) juste après 'HTTP/1.1\" '.",
    targets: ["\"GET /\" HTTP/1.1\" 404 128", "\"POST /api\" HTTP/1.1\" 500 0", "\"GET /admin\" HTTP/1.1\" 403 52", "\"PUT /db\" HTTP/1.1\" 502 64"],
    decoys: ["\"GET /\" HTTP/1.1\" 200 404", "\"GET /\" HTTP/1.1\" 301 500", "\"GET /\" HTTP/1.1\" 4040 12", "\"GET /\" HTTP/2.0\" 404 128"],
    hint: "Combine 'HTTP/1\\.1\" [45]\\d{2} ' (note l'espace final pour éviter 4040).",
    solution: "HTTP/1\\.1\" [45]\\d{2} ",
    debrief: "'\\d' est l'abréviation PCRE pour '[0-9]'. En incluant 'HTTP/1\\.1\" ' devant '[45]\\d{2} ', on évite de confondre le code HTTP avec la taille de la réponse (ex: '200 404')." },
  { id: 11, diff: 2, theme: "SYS", title: "Quantifieur d'intervalle {min,max} et \\w",
    scenario: "Valide les noms de comptes Linux composés de 3 à 6 caractères alphanumériques ou underscore ('\\w'), commençant impérativement par une lettre minuscule.",
    targets: ["adrien", "soc_1", "root", "net01"],
    decoys: ["ab", "admin_soc_01", "1user", "Root", "user-1"],
    hint: "1 lettre minuscule '[a-z]' suivie de 2 à 5 caractères '\\w' : '^[a-z]\\w{2,5}$'.",
    solution: "^[a-z]\\w{2,5}$",
    debrief: "'\\w' correspond à '[a-zA-Z0-9_]'. Comme '[a-z]' consomme déjà le 1er caractère, '\\w{2,5}' ajoute 2 à 5 caractères, soit une longueur totale de 3 à 6 caractères." },
  { id: 12, diff: 2, theme: "SEC", title: "Frontières de mots (\\b Word Boundary)",
    scenario: "Détecte toutes les lignes mentionnant le mot exact 'root', sans déclencher de faux positif sur 'chroot', 'rootkit', 'groot' ou 'root_backup'.",
    targets: ["user=root uid=0", "sudo su - root", "root:x:0:0:super:/root", "alert(root)privilege"],
    decoys: ["chroot /mnt/jail", "alert: rootkit_detected", "user=groot uid=1001", "dir=/var/root_backup"],
    hint: "Encadre le mot par deux ancres de frontière de mot : '\\broot\\b'.",
    solution: "\\broot\\b",
    debrief: "'\\b' est une assertion de largeur nulle qui matche la transition entre un caractère de mot ('\\w') et un caractère non-mot ('\\W' ou début/fin de ligne). Indispensable en recherche d'IOC !" },
  { id: 13, diff: 2, theme: "NET", title: "Segments IPv6 compressés ({1,4})",
    scenario: "Valide les adresses IPv6 abrégées de la forme '::XXXX:YYYY' où chaque bloc contient entre 1 et 4 caractères hexadécimaux.",
    targets: ["::1:80", "::fe80:1", "::dead:beef", "::2001:db8"],
    decoys: ["::1:80800", "::gggg:1", ":1:80", "::1:2:3", "::1::80"],
    hint: "Utilise '^::[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$'.",
    solution: "^::[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$",
    debrief: "Le quantifieur '{1,4}' accepte aussi bien un bloc court ('1') qu'un bloc complet de 16 bits ('fe80'), tout en rejetant les blocs de 5 caractères ('80800')." },
  { id: 14, diff: 2, theme: "SYS", title: "Espaces blancs (\\s+) et Non-espaces (\\S+)",
    scenario: "Dans '/etc/fstab', cible les lignes actives (non commentées) commençant par 'UUID=' suivi d'un identifiant sans espace ('\\S+'), d'un ou plusieurs espaces, puis du point de montage exact '/boot' suivi d'un espace.",
    targets: ["UUID=4a2f-99 /boot ext4", "UUID=10b-c0    /boot vfat", "UUID=999 /boot xfs"],
    decoys: ["UUID=4a2f-99 /boot/efi vfat", "# UUID=4a2f-99 /boot ext4", "UUID= /boot ext4", "/dev/sda1 /boot ext4"],
    hint: "Combine '^UUID=\\S+\\s+/boot\\s+'.",
    solution: "^UUID=\\S+\\s+/boot\\s+",
    debrief: "Le couple '\\S+' (au moins un caractère non-espace) et '\\s+' (au moins un espace/tabulation) est l'outil idéal pour découper des colonnes dans les fichiers de configuration Unix." },
  { id: 15, diff: 2, theme: "SEC", title: "Condensats Hash d'au moins 16 caractères ({16,})",
    scenario: "Isole les chaînes composées uniquement de caractères hexadécimaux minuscules d'une longueur minimale de 16 caractères.",
    targets: ["0123456789abcdef", "deadbeefc0ffee00112233", "a1b2c3d4e5f60718293a"],
    decoys: ["0123456789abcde", "DEADBEEFC0FFEE0011", "0123456789abcdefg", "dead_beef_c0ffee_00"],
    hint: "Utilise la borne ouverte '{16,}' : '^[0-9a-f]{16,}$'.",
    solution: "^[0-9a-f]{16,}$",
    debrief: "Ommettre la borne supérieure dans '{16,}' signifie « 16 fois ou plus »." },
  { id: 16, diff: 2, theme: "NET", title: "Validation d'adresse MAC complète par groupe répété",
    scenario: "Valide une adresse MAC de 6 octets hexadécimaux séparés par ':' en répétant 5 fois le motif '<octet>:' suivi d'un dernier '<octet>'.",
    targets: ["00:1a:2b:3c:4d:5e", "FF:FF:FF:FF:FF:FF", "08:00:27:a1:b2:c3"],
    decoys: ["00:1a:2b:3c:4d", "00:1a:2b:3c:4d:5e:6f", "00-1a-2b-3c-4d-5e", "00:1g:2b:3c:4d:5e"],
    hint: "Garde '([0-9a-fA-F]{2}:){5}' en tête, suivi de '[0-9a-fA-F]{2}$'.",
    solution: "^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$",
    debrief: "Grouper '([0-9a-fA-F]{2}:)' avec des parenthèses permet de lui appliquer le quantifieur '{5}' d'un seul bloc." },
  { id: 17, diff: 2, theme: "SYS", title: "Détection d'anomalies par classe inverse (\\D)",
    scenario: "Isole les paramètres 'pid=<val>' corrompus contenant au moins un caractère NON-numérique ('\\D') après 'pid='.",
    targets: ["pid=12a4", "pid=null", "pid=-1", "pid=402_"],
    decoys: ["pid=1", "pid=42", "pid=99999", "ppid=12a4"],
    hint: "Ancre '^pid=\\d*\\D' (0 ou N chiffres suivis d'au moins un non-chiffre).",
    solution: "^pid=\\d*\\D",
    debrief: "En PCRE, les majuscules inversent les classes abrégées : '\\D' = '[^0-9]', '\\W' = '[^a-zA-Z0-9_]', '\\S' = '[^\\s]'." },
  { id: 18, diff: 2, theme: "SEC", title: "Chasse aux clés d'accès AWS (Secret Scanning)",
    scenario: "Isole les clés d'accès AWS IAM valides : préfixe 'AKIA' suivi d'exactement 16 caractères majuscules ou chiffres, délimitées par des frontières de mots.",
    targets: ["key=AKIAIOSFODNN7EXAMPLE", "export AKIA1234567890ABCDEF", "\"AKIA9999888877776666\""],
    decoys: ["AKIA12345", "AKIAiosfodnn7example", "XAKIA1234567890ABCDEF", "AKIA1234567890ABCDEF99"],
    hint: "Utilise '\\bAKIA[A-Z0-9]{16}\\b'.",
    solution: "\\bAKIA[A-Z0-9]{16}\\b",
    debrief: "C'est la signature exacte utilisée par les scanners de secrets (GitLeaks, TruffleHog) pour détecter les fuites d'identifiants AWS dans les dépôts Git." },

  // --- TIER 3 : ANALYSTE SOC N3 (Alternation |, Groupes (...), Portée & Non-Greedy) ---
  { id: 19, diff: 3, theme: "NET", title: "Alternation groupée (tcp|udp) et ports multiples",
    scenario: "Isole les règles pare-feu autorisant ('allow') les protocoles 'tcp' ou 'udp' à destination des ports '53' ou '443' uniquement.",
    targets: ["allow tcp dport 53", "allow udp dport 53", "allow tcp dport 443", "allow udp dport 443"],
    decoys: ["allow icmp dport 53", "allow tcp dport 80", "allow tcp dport 4430", "deny tcp dport 53"],
    hint: "Utilise deux groupes d'alternation : '^allow (tcp|udp) dport (53|443)$'.",
    solution: "^allow (tcp|udp) dport (53|443)$",
    debrief: "L'opérateur '|' a la priorité la plus faible en RegEx : l'enfermer dans des parenthèses '(tcp|udp)' évite qu'il ne coupe toute l'expression en deux." },
  { id: 20, diff: 3, theme: "SYS", title: "Factorisation de préfixes optionnels ((re)?start|reload)",
    scenario: "Cible uniquement les commandes exactes 'systemctl start sshd', 'systemctl restart sshd' et 'systemctl reload sshd'.",
    targets: ["systemctl start sshd", "systemctl restart sshd", "systemctl reload sshd"],
    decoys: ["systemctl stop sshd", "systemctl status sshd", "sudo systemctl start sshd", "systemctl reload nginx"],
    hint: "Combine '^systemctl ((re)?start|reload) sshd$' (ou 'start|restart|reload').",
    solution: "^systemctl ((re)?start|reload) sshd$",
    debrief: "Imbriquer '(re)?start' factorise 'start' et 'restart' tout en gardant le motif compact et lisible." },
  { id: 21, diff: 3, theme: "SEC", title: "Règle WAF : Détection d'Injection SQL (SQLi)",
    scenario: "Détecte les requêtes HTTP malveillantes contenant l'une des 3 signatures SQLi suivantes : \"' OR 1=1\", \"UNION SELECT\" ou \"DROP TABLE\".",
    targets: ["/login?u=admin' OR 1=1--", "/item?id=1 UNION SELECT user,pass", "/admin?q=;DROP TABLE users"],
    decoys: ["/item?id=100", "/page?union=true&select=1", "/api?drop=false", "/login?u=admin"],
    hint: "Utilise l'alternation : \"(' OR 1=1|UNION SELECT|DROP TABLE)\".",
    solution: "(' OR 1=1|UNION SELECT|DROP TABLE)",
    debrief: "Les règles d'inspection WAF (ModSecurity, Coraza) reposent sur des alternations de signatures pour inspecter les paramètres d'URI en une seule passe." },
  { id: 22, diff: 3, theme: "NET", title: "Sous-réseaux privés RFC 1918 Classe B (172.16.x à 172.31.x)",
    scenario: "Cible les adresses IP appartenant à la plage privée RFC 1918 '172.16.0.0/12' (second octet compris entre 16 et 31 inclus) en début de ligne.",
    targets: ["172.16.0.1", "172.19.254.1", "172.24.10.5", "172.31.255.254"],
    decoys: ["172.15.0.1", "172.32.0.1", "172.160.0.1", "10.172.16.1"],
    hint: "Découpe 16..31 en trois cas dans un groupe : '1[6-9]' (16-19), '2\\d' (20-29) ou '3[01]' (30-31).",
    solution: "^172\\.(1[6-9]|2\\d|3[01])\\.",
    debrief: "Une RegEx traite du texte, pas des nombres : pour borner 16 à 31, on décompose par dizaines ('1[6-9]|2\\d|3[01]') suivi d'un point échappé '\\.'." },
  { id: 23, diff: 3, theme: "SYS", title: "Sous-groupe de version optionnel (\\.\\d+)?",
    scenario: "Cible les paquets Debian 'pkg_vX.Y-amd64.deb' ou 'pkg_vX.Y.Z-amd64.deb' (2 ou 3 numéros de version séparés par des points).",
    targets: ["pkg_v1.0-amd64.deb", "pkg_v2.14.3-amd64.deb", "pkg_v0.9.12-amd64.deb"],
    decoys: ["pkg_v1-amd64.deb", "pkg_v1.0.2.4-amd64.deb", "pkg_v1.0-arm64.deb", "pkg_v1.0.-amd64.deb"],
    hint: "Rends le 3e segment '.Z' optionnel grâce à un groupe suivi de '?' : '^pkg_v\\d+\\.\\d+(\\.\\d+)?-amd64\\.deb$'.",
    solution: "^pkg_v\\d+\\.\\d+(\\.\\d+)?-amd64\\.deb$",
    debrief: "Enfermer '\\.\\d+' dans un groupe optionnel '(\\.\\d+)?' garantit que le point n'est présent que s'il est suivi d'au moins un chiffre." },
  { id: 24, diff: 3, theme: "SEC", title: "Détection de Path Traversal (../ et ..\\)",
    scenario: "Isole les tentatives d'exploitation Directory Traversal comportant AU MOINS 2 séquences consécutives de '../' ou '..\\'.",
    targets: ["GET /download?f=../../etc/passwd", "GET /view?p=..\\..\\..\\windows\\win.ini", "GET /app/../../../../root/.ssh"],
    decoys: ["GET /download?f=../index.html", "GET /static/..style.css", "GET /about/index.html"],
    hint: "Garde le motif '(\\.\\.[/\\\\]){2,}' (note le double antislash pour matcher '\\' dans '[...]').",
    solution: "(\\.\\.[/\\\\]){2,}",
    debrief: "La classe '[/\\\\]' couvre simultanément les serveurs Unix ('/') et Windows ('\\'). Le quantifieur '{2,}' exige au moins deux remontées d'arborescence." },
  { id: 25, diff: 3, theme: "NET", title: "Sélection de ports Web & Plage 8000-8089",
    scenario: "Isole les configurations 'port=<N>' pour les ports '80', '443', ainsi que tous les ports de '8000' à '8089'.",
    targets: ["port=80", "port=443", "port=8000", "port=8085"],
    decoys: ["port=808", "port=8090", "port=80000", "port=4433"],
    hint: "Combine '^port=(80|443|80[0-8]\\d)$'.",
    solution: "^port=(80|443|80[0-8]\\d)$",
    debrief: "Ancrer l'alternation entre '^port=(' et ')$' empêche '80' de matcher partiellement 'port=8090' ou 'port=808'." },
  { id: 26, diff: 3, theme: "SYS", title: "Validation d'horodatage Syslog 24h (00:00:00 à 23:59:59)",
    scenario: "Valide les lignes de journal débutant par une heure valide au format 'HH:MM:SS' (heures 00-23, minutes 00-59, secondes 00-59).",
    targets: ["00:00:00 kernel: boot", "14:35:09 sshd: auth", "23:59:59 cron: job", "09:05:30 systemd: ok"],
    decoys: ["24:00:00 kernel: err", "14:60:09 sshd: err", "14:35:60 cron: err", "9:05:30 systemd: err"],
    hint: "Heures : '([01]\\d|2[0-3])', Minutes et Secondes : '[0-5]\\d'.",
    solution: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d ",
    debrief: "Ce patron classique valide strictement l'horloge 24h : '00..19' via '[01]\\d' et '20..23' via '2[0-3]'." },
  { id: 27, diff: 3, theme: "SEC", title: "Extraction XSS sans chevrons internes (<script>[^<>]+<\x2Fscript>)",
    scenario: "Cible les vecteurs XSS contenant une balise '<script>...<\x2Fscript>' pure (sans attributs dans '<script>' et sans aucun chevron '<' ou '>' à l'intérieur du code).",
    targets: ["payload=<script>alert(1)<\x2Fscript>", "q=<script>fetch('c2')<\x2Fscript>", "in=<script>eval(x)<\x2Fscript>"],
    decoys: ["payload=<script src=\"a.js\"><\x2Fscript><p>ok</p>", "q=<script>if(a>b)<\x2Fscript>", "in=<style>body{}</style>"],
    hint: "Utilise la classe niée '[^<>]+' entre '<script>' et '<\x2Fscript>'.",
    solution: "<script>[^<>]+<\x2Fscript>",
    debrief: "Si tu avais utilisé '<script>.+<\x2Fscript>' (quantifieur gourmand), le premier piège '<script src=\"a.js\"><\x2Fscript><p>ok</p>' ou deux balises sur la même ligne auraient fusionné ! '[^<>]+' bloque tout débordement." },

  // --- TIER 4 : EXPERT FORENSICS N4 (Références Arrières \1, \2 & Corrélation) ---
  { id: 28, diff: 4, theme: "NET", title: "Boucle Réseau / Land Attack (IP Source == IP Destination)",
    scenario: "À l'aide d'un groupe capturant '()' et d'une référence arrière '\\1', isole les paquets malveillants où l'IP source ('SRC=...') est strictement identique à l'IP destination ('DST=...').",
    targets: ["SRC=10.0.0.5 DST=10.0.0.5 PROTO=TCP", "SRC=192.168.1.1 DST=192.168.1.1 PROTO=UDP", "SRC=172.16.0.99 DST=172.16.0.99 PROTO=ICMP"],
    decoys: ["SRC=10.0.0.5 DST=10.0.0.6 PROTO=TCP", "SRC=10.0.0.5 DST=10.0.0.50 PROTO=TCP", "SRC=192.168.1.1 DST=10.0.0.1 PROTO=UDP"],
    hint: "Capture l'IP source dans '([0-9.]+)' et rappelle-la après 'DST=' avec '\\1\\b'.",
    solution: "SRC=([0-9.]+) DST=\\1\\b",
    debrief: "Puissance unique des RegEx : '\\1' oblige le moteur à matcher exactement le même texte que celui capturé par la 1re parenthèse ouvrante ! Le '\\b' final évite que '10.0.0.5' ne matche le début de '10.0.0.50'." },
  { id: 29, diff: 4, theme: "SYS", title: "Détection de mots dupliqués dans les configs (\\b(\\w+)\\s+\\1\\b)",
    scenario: "Détecte les erreurs de saisie où un même mot complet est répété deux fois de suite, séparé par un ou plusieurs espaces.",
    targets: ["allow allow 10.0.0.0/8", "listen 80 80;", "user root root", "max_conn   max_conn 100"],
    decoys: ["allow all 10.0.0.0/8", "listen 80 8080;", "user root_root", "max_conn 100"],
    hint: "Encadre toute l'expression par des frontières de mots '\\b' : '\\b(\\w+)\\s+\\1\\b'.",
    solution: "\\b(\\w+)\\s+\\1\\b",
    debrief: "Sans le premier '\\b' et le second '\\b', 'listen 80 8080' matcherait ('80' suivi de '80'). Les frontières de mots garantissent l'égalité du mot entier." },
  { id: 30, diff: 4, theme: "SEC", title: "DGA & Palindromes C2 (Double référence \\2\\1)",
    scenario: "Un malware génère des domaines 'c2_<4lettres>.net' dont les 4 lettres minuscules forment un palindrome (type ABBA : 'abba', 'deed', 'noon'). Isole-les.",
    targets: ["c2_abba.net", "c2_deed.net", "c2_noon.net", "c2_xzzx.net"],
    decoys: ["c2_abcd.net", "c2_abab.net", "c2_aaaa.org", "c2_ab1ba.net"],
    hint: "Capture la 1re lettre '([a-z])', la 2e '([a-z])', puis rappelle '\\2\\1'.",
    solution: "^c2_([a-z])([a-z])\\2\\1\\.net$",
    debrief: "Les groupes sont numérotés de gauche à droite selon l'ordre de leurs parenthèses ouvrantes : '\\1' est la 1re lettre, '\\2' est la 2e, donc '\\2\\1' inverse l'ordre (AB -> BA)." },
  { id: 31, diff: 4, theme: "NET", title: "Cohérence des séparateurs MAC (Tout ':' ou Tout '-')",
    scenario: "Valide les adresses MAC utilisant soit ':' partout, soit '-' partout, mais REJETTE les adresses mixtes comme '00:1A-2B:3C-4D:5E'.",
    targets: ["00:1A:2B:3C:4D:5E", "00-1A-2B-3C-4D-5E", "aa:bb:cc:dd:ee:ff"],
    decoys: ["00:1A-2B:3C-4D:5E", "00-1A:2B-3C-4D-5E", "00_1A_2B_3C_4D_5E", "00:1A:2B:3C:4D"],
    hint: "Capture le 1er séparateur '([:-])' et réutilise '\\1' dans le groupe répété 4 fois : '^[0-9a-fA-F]{2}([:-])([0-9a-fA-F]{2}\\1){4}[0-9a-fA-F]{2}$'.",
    solution: "^[0-9a-fA-F]{2}([:-])([0-9a-fA-F]{2}\\1){4}[0-9a-fA-F]{2}$",
    debrief: "En capturant le tout premier séparateur dans le groupe 1 '([:-])', la référence '\\1' force les 4 séparateurs suivants à être strictement identiques au premier." },
  { id: 32, diff: 4, theme: "SYS", title: "Validation de balises XML/Config appariées (<tag>...</tag>)",
    scenario: "Isole les entrées dont la balise fermante '</...>' porte exactement le même nom que la balise ouvrante '<...>'.",
    targets: ["<host>srv01</host>", "<port>8080</port>", "<zone>dmz</zone>"],
    decoys: ["<host>srv01</port>", "<zone>dmz</host>", "<host>srv01<host>", "<>srv01</>"],
    hint: "Capture le nom de la balise ouvrante '^<([a-z]+)>' et vérifie '</\\1>$'.",
    solution: "^<([a-z]+)>[^<]+</\\1>$",
    debrief: "La référence arrière '</\\1>' élimine toutes les lignes dont la balise fermante ne correspond pas à la balise ouvrante." },
  { id: 33, diff: 4, theme: "SEC", title: "Guillemets simples ou doubles appariés (['\"])",
    scenario: "Cible les arguments 'cmd=...' entourés soit de deux guillemets doubles '\"...\"', soit de deux apostrophes \"'...'\", sans mélanger les deux et sans chaîne vide.",

function esc(str) {
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}

function printHtml(html = "", cls = "") {
  const div = document.createElement('div');
  div.className = "log-line" + (cls ? " " + cls : "");
  div.innerHTML = html;
  outEl.appendChild(div);
  boxEl.scrollTop = boxEl.scrollHeight;
  return div;
}

function printText(text = "", cls = "") {
  printHtml(esc(text), cls);
}

function getOperatorRank() {
  const c = profile.masteredIds.length;
  if (c >= 48) return { title: "regex-god", sym: "#" };
  if (c >= 36) return { title: "secops-arch", sym: "$" };
  if (c >= 27) return { title: "forensics-n4", sym: "$" };
  if (c >= 18) return { title: "soc-hunter", sym: "$" };
  if (c >= 9)  return { title: "sysadmin-n2", sym: "$" };
  return { title: "stagiaire-n1", sym: "$" };
}

function isThemeUnlocked(key) {
  const t = THEMES[key];
  if (!t) return false;
  if (!t.locked) return true;
  return profile.unlockedThemes.includes(key);
}

function unlockTheme(key, reasonMsg) {
  if (!THEMES[key] || profile.unlockedThemes.includes(key)) return;
  profile.unlockedThemes.push(key);
  populateThemeSelect();
  saveProfile();
  printHtml(`  <span class="badge-gold"> 🔓 BONUS DÉBLOQUÉ </span> <span class="c-yellow bold">Thème Prestige '${esc(THEMES[key].label)}' déverrouillé !</span> <span class="c-dim">(${esc(reasonMsg)} — Tape 'theme ${esc(key)}')</span>`);
}

function unlockBadge(badgeName, desc) {
  if (profile.badges.includes(badgeName)) return;
  profile.badges.push(badgeName);
  saveProfile();
  printHtml(`  <span class="badge-gold"> 🏅 HAUT FAIT </span> <span class="c-cyan bold">[${esc(badgeName)}]</span> : <span class="c-fg">${esc(desc)}</span>`);
}

function checkProgressionUnlocks() {
  const mCount = profile.masteredIds.length;
  if (mCount >= 9)  unlockTheme("mr-robot", "Palier N2 atteint : 9+ missions maîtrisées");
  if (mCount >= 18) unlockTheme("lain", "Palier N3 atteint : 18+ missions maîtrisées");
  if (mCount >= 27) unlockTheme("ghost-root", "Palier N4 atteint : 27+ missions maîtrisées");
  if (mCount >= 48) unlockBadge("MAÎTRE PCRE", "Les 48 missions RegEx ont été maîtrisées sans afficher la solution !");
}

function populateThemeSelect() {
  const sel = document.getElementById('theme-select');
  const groups = {};
  for (const [k, v] of Object.entries(THEMES)) {
    if (!groups[v.group]) groups[v.group] = [];
    groups[v.group].push({ key: k, ...v });
  }
  sel.innerHTML = "";
  for (const [gName, items] of Object.entries(groups)) {
    const optg = document.createElement('optgroup');
    optg.label = gName;
    for (const it of items) {
      const opt = document.createElement('option');
      opt.value = it.key;
      const unlocked = isThemeUnlocked(it.key);
      opt.disabled = !unlocked;
      opt.textContent = unlocked ? it.label : `🔒 ${it.label} — [${it.unlockHint}]`;
      optg.appendChild(opt);
    }
    sel.appendChild(optg);
  }
  if (THEMES[profile.theme]) sel.value = profile.theme;
}

function setTheme(themeKey, silent = false) {
  if (!THEMES[themeKey]) return false;
  if (!isThemeUnlocked(themeKey)) {
    if (!silent) {
      printHtml(`  <span class="c-yellow">[🔒 Thème verrouillé]</span> Condition requise : <span class="c-cyan bold">${esc(THEMES[themeKey].unlockHint)}</span>`);
    }
    document.getElementById('theme-select').value = profile.theme;
    return false;
  }
  profile.theme = themeKey;
  const t = THEMES[themeKey];
  const r = document.documentElement.style;
  r.setProperty('--c-bg', t.bg);
  r.setProperty('--c-bar-bg', t.bar);
  r.setProperty('--c-bar-fg', t.barFg || t.fg);
  r.setProperty('--c-bar-dim', t.barDim || t.dim);
  r.setProperty('--c-fg', t.fg);
  r.setProperty('--c-dim', t.dim);
  r.setProperty('--c-border', t.border);
  r.setProperty('--c-cyan', t.cyan);
  r.setProperty('--c-green', t.green);
  r.setProperty('--c-red', t.red);
  r.setProperty('--c-yellow', t.yellow);
  r.setProperty('--c-magenta', t.magenta);
  r.setProperty('--c-blue', t.blue);
  document.getElementById('theme-select').value = themeKey;
  saveProfile();
  if (!silent) printHtml(`<span class="c-green">[✓]</span> Thème appliqué : <span class="c-cyan bold">${esc(t.label)}</span>`);
  return true;
}

// 4. PARSEUR REGEX & RAYONS-X (SURLIGNAGE DES SOUS-CHAÎNES MATCHÉES)
// =============================================================================
function compileUserRegex(rawPattern) {
  // Supporte soit une RegEx brute ^abc$, soit la notation /motif/flags (ex: /^abc$/i)
  let source = rawPattern;
  let flags = "";
  if (rawPattern.startsWith("/") && rawPattern.lastIndexOf("/") > 0) {
    const lastSlash = rawPattern.lastIndexOf("/");
    const candidateFlags = rawPattern.slice(lastSlash + 1);
    if (/^[gimsuy]*$/.test(candidateFlags)) {
      source = rawPattern.slice(1, lastSlash);
      // Retirer 'g' et 'y' pour éviter tout effet de bord stateful avec .test()/.exec()
      flags = candidateFlags.replace(/[gy]/g, "");
    }
  }
  return new RegExp(source, flags);
}

function highlightMatchInLine(regex, line, colorCls) {
  const m = regex.exec(line);
  if (!m) return esc(line);
  const idx = m.index;
  const matchedText = m[0];
  if (matchedText.length === 0) {
    // Assertion de largeur nulle (ex: ^ ou $)
    return `${esc(line.slice(0, idx))}<span class="${colorCls} bold">[⚡]</span>${esc(line.slice(idx))}`;
  }
  const before = esc(line.slice(0, idx));
  const mid = esc(matchedText);
  const after = esc(line.slice(idx + matchedText.length));
  return `${before}<span class="match-hl ${colorCls}">[${mid}]</span>${after}`;
}

function runXrayInspector(rawPattern) {
  if (!state.active) {

    return;
  }
  const mid = state.playlist[state.stepIdx];

  try {

  for (const t of m.targets) {
    const res = rx.exec(t);
    const groups = res && res.length > 1 ? ` <span class="c-yellow">➔ Groupes: ${res.slice(1).map((g, i) => `\\${i + 1}="${esc(g ?? '')}"`).join(', ')}</span>` : "";
    printHtml(`    <span class="c-green">[Cible]</span> ${highlightMatchInLine(rx, t, "c-green")}${groups}`);

  printText("");
}

function evaluateRegexAttempt(rawPattern) {
  const mid = state.playlist[state.stepIdx];
  const m = MISSIONS.find(x => x.id === mid);

  let rx;
  try {
    rx = compileUserRegex(rawPattern);
  } catch (err) {
    printHtml(`  <span class="c-red">[✗] Erreur de syntaxe RegEx : ${esc(err.message)}</span>`);
    return;
  }

  // Anti-triche : interdire de coller les 4 cibles littérales complètes séparées par '|'
  const literalTargetsJoined = m.targets.filter(t => rawPattern.includes(t));
  if (literalTargetsJoined.length >= 3 && rawPattern.includes("|")) {
    printHtml(`  <span class="c-yellow">[!] Anti-triche SIEM : Interdiction de copier-coller la liste littérale des cibles avec '|'. Trouve la structure commune !</span>`);
    return;
  }

  state.attempts++;
  let tp = [], fp = [], fn = [];
  for (const t of m.targets) {
    if (rx.test(t)) tp.push(t);
    else fn.push(t);
  }
  for (const d of m.decoys) {
    if (rx.test(d)) fp.push(d);
  }

  if (tp.length === 0 && fp.length === 0) {
    profile.streak = 0;
    saveProfile();
    printHtml(`  <span class="c-red">[✗] Aucune ligne ne correspond à l'expression :</span> <span class="bold">${esc(rawPattern)}</span>`);
    return;
  }

  // Victoire !
  if (fp.length === 0 && fn.length === 0) {
    const elapsed = Math.max(1, Math.floor((Date.now() - state.startTimeMs) / 1000));
    let pts = 100 - (state.attempts - 1) * 15 - (state.usedHint === 1 ? 30 : 0);
    if (pts < 20) pts = 20;

    let speed = elapsed <= 12 ? 30 : (elapsed <= 25 ? 15 : (elapsed <= 50 ? 5 : 0));
    let bonusTags = [];

    if (state.usedHint === 2) {
      pts = 10;
      speed = 0;
      profile.streak = 0;
    } else {
      if (!profile.masteredIds.includes(m.id)) profile.masteredIds.push(m.id);

      // Gestion du Streak (1er coup sans indice)
      if (state.attempts === 1 && state.usedHint === 0) {
        profile.streak++;
        if (profile.streak > profile.bestStreak) profile.bestStreak = profile.streak;

        // Bonus Overclock (< 6s du 1er coup)
        if (elapsed <= 6) {
          speed += 50;
          bonusTags.push("⚡ OVERCLOCK +50");
          unlockTheme("pipboy", "Mission résolue en moins de 6 secondes du 1er coup !");
          unlockBadge("OVERCLOCKER", "Résoudre une expression régulière en moins de 6 secondes.");
        }

        // Bonus de Série (Streak)
        if (profile.streak === 3) {
          pts += 25;
          bonusTags.push("🔥 STREAK x3 (+25)");
        } else if (profile.streak === 5) {
          pts += 60;
          bonusTags.push("🔥 STREAK x5 (+60)");
          unlockTheme("wargames", "Série de 5 missions résolues du 1er coup sans erreur !");
          unlockBadge("FIVE EYES", "5 missions consécutives résolues du premier coup.");
        } else if (profile.streak >= 10 && profile.streak % 5 === 0) {
          pts += 120;
          bonusTags.push(`👑 STREAK x${profile.streak} (+120)`);
          unlockBadge("UNSTOPPABLE SIEM", "10 missions consécutives résolues du premier coup.");
        }
      } else {
        profile.streak = 0;
      }

      // Bonus RegEx Golf (expression plus courte que la solution canonique !)
      if (rawPattern.length < m.solution.length) {
        pts += 35;
        bonusTags.push(`⛳ REGEX GOLF (${rawPattern.length} vs ${m.solution.length} chars : +35)`);
        unlockBadge("REGEX GOLFER", "Battre la longueur de la solution canonique sur une mission.");
      }
    }

    const totalPts = pts + speed;
    state.sessionScore += totalPts;
    profile.totalScore += totalPts;
    if (state.sessionScore > profile.bestScore) profile.bestScore = state.sessionScore;
    if (state.mode === "CAMPAIGN" && m.id >= profile.campaignUnlocked && profile.campaignUnlocked < TOTAL_MISSIONS) {
      profile.campaignUnlocked = m.id + 1;
    }

    state.awaitingNext = true;
    printText("");
    printHtml(`  <span class="c-green bold">╔══════════════════════════════════════════════════════════════════════════╗</span>`);
    printHtml(`  <span class="c-green bold">║  [✓] MISSION #${String(m.id).padStart(2, '0')} ACCOMPLIE ! (+${totalPts} pts | ⏱ ${elapsed}s | Streak: 🔥${profile.streak})</span>`);
    printHtml(`  <span class="c-green bold">╚══════════════════════════════════════════════════════════════════════════╝</span>`);
    if (bonusTags.length > 0) {
      printHtml(`  <span class="badge-gold"> BONUS PERFORMANCE </span> <span class="c-yellow bold">${esc(bonusTags.join("  •  "))}</span>`);
    }
    printHtml(`  <span class="bold">Ta RegEx          :</span> <span class="c-green bold">${esc(rawPattern)}</span>`);
    printHtml(`  <span class="bold">Solution optimale :</span> <span class="c-cyan bold">${esc(m.solution)}</span>`);
    printText("");
    printHtml(`  <span class="c-yellow bold">Débriefing Technique :</span>`);
    printHtml(`  <span class="c-fg">${esc(m.debrief)}</span>`);

    checkProgressionUnlocks();
    saveProfile();

    printText("");
    printHtml(`  <span class="c-dim">👉 Appuie sur [ENTRÉE] pour passer à la mission suivante...</span>`);
    return;
  }

  // Échec -> Reset du streak et affichage du rapport Rayons-X
  profile.streak = 0;
  saveProfile();

  printText("");
  printHtml(`  <span class="bold">Diagnostic SIEM pour <span class="c-cyan">${esc(rawPattern)}</span> :</span>`);
  if (tp.length > 0) {
    printHtml(`    <span class="c-green bold">[✓] Cibles capturées (${tp.length}/${m.targets.length}) :</span> ${tp.map(x => highlightMatchInLine(rx, x, "c-green")).join('   ')}`);
  }
  if (fp.length > 0) {
    printHtml(`    <span class="c-red bold">[✗] FAUX POSITIFS (${fp.length} piège(s) déclenché(s) — zone matchée entre [ ]) :</span>`);
    fp.forEach(d => {
      printHtml(`        <span class="c-red">•</span> ${highlightMatchInLine(rx, d, "c-red")}`);
    });
  }
  if (fn.length > 0) {
    printHtml(`    <span class="c-yellow bold">[!] Cibles manquées (${fn.length}) :</span> ${esc(fn.join('   '))}`);
  }
}

  printText("");
  printHtml(`  <span class="c-cyan bold">2. Métacaractères &amp; Classes Abrégées PCRE :</span>`);
  printHtml(`    <span class="c-cyan bold">.</span>              N'importe quel caractère <span class="c-yellow">(Attention : utilise \\. pour un vrai point !)</span>`);
  printHtml(`    <span class="c-cyan bold">\\d</span> / <span class="c-cyan bold">\\D</span>        Chiffre [0-9] / Non-chiffre [^0-9]`);
  printHtml(`    <span class="c-cyan bold">\\w</span> / <span class="c-cyan bold">\\W</span>        Mot [a-zA-Z0-9_] / Non-mot [^a-zA-Z0-9_]`);
  printHtml(`    <span class="c-cyan bold">\\s</span> / <span class="c-cyan bold">\\S</span>        Espace blanc (espace, tab) / Non-espace`);
  printHtml(`    <span class="c-cyan bold">[abc]  [^abc]</span>  1 caractère dans la liste / 1 caractère QUI N'EST PAS dans la liste`);
  printText("");
  printHtml(`  <span class="c-cyan bold">3. Quantifieurs (S'appliquent uniquement à l'élément ou groupe précédent) :</span>`);
  printHtml(`    <span class="c-yellow bold">?</span>              0 ou 1 fois (Optionnel) <span class="c-yellow bold">+</span>              1 ou N fois (Au moins 1)`);
  printHtml(`    <span class="c-yellow bold">*</span>              0, 1 ou N fois          <span class="c-yellow bold">{n} / {n,m}</span>    Exactement n / de n à m fois`);
  printHtml(`    <span class="c-yellow bold">+? / *?</span>        Version Lazy (Non-gourmande : s'arrête dès le 1er match possible)`);
  printText("");
  printHtml(`  <span class="c-cyan bold">4. Groupes, Alternation &amp; Références Arrières :</span>`);
  printHtml(`    <span class="c-green bold">(a|b)</span>          Matche 'a' OU 'b' et capture le résultat dans le groupe numéroté`);
  printHtml(`    <span class="c-green bold">(?:a|b)</span>        Groupe non-capturant (groupe sans décaler les numéros \\1, \\2)`);
  printHtml(`    <span class="c-green bold">\\1, \\2</span>         Référence arrière : doit matcher exactement le texte capturé par le groupe 1 ou 2`);
  printText("");
  printHtml(`  <span class="c-cyan bold">5. Lookarounds (Assertions avant/arrière de largeur nulle) :</span>`);
  printHtml(`    <span class="c-magenta bold">(?=motif)</span>      Positive Lookahead  : exige que 'motif' suive à droite`);
  printHtml(`    <span class="c-magenta bold">(?!motif)</span>      Negative Lookahead  : interdit que 'motif' suive à droite`);
  printHtml(`    <span class="c-magenta bold">(?&lt;=motif)</span>     Positive Lookbehind : exige que 'motif' précède à gauche`);
  printHtml(`    <span class="c-magenta bold">(?&lt;!motif)</span>     Negative Lookbehind : interdit que 'motif' précède à gauche`);
  printHtml(`  <span class="c-magenta bold">╚═══════════════════════════════════════════════════════════════════════════════════╝</span>`);
  printText("");
}

async function showLeaderboard() {
  printHtml(`<span class="c-dim">Récupération du Leaderboard SIEM/SOC...</span>`);
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=pseudo,score,mastered&order=score.desc&limit=15`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (res.ok) {
        renderBoardTable(await res.json(), "LEADERBOARD PUBLIC EN LIGNE");
        return;
      }
    } catch (e) {}
  }
  const list = [...profile.localBoard];
  const myBest = Math.max(profile.bestScore, profile.totalScore);
  const ex = list.find(x => x.pseudo === profile.pseudo);
  if (ex) { ex.score = Math.max(ex.score, myBest); ex.mastered = profile.masteredIds.length; }
  else list.push({ pseudo: profile.pseudo, score: myBest, mastered: profile.masteredIds.length });
  list.sort((a, b) => b.score - a.score);
  renderBoardTable(list.slice(0, 10), "LEADERBOARD (Mode Local)");
}

function renderBoardTable(rows, title) {
  printText("");
  printHtml(`  <span class="c-cyan bold">=== ${esc(title)} ===</span>`);
  printHtml(`  <span class="c-dim">RANG   PSEUDO                 SCORE        MAÎTRISE</span>`);
  printHtml(`  <span class="c-dim">────   ────────────────────   ──────────   ────────</span>`);
  rows.forEach((r, idx) => {
    const rk = `#${String(idx + 1).padStart(2, '0')}`.padEnd(7);
    const ps = String(r.pseudo).slice(0, 20).padEnd(23);
    const sc = `${r.score} pts`.padEnd(13);
    const ma = `${r.mastered}/${TOTAL_MISSIONS}`;
    printHtml(`  <span class="c-yellow bold">${esc(rk)}</span><span class="c-fg">${esc(ps)}</span><span class="c-green bold">${esc(sc)}</span><span class="c-cyan">${esc(ma)}</span>`);
  });
  printHtml(`  <span class="c-dim">Commandes : 'nick &lt;pseudo&gt;' puis 'submit' pour publier ton score.</span>`);
  printText("");
}

async function submitScoreToBoard() {
  const best = Math.max(profile.bestScore, profile.totalScore);
  if (best <= 0) {
    printHtml(`<span class="c-yellow">[!] Résous au moins une mission avant de publier ton score.</span>`);
    return;
  }
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ pseudo: profile.pseudo, score: best, mastered: profile.masteredIds.length })
      });
      if (res.ok) {
        printHtml(`<span class="c-green bold">[✓] Score de ${best} pts publié sous '${esc(profile.pseudo)}' !</span>`);
        showLeaderboard();
        return;
      }
    } catch (e) {}
  }
  printHtml(`<span class="c-green bold">[✓] Score enregistré pour '${esc(profile.pseudo)}' (${best} pts).</span>`);
  showLeaderboard();
}

// =============================================================================
// 8. INTERPRÉTEUR DE COMMANDES SHELL PRINCIPAL
// =============================================================================
function startCampaign(startAt) {
  const s = startAt || profile.campaignUnlocked || 1;
  state.playlist = [];
  for (let i = s; i <= TOTAL_MISSIONS; i++) state.playlist.push(i);
  state.mode = "CAMPAIGN";
  state.stepIdx = 0;
  state.sessionScore = 0;
  state.active = true;
  state.wizardStep = 0;
  printMission();
}

function onPromptSubmit(e) {
  e.preventDefault();
  if (state.busy) return;
  const raw = inpEl.value;
  inpEl.value = "";
  handleInput(raw);
}

function handleInput(rawInput) {
  const cmd = rawInput.trim();
  printHtml(`${promptLbl.innerHTML} ${esc(cmd)}`);

  if (state.awaitingNext && cmd === "") {
    state.stepIdx++;
    printMission();
    return;
  }

  if (!cmd) return;
  cmdHistory.unshift(cmd);
  histIdx = -1;

  if (state.wizardStep > 0) {
    handleCustomWizard(cmd);
    return;
  }

  const parts = cmd.split(/\s+/);
  const base = parts[0].toLowerCase();
  const arg = parts.slice(1).join(" ");

  if (base === "help" || base === "man") {
    printText("");
    printHtml(`  <span class="c-cyan bold">COMMANDES DISPONIBLES :</span>`);
    printHtml(`    <span class="c-green bold">start</span> / <span class="c-green bold">camp</span>       : Lancer la campagne au niveau débloqué (${profile.campaignUnlocked}/${TOTAL_MISSIONS})`);
    printHtml(`    <span class="c-green bold">goto &lt;1-${TOTAL_MISSIONS}&gt;</span>        : Aller directement à une mission précise`);
    printHtml(`    <span class="c-green bold">custom</span>             : Configurer une session aléatoire (difficulté N1..N5, thème, nombre)`);
    printHtml(`    <span class="c-green bold">xray &lt;regex&gt;</span>       : Inspecter les sous-chaînes matchées et les groupes (\\1, \\2)`);
    printHtml(`    <span class="c-green bold">stats</span> / <span class="c-green bold">unlocks</span>    : Voir ton grade, tes thèmes débloqués et tes badges`);
    printHtml(`    <span class="c-green bold">board</span> / <span class="c-green bold">submit</span>     : Voir le Leaderboard ou publier ton score`);
    printHtml(`    <span class="c-green bold">nick &lt;pseudo&gt;</span>      : Changer ton pseudo (actuel : <span class="c-cyan">${esc(profile.pseudo)}</span>)`);
    printHtml(`    <span class="c-green bold">memo</span>               : Afficher le manuel complet RegEx / PCRE`);
    printHtml(`    <span class="c-green bold">theme &lt;nom&gt;</span>        : Changer de thème (${Object.keys(THEMES).join(', ')})`);
    printHtml(`    <span class="c-green bold">size &lt;12-20&gt;</span>       : Changer la taille de police (ex: size 16)`);
    printHtml(`    <span class="c-green bold">clear</span>              : Nettoyer le terminal et réafficher la bannière`);
    printText("");
    return;
  }

  if (base === "clear" || base === "cls" || base === "banner") {
    outEl.innerHTML = "";
    drawAsciiHeader();
    if (state.active) printMission();
    return;
  }

  if (base === "theme") {
    if (!arg || !setTheme(arg.toLowerCase())) {
      printHtml(`  Thèmes disponibles : <span class="c-cyan">${Object.keys(THEMES).join(', ')}</span>`);
    }
    return;
  }

  if (base === "size") {
    const sz = parseInt(arg, 10);
    if (!sz || sz < 11 || sz > 24) {
      printHtml(`  Usage : <span class="c-cyan">size &lt;12-20&gt;</span>`);
      return;
    }
    setFontSize(`${sz}px`);
    return;
  }

  // --- Easter Eggs Cyber ---
  if (cmd === "rm -rf") {
    printHtml(`<span class="c-red">rm: permission denied</span>`);
    return;
  }
  if (cmd.startsWith("rm -rf /")) {
    runReaperEasterEgg();
    return;
  }
  if (cmd.includes(":(){") || cmd.includes(":|:&")) {
    runForkBombEasterEgg();
    return;
  }
  if (base === "joshua" || base === "wargames") {
    runWoprEasterEgg();
    return;
  }
  if ((base === "grep" && cmd.toLowerCase().includes("flag")) || cmd.includes("/etc/shadow")) {
    triggerSecretFlag();
    return;
  }

  if (base === "xray" || base === "test") {
    if (!arg) { printHtml(`  Usage : <span class="c-cyan">xray &lt;ta_regex&gt;</span>`); return; }
    runXrayInspector(arg);
    return;
  }

  if (base === "memo") { showMemo(); return; }

  if (base === "tree" || base === "stats" || base === "profil" || base === "unlocks") {
    const rk = getOperatorRank();
    printText("");
    printHtml(`  <span class="c-cyan bold">Profil Opérateur : ${esc(profile.pseudo)}</span> <span class="badge-theme">${esc(rk.title)}</span>`);
    printHtml(`  ├── <span class="bold">Progression Campagne :</span> Niveau ${profile.campaignUnlocked}/${TOTAL_MISSIONS}`);
    printHtml(`  ├── <span class="bold">Missions Maîtrisées  :</span> <span class="c-green bold">${profile.masteredIds.length}/${TOTAL_MISSIONS}</span>`);
    printHtml(`  ├── <span class="bold">Meilleure Série      :</span> <span class="c-yellow bold">🔥 ${profile.bestStreak} sans faute</span> (Actuelle : ${profile.streak})`);
    printHtml(`  ├── <span class="bold">Score Cumulé         :</span> <span class="c-yellow bold">${profile.totalScore} pts</span> (Record session : ${profile.bestScore} pts)`);
    printHtml(`  ├── <span class="bold">Hauts Faits (Badges) :</span> ${profile.badges.length ? profile.badges.map(b => `<span class="c-cyan bold">[🏅 ${esc(b)}]</span>`).join(' ') : '<span class="c-dim">Aucun pour le moment</span>'}`);
    printHtml(`  ├── <span class="bold">Thèmes Prestige      :</span>`);
    for (const [k, v] of Object.entries(THEMES)) {
      if (!v.locked) continue;
      const st = isThemeUnlocked(k) ? `<span class="c-green bold">[🔓 DÉBLOQUÉ : theme ${esc(k)}]</span>` : `<span class="c-dim">[🔒 Verrouillé : ${esc(v.unlockHint)}]</span>`;
      printHtml(`  │   ├── <span class="bold">${esc(v.label.padEnd(26))}</span> ${st}`);
    }
    printHtml(`  └── <span class="bold">Architecture des 5 Paliers RegEx :</span>`);
    printHtml(`      ├── <span class="c-cyan">[01..09]</span> Tier 1 : Technicien N1 — Ancres ^ $, Échappement \\. &amp; Quantifieurs`);
    printHtml(`      ├── <span class="c-cyan">[10..18]</span> Tier 2 : Admin Système N2 — Classes \\d \\w \\s, Bornes \\b &amp; {n,m}`);
    printHtml(`      ├── <span class="c-cyan">[19..27]</span> Tier 3 : Analyste SOC N3 — Groupes, Alternation | &amp; Plages Réseau`);
    printHtml(`      ├── <span class="c-cyan">[28..36]</span> Tier 4 : Expert Forensics N4 — Références Arrières \\1 \\2 &amp; Corrélation`);
    printHtml(`      └── <span class="c-cyan">[37..48]</span> Tier 5 : Architecte SecOps N5 — Lookarounds (?=...) (?!...) &amp; SIEM`);
    printText("");
    return;
  }

  if (base === "nick") {
    if (!arg) { printHtml(`  Usage : <span class="c-cyan">nick &lt;ton_pseudo&gt;</span>`); return; }
    profile.pseudo = arg.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 20) || "soc";
    saveProfile();
    printHtml(`  <span class="c-green">[✓]</span> Pseudo défini sur : <span class="c-cyan bold">${esc(profile.pseudo)}</span>`);
    return;
  }

  if (base === "board" || base === "leaderboard") { showLeaderboard(); return; }
  if (base === "submit") { submitScoreToBoard(); return; }

  if (base === "start" || base === "camp" || base === "campagne") {
    startCampaign(parseInt(arg, 10) || profile.campaignUnlocked);
    return;
  }

  if (base === "goto" || base === "cd") {
    const n = parseInt(arg, 10);
    if (!n || n < 1 || n > TOTAL_MISSIONS) {
      printHtml(`  Usage : <span class="c-cyan">goto &lt;1-${TOTAL_MISSIONS}&gt;</span>`);
      return;
    }
    startCampaign(n);
    return;
  }

  if (base === "custom") {
    state.active = false;
    state.wizardStep = 1;
    updatePromptLabel();
    printText("");
    printHtml(`  <span class="c-cyan bold">⚙️ CONFIGURATION D'OPÉRATION SUR-MESURE</span>`);
    printHtml(`  Étape 1/3 — Difficulté [<span class="c-yellow">1</span>=N1, <span class="c-yellow">2</span>=N2, <span class="c-yellow">3</span>=N3, <span class="c-yellow">4</span>=N4, <span class="c-yellow">5</span>=N5, <span class="c-yellow">ALL</span>=Mixte] (défaut: ALL) :`);
    return;
  }

  if (state.active) {
    const m = MISSIONS.find(x => x.id === state.playlist[state.stepIdx]);
    if (base === "exit" || base === "quit" || base === "menu") {
      state.active = false;
      state.awaitingNext = false;
      updatePromptLabel();
      printHtml(`  <span class="c-dim">Session mise en pause. Tape 'start' pour reprendre ou 'help'.</span>`);
      return;
    }
    if (base === "ls") { printMission(); return; }
    if (base === "hint" || base === "indice") {
      if (state.usedHint === 0) state.usedHint = 1;
      printHtml(`  <span class="c-yellow bold">💡 [INDICE SIEM] :</span> ${esc(m.hint)}`);
      return;
    }
    if (base === "sol" || base === "solution") {
      state.usedHint = 2;
      printHtml(`  <span class="c-magenta bold">🔑 [SOLUTION CANONIQUE] :</span> <span class="bold">${esc(m.solution)}</span>`);
      return;
    }
    if (base === "skip" || base === "next") {
      profile.streak = 0;
      saveProfile();
      state.stepIdx++;
      printMission();
      return;
    }
    if (state.awaitingNext) {
      state.stepIdx++;
      printMission();
      return;
    }
    evaluateRegexAttempt(cmd);
    return;
  }

  printHtml(`  <span class="c-red">bash: ${esc(base)}: commande introuvable.</span> Tape <span class="c-cyan bold">help</span> ou <span class="c-cyan bold">start</span>.`);
}

function handleCustomWizard(input) {
  const val = input.trim().toUpperCase();
  if (val === "EXIT" || val === "QUIT") {
    state.wizardStep = 0;
    updatePromptLabel();
    printHtml(`  <span class="c-dim">Configuration annulée.</span>`);
    return;
  }
  if (state.wizardStep === 1) {
    state.wizardData.diff = ["1", "2", "3", "4", "5"].includes(val) ? Number(val) : "ALL";
    state.wizardStep = 2;
    printHtml(`  Étape 2/3 — Thème [<span class="c-yellow">NET</span>, <span class="c-yellow">SYS</span>, <span class="c-yellow">SEC</span>, <span class="c-yellow">ALL</span>] (défaut: ALL) :`);
    return;
  }
  if (state.wizardStep === 2) {
    state.wizardData.theme = ["NET", "SYS", "SEC"].includes(val) ? val : "ALL";
    state.wizardStep = 3;
    printHtml(`  Étape 3/3 — Nombre de missions à tirer au sort [<span class="c-yellow">1-${TOTAL_MISSIONS}</span>] (défaut: 5) :`);
    return;
  }
  if (state.wizardStep === 3) {
    const count = parseInt(val, 10) || 5;
    const pool = MISSIONS.filter(m =>
      (state.wizardData.diff === "ALL" || m.diff === state.wizardData.diff) &&
      (state.wizardData.theme === "ALL" || m.theme === state.wizardData.theme)
    ).map(m => m.id);

    for (let i = pool.length - 1; i > 0; i--) {
      const r = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[r]] = [pool[r], pool[i]];
    }

    state.wizardStep = 0;
    state.playlist = pool.slice(0, Math.min(count, pool.length));
    state.mode = "CUSTOM";
    state.stepIdx = 0;
    state.sessionScore = 0;
    state.active = true;
    printMission();
  }
}

// Historique flèches Haut / Bas
inpEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    if (histIdx + 1 < cmdHistory.length) {
      histIdx++;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    }
  } else if (e.key === 'ArrowDown') {
    if (histIdx > 0) {
      histIdx--;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    } else if (histIdx === 0) {
      histIdx = -1;
      inpEl.value = "";
      e.preventDefault();
    }
  }
});

loadProfile();
drawAsciiHeader();

printHtml(`  • Tape <span class="c-cyan bold">start</span> (ou clique sur <span class="c-cyan">[1:Campagne]</span>) pour lancer la Mission #${String(profile.campaignUnlocked).padStart(2, '0')}/${TOTAL_MISSIONS}.`);
printHtml(`  • Tape <span class="c-cyan bold">stats</span> pour voir les <span class="c-yellow bold">5 Thèmes Prestige</span> et <span class="c-yellow bold">Badges</span> à débloquer (Overclock, Streak, Golf...).`);
printText("");
