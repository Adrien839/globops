<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOB-OPS // SOC & NetAdmin Terminal Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-bg: #0f1419;
      --c-bar-bg: #090c10;
      --c-bar-fg: #e6edf3;
      --c-bar-dim: #7d8590;
      --c-fg: #e6edf3;
      --c-dim: #7d8590;
      --c-border: #30363d;
      --c-cyan: #39c5cf;
      --c-green: #3fb950;
      --c-red: #ff7b72;
      --c-yellow: #d29922;
      --c-magenta: #bc8cff;
      --c-blue: #58a6ff;
      --term-font: 'JetBrains Mono', monospace;
      --term-size: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--c-bg);
      color: var(--c-fg);
      font-family: var(--term-font);
      font-size: var(--term-size);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      transition: background-color 0.15s, color 0.15s;
    }

    /* Zone principale avec centrage horizontal du terminal */
    .terminal-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 24px 20px 32px 20px;
      cursor: text;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    #term-output {
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;
    }

    .log-line { margin-bottom: 1px; }

    /* Classes de coloration sémantique ANSI */
    .c-fg { color: var(--c-fg); }
    .c-dim { color: var(--c-dim); }
    .c-cyan { color: var(--c-cyan); }
    .c-green { color: var(--c-green); }
    .c-red { color: var(--c-red); }
    .c-yellow { color: var(--c-yellow); }
    .c-magenta { color: var(--c-magenta); }
    .c-blue { color: var(--c-blue); }
    .bold { font-weight: bold; }

    .badge-tier {
      background-color: var(--c-blue);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }
    .badge-theme {
      background-color: var(--c-magenta);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }

    /* Ligne de prompt active */
    .prompt-line {
      display: flex;
      align-items: center;
      margin-top: 4px;
      width: 100%;
    }

    .prompt-prefix {
      white-space: nowrap;
      margin-right: 8px;
      user-select: none;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--c-fg);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: var(--c-cyan);
    }

    /* Pied de page minimaliste style barre de statut tmux (centré et lisible sur tous les thèmes) */
    .status-footer {
      height: 36px;
      background-color: var(--c-bar-bg);
      color: var(--c-bar-fg);
      border-top: 1px solid var(--c-border);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      user-select: none;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .footer-inner {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .footer-left, .footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .tmux-tag {
      background: var(--c-green);
      color: #000000;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 2px;
    }

    .nav-cmd {
      color: var(--c-bar-dim);
      cursor: pointer;
      padding: 2px 4px;
      transition: opacity 0.12s;
    }
    .nav-cmd:hover {
      color: var(--c-bar-fg);
      text-decoration: underline;
    }
    .nav-cmd b { color: var(--c-bar-fg); }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--c-bar-dim);
    }

    .term-select {
      background: var(--c-bg);
      color: var(--c-fg);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      padding: 2px 6px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }
    .term-select:hover, .term-select:focus {
      border-color: var(--c-cyan);
    }

    /* Scrollbar discrète */
    .terminal-viewport::-webkit-scrollbar { width: 8px; }
    .terminal-viewport::-webkit-scrollbar-track { background: var(--c-bg); }
    .terminal-viewport::-webkit-scrollbar-thumb {
      background: var(--c-border);
      border-radius: 4px;
    }
    .terminal-viewport::-webkit-scrollbar-thumb:hover { background: var(--c-dim); }
  </style>
</head>

        </div>

        <div class="ctrl-group">
          <span>Taille:</span>
          <select id="size-select" class="term-select" onchange="setFontSize(this.value)">

            <option value="18px">18px</option>
            <option value="20px">20px</option>
          </select>
        </div>
      </div>
    </div>
  </footer>

const MISSIONS = [
  // --- TIER 1 : TECHNICIEN RÉSEAU N1 (Globs Standards) ---

  { id: 25, diff: 3, theme: "SEC", title: "Détection de NOP Sled (+ vs *)",

  { id: 27, diff: 3, theme: "SEC", title: "Pièces jointes Phishing à double extension",

// 3. MOTEUR AST BASH GLOB & EXTGLOB (FIDÈLE À BASH LC_ALL=C)
// =============================================================================
const POSIX_CLASSES = {
  digit: "0123456789",
  xdigit: "0123456789abcdefABCDEF",
  lower: "abcdefghijklmnopqrstuvwxyz",
  upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  alpha: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ",
  alnum: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ",
  punct: "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
};

function parseBracketExpression(pattern, startBracketIdx) {
  let i = startBracketIdx + 1;
  if (i >= pattern.length) return null;
  let negated = false;
  if (pattern[i] === '!' || pattern[i] === '^') { negated = true; i++; }
  const charSet = new Set();
  let first = true;
  while (i < pattern.length) {
    if (pattern[i] === ']' && !first) {
      return { token: { type: 'BRACKET', negated, charSet }, nextIdx: i + 1 };
    }
    first = false;
    if (pattern[i] === '[' && pattern[i + 1] === ':') {
      const closePosix = pattern.indexOf(':]', i + 2);
      if (closePosix !== -1) {
        const cls = pattern.slice(i + 2, closePosix);
        if (POSIX_CLASSES[cls]) {
          for (const ch of POSIX_CLASSES[cls]) charSet.add(ch);
          i = closePosix + 2;
          continue;
        }
      }
    }
    if (i + 2 < pattern.length && pattern[i + 1] === '-' && pattern[i + 2] !== ']') {
      for (let c = pattern.charCodeAt(i); c <= pattern.charCodeAt(i + 2); c++) {
        charSet.add(String.fromCharCode(c));
      }
      i += 3;
      continue;
    }
    charSet.add(pattern[i++]);
  }
  return null;
}

function findClosingParen(pattern, openIdx) {
  let depth = 1, i = openIdx + 1;
  while (i < pattern.length) {
    if (pattern[i] === '[') {
      const br = parseBracketExpression(pattern, i);
      if (br) { i = br.nextIdx; continue; }
    }
    if (pattern[i] === '(') depth++;
    else if (pattern[i] === ')' && --depth === 0) return i;
    i++;
  }
  return -1;
}

function splitTopLevelPipes(innerStr) {
  const branches = [];
  let depth = 0, last = 0, i = 0;
  while (i < innerStr.length) {
    if (innerStr[i] === '[') {
      const br = parseBracketExpression(innerStr, i);
      if (br) { i = br.nextIdx; continue; }
    }
    if (innerStr[i] === '(') depth++;
    else if (innerStr[i] === ')') depth--;
    else if (innerStr[i] === '|' && depth === 0) {
      branches.push(innerStr.slice(last, i));
      last = i + 1;
    }
    i++;
  }
  branches.push(innerStr.slice(last));
  return branches;
}

function parseGlobAST(pattern) {
  const tokens = [];
  let i = 0;
  while (i < pattern.length) {
    const ch = pattern[i];
    if ("?*+@!".includes(ch) && pattern[i + 1] === '(') {
      const closeIdx = findClosingParen(pattern, i + 1);
      if (closeIdx === -1) throw new Error(`Parenthèse ')' manquante pour '${ch}('`);
      const branches = splitTopLevelPipes(pattern.slice(i + 2, closeIdx)).map(parseGlobAST);
      tokens.push({ type: 'EXTGLOB', op: ch, branches });
      i = closeIdx + 1;
      continue;
    }
    if (ch === '*') { tokens.push({ type: 'STAR' }); i++; }
    else if (ch === '?') { tokens.push({ type: 'ANY_CHAR' }); i++; }
    else if (ch === '[') {
      const br = parseBracketExpression(pattern, i);
      if (br) { tokens.push(br.token); i = br.nextIdx; }
      else { tokens.push({ type: 'LITERAL', char: '[' }); i++; }
    } else {
      tokens.push({ type: 'LITERAL', char: ch });
      i++;
    }
  }
  return tokens;
}

function matchTokensExact(tokens, tIdx, str, sIdx, endIdx) {
  if (tIdx === tokens.length) return sIdx === endIdx;
  const tk = tokens[tIdx];
  const isLeadingDot = (sIdx === 0 && str.length > 0 && str[0] === '.');

  if (tk.type === 'LITERAL') {
    return (sIdx < endIdx && str[sIdx] === tk.char)
      ? matchTokensExact(tokens, tIdx + 1, str, sIdx + 1, endIdx) : false;
  }
  if (tk.type === 'ANY_CHAR') {
    if (isLeadingDot || sIdx >= endIdx) return false;
    return matchTokensExact(tokens, tIdx + 1, str, sIdx + 1, endIdx);
  }
  if (tk.type === 'BRACKET') {
    if (isLeadingDot || sIdx >= endIdx) return false;
    const inSet = tk.charSet.has(str[sIdx]);
    return (tk.negated ? !inSet : inSet)
      ? matchTokensExact(tokens, tIdx + 1, str, sIdx + 1, endIdx) : false;
  }
  if (tk.type === 'STAR') {
    if (isLeadingDot) return matchTokensExact(tokens, tIdx + 1, str, sIdx, endIdx);
    for (let k = sIdx; k <= endIdx; k++) {
      if (matchTokensExact(tokens, tIdx + 1, str, k, endIdx)) return true;
    }
    return false;
  }
  if (tk.type === 'EXTGLOB') {
    for (let k = sIdx; k <= endIdx; k++) {
      if (matchExtglobSegment(tk.op, tk.branches, str, sIdx, k) &&
          matchTokensExact(tokens, tIdx + 1, str, k, endIdx)) return true;
    }
    return false;
  }
  return false;
}

function matchesAnyBranch(branches, str, sIdx, endIdx) {
  return branches.some(b => matchTokensExact(b, 0, str, sIdx, endIdx));
}

function matchBranchRep(branches, str, sIdx, endIdx, count) {
  if (sIdx === endIdx) return count >= 1 ? true : matchesAnyBranch(branches, str, sIdx, endIdx);
  for (let m = sIdx + 1; m <= endIdx; m++) {
    if (matchesAnyBranch(branches, str, sIdx, m) &&
        matchBranchRep(branches, str, m, endIdx, count + 1)) return true;
  }
  return false;
}

function matchExtglobSegment(op, branches, str, sIdx, endIdx) {
  const consumesLeadingDot = (sIdx === 0 && endIdx > 0 && str[0] === '.');
  if (op === '@') return matchesAnyBranch(branches, str, sIdx, endIdx);
  if (op === '?') return (sIdx === endIdx) || matchesAnyBranch(branches, str, sIdx, endIdx);
  if (op === '!') return consumesLeadingDot ? false : !matchesAnyBranch(branches, str, sIdx, endIdx);
  if (op === '+') return matchBranchRep(branches, str, sIdx, endIdx, 0);
  if (op === '*') return (sIdx === endIdx) || matchBranchRep(branches, str, sIdx, endIdx, 0);
  return false;
}

function bashGlobMatch(pattern, filename) {
  const ast = parseGlobAST(pattern);
  return matchTokensExact(ast, 0, filename, 0, filename.length);
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}

function printHtml(html = "", cls = "") {
  const div = document.createElement('div');
  div.className = "log-line" + (cls ? " " + cls : "");
  div.innerHTML = html;
  outEl.appendChild(div);
  boxEl.scrollTop = boxEl.scrollHeight;
  return div;
}

function printText(text = "", cls = "") {
  printHtml(esc(text), cls);
}

function setTheme(rawKey, silent = false) {
  const themeKey = THEME_ALIASES[rawKey] || rawKey;
  if (!THEMES[themeKey]) return false;
  profile.theme = themeKey;
  const t = THEMES[themeKey];
  const r = document.documentElement.style;
  r.setProperty('--c-bg', t.bg);
  r.setProperty('--c-bar-bg', t.bar);
  r.setProperty('--c-bar-fg', t.barFg || t.fg);
  r.setProperty('--c-bar-dim', t.barDim || t.dim);
  r.setProperty('--c-fg', t.fg);
  r.setProperty('--c-dim', t.dim);
  r.setProperty('--c-border', t.border);
  r.setProperty('--c-cyan', t.cyan);
  r.setProperty('--c-green', t.green);
  r.setProperty('--c-red', t.red);
  r.setProperty('--c-yellow', t.yellow);
  r.setProperty('--c-magenta', t.magenta);
  r.setProperty('--c-blue', t.blue);
  document.getElementById('theme-select').value = themeKey;
  saveProfile();
  if (!silent) printHtml(`<span class="c-green">[✓]</span> Thème appliqué : <span class="c-cyan bold">${esc(themeKey)}</span>`);
  return true;
}

function setFontFamily(fontVal, silent = false) {
  profile.fontFamily = fontVal;
  document.documentElement.style.setProperty('--term-font', fontVal);
  document.getElementById('font-select').value = fontVal;
  saveProfile();
  if (!silent) printHtml(`<span class="c-green">[✓]</span> Police modifiée : <span class="c-cyan bold">${esc(fontVal.split(',')[0])}</span>`);
}

function setFontSize(sizeVal, silent = false) {
  const normalized = String(sizeVal).endsWith('px') ? sizeVal : `${sizeVal}px`;
  profile.fontSize = normalized;
  document.documentElement.style.setProperty('--term-size', normalized);
  document.getElementById('size-select').value = normalized;
  saveProfile();
  if (!silent) printHtml(`<span class="c-green">[✓]</span> Taille de police : <span class="c-cyan bold">${esc(normalized)}</span>`);
}

function updatePromptLabel() {
  const u = esc(profile.pseudo || "soc");
  if (state.wizardStep > 0) {
    promptLbl.innerHTML = `<span class="c-cyan bold">${u}@glob-ops</span>:<span class="c-blue bold">~/custom</span>$`;
  } else if (state.active) {
    const mid = state.playlist[state.stepIdx];
    promptLbl.innerHTML = `<span class="c-cyan bold">${u}@glob-ops</span>:<span class="c-blue bold">mission-${String(mid).padStart(2, '0')}</span>$`;
  } else {
    promptLbl.innerHTML = `<span class="c-cyan bold">${u}@glob-ops</span>:<span class="c-blue bold">~</span>$`;
  }
}

function loadProfile() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) profile = { ...profile, ...JSON.parse(saved) };
  } catch (e) {}
  if (!setTheme(profile.theme, true)) setTheme("bash-classic", true);
  setFontFamily(profile.fontFamily, true);
  setFontSize(profile.fontSize, true);
  updatePromptLabel();
}

function saveProfile() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(profile)); } catch (e) {}
  updatePromptLabel();
}

function focusPrompt() {
  if (!state.busy && window.getSelection().toString() === "") inpEl.focus();
}

function execFromNav(cmd) {
  if (state.busy) return;
  inpEl.value = cmd;
  handleInput(cmd);
  inpEl.value = "";
  inpEl.focus();
}

function evaluateGlobAttempt(pattern) {
  const mid = state.playlist[state.stepIdx];
  const m = MISSIONS.find(x => x.id === mid);

  if (/\s/.test(pattern)) {
    printHtml(`  <span class="c-yellow">[!] Refusé : Les espaces sont interdits. Écris UN SEUL motif glob unifié.</span>`);
    return;
  }
  if (pattern.includes('{') && pattern.includes('}')) {
    printHtml(`  <span class="c-yellow">[!] Piège classique : '{a,b}' est de la Brace Expansion, pas du globbing !</span>`);
    printHtml(`  <span class="c-dim">    En Bash, utilise l'opérateur extglob '@(a|b)'.</span>`);
    return;
  }
  if (pattern.includes('/')) {
    printHtml(`  <span class="c-yellow">[!] Refusé : Reste dans le répertoire courant (pas de '/').</span>`);
    return;
  }
  if (!/[*?\[(|!]/.test(pattern)) {
    printHtml(`  <span class="c-yellow">[!] Ce motif ne contient aucun opérateur de globbing (*, ?, [...], extglob).</span>`);
    return;
  }

  state.attempts++;
  let tp = [], fp = [], fn = [];
  try {
    for (const t of m.targets) {
      if (bashGlobMatch(pattern, t)) tp.push(t);
      else fn.push(t);
    }
    for (const d of m.decoys) {
      if (bashGlobMatch(pattern, d)) fp.push(d);
    }
  } catch (err) {
    printHtml(`  <span class="c-red">[✗] Erreur de syntaxe : ${esc(err.message)}</span>`);
    return;
  }

  if (tp.length === 0 && fp.length === 0) {
    printHtml(`  <span class="c-red">[✗] Aucun fichier ne correspond au motif :</span> <span class="bold">${esc(pattern)}</span>`);
    return;
  }

  if (fp.length === 0 && fn.length === 0) {
    const elapsed = Math.max(1, Math.floor((Date.now() - state.startTimeMs) / 1000));
    let pts = 100 - (state.attempts - 1) * 15 - (state.usedHint === 1 ? 30 : 0);
    if (pts < 20) pts = 20;
    let speed = elapsed <= 15 ? 30 : (elapsed <= 30 ? 15 : (elapsed <= 60 ? 5 : 0));
    if (state.usedHint === 2) { pts = 10; speed = 0; }
    else if (!profile.masteredIds.includes(m.id)) profile.masteredIds.push(m.id);

    const totalPts = pts + speed;
    state.sessionScore += totalPts;
    profile.totalScore += totalPts;
    if (state.sessionScore > profile.bestScore) profile.bestScore = state.sessionScore;
    if (state.mode === "CAMPAIGN" && m.id >= profile.campaignUnlocked && profile.campaignUnlocked < TOTAL_MISSIONS) {
      profile.campaignUnlocked = m.id + 1;
    }
    saveProfile();

    state.awaitingNext = true;
    printText("");
    printHtml(`  <span class="c-green bold">╔══════════════════════════════════════════════════════════════════════════╗</span>`);
    printHtml(`  <span class="c-green bold">║  [✓] MISSION #${String(m.id).padStart(2, '0')} ACCOMPLIE ! (+${totalPts} pts | ⏱ ${elapsed}s | Bonus vitesse: +${speed} pts)</span>`);
    printHtml(`  <span class="c-green bold">╚══════════════════════════════════════════════════════════════════════════╝</span>`);
    printHtml(`  <span class="bold">Ton motif         :</span> <span class="c-green bold">${esc(pattern)}</span>`);
    printHtml(`  <span class="bold">Solution optimale :</span> <span class="c-cyan bold">${esc(m.solution)}</span>`);
    printText("");
    printHtml(`  <span class="c-yellow bold">Débriefing Technique :</span>`);
    printHtml(`  <span class="c-fg">${esc(m.debrief)}</span>`);
    printText("");
    printHtml(`  <span class="c-dim">👉 Appuie sur [ENTRÉE] pour passer à la mission suivante...</span>`);
    return;
  }

  printText("");
  printHtml(`  <span class="bold">Résultat de l'analyse pour <span class="c-cyan">${esc(pattern)}</span> :</span>`);
  if (tp.length > 0) {
    printHtml(`    <span class="c-green bold">[✓] Cibles capturées (${tp.length}/${m.targets.length}) :</span> ${esc(tp.join('  '))}`);
  }
  if (fp.length > 0) {
    printHtml(`    <span class="c-red bold">[✗] ALERTE FAUX POSITIFS (${fp.length} piège(s) touché(s)) :</span> ${esc(fp.join('  '))}`);
  }
  if (fn.length > 0) {
    printHtml(`    <span class="c-yellow bold">[!] Cibles manquées (${fn.length}) :</span> ${esc(fn.join('  '))}`);
  }
}

async function showLeaderboard() {
  printHtml(`<span class="c-dim">Récupération du Leaderboard TSSR/SOC...</span>`);
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=pseudo,score,mastered&order=score.desc&limit=15`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (res.ok) {
        renderBoardTable(await res.json(), "LEADERBOARD PUBLIC EN LIGNE");
        return;
      }
    } catch (e) {}
  }
  const list = [...profile.localBoard];
  const myBest = Math.max(profile.bestScore, profile.totalScore);
  const ex = list.find(x => x.pseudo === profile.pseudo);
  if (ex) { ex.score = Math.max(ex.score, myBest); ex.mastered = profile.masteredIds.length; }
  else list.push({ pseudo: profile.pseudo, score: myBest, mastered: profile.masteredIds.length });
  list.sort((a, b) => b.score - a.score);
  renderBoardTable(list.slice(0, 10), "LEADERBOARD (Mode Local)");
}

async function submitScoreToBoard() {
  const best = Math.max(profile.bestScore, profile.totalScore);
  if (best <= 0) {
    printHtml(`<span class="c-yellow">[!] Résous au moins une mission avant de publier ton score.</span>`);
    return;
  }
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {

        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ pseudo: profile.pseudo, score: best, mastered: profile.masteredIds.length })

        printHtml(`<span class="c-green bold">[✓] Score de ${best} pts publié sous '${esc(profile.pseudo)}' !</span>`);

}

function handleInput(rawInput) {
  const cmd = rawInput.trim();
  printHtml(`${promptLbl.innerHTML} ${esc(cmd)}`);

  if (state.awaitingNext && cmd === "") {
    state.stepIdx++;
    printMission();
    return;

  cmdHistory.unshift(cmd);
  histIdx = -1;

  if (state.wizardStep > 0) {
    handleCustomWizard(cmd);
    return;
  }

  const parts = cmd.split(/\s+/);

    profile.pseudo = arg.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 20) || "soc";
    saveProfile();
    printHtml(`  <span class="c-green">[✓]</span> Pseudo défini sur : <span class="c-cyan bold">${esc(profile.pseudo)}</span>`);
    return;
  }

  if (base === "board" || base === "leaderboard") { showLeaderboard(); return; }
  if (base === "submit") { submitScoreToBoard(); return; }

  if (base === "start" || base === "camp" || base === "campagne") {
    startCampaign(parseInt(arg, 10) || profile.campaignUnlocked);
    return;
  }

  if (base === "goto" || base === "cd") {
    const n = parseInt(arg, 10);
    if (!n || n < 1 || n > TOTAL_MISSIONS) {
      printHtml(`  Usage : <span class="c-cyan">goto &lt;1-${TOTAL_MISSIONS}&gt;</span>`);
      return;
    }
    startCampaign(n);
    return;
  }

  if (base === "custom") {
    state.active = false;
    state.wizardStep = 1;
    updatePromptLabel();
    printText("");
    printHtml(`  <span class="c-cyan bold">⚙️ CONFIGURATION D'OPÉRATION SUR-MESURE</span>`);
    printHtml(`  Étape 1/3 — Difficulté [<span class="c-yellow">1</span>=N1, <span class="c-yellow">2</span>=N2, <span class="c-yellow">3</span>=N3, <span class="c-yellow">4</span>=N4, <span class="c-yellow">5</span>=N5, <span class="c-yellow">ALL</span>=Mixte] (défaut: ALL) :`);
    return;
  }

  if (state.active) {
    const m = MISSIONS.find(x => x.id === state.playlist[state.stepIdx]);
    if (base === "exit" || base === "quit" || base === "menu") {
      state.active = false;
      state.awaitingNext = false;
      updatePromptLabel();
      printHtml(`  <span class="c-dim">Session mise en pause. Tape 'start' pour reprendre ou 'help'.</span>`);
      return;
    }
    if (base === "ls") { printMission(); return; }
    if (base === "hint" || base === "indice") {
      if (state.usedHint === 0) state.usedHint = 1;
      printHtml(`  <span class="c-yellow bold">💡 [INDICE SOC] :</span> ${esc(m.hint)}`);
      return;
    }
    if (base === "sol" || base === "solution") {
      state.usedHint = 2;
      printHtml(`  <span class="c-magenta bold">🔑 [SOLUTION CANONIQUE] :</span> <span class="bold">${esc(m.solution)}</span>`);
      return;
    }
    if (base === "skip" || base === "next") {
      state.stepIdx++;
      printMission();
      return;
    }
    if (state.awaitingNext) {
      state.stepIdx++;
      printMission();
      return;
    }
    evaluateGlobAttempt(cmd);
    return;
  }

  printHtml(`  <span class="c-red">bash: ${esc(base)}: commande introuvable.</span> Tape <span class="c-cyan bold">help</span> ou <span class="c-cyan bold">start</span>.`);
}

function handleCustomWizard(input) {
  const val = input.trim().toUpperCase();
  if (val === "EXIT" || val === "QUIT") {
    state.wizardStep = 0;
    updatePromptLabel();
    printHtml(`  <span class="c-dim">Configuration annulée.</span>`);
    return;
  }
  if (state.wizardStep === 1) {
    state.wizardData.diff = ["1", "2", "3", "4", "5"].includes(val) ? Number(val) : "ALL";
    state.wizardStep = 2;
    printHtml(`  Étape 2/3 — Thème [<span class="c-yellow">NET</span>, <span class="c-yellow">SYS</span>, <span class="c-yellow">SEC</span>, <span class="c-yellow">ALL</span>] (défaut: ALL) :`);
    return;
  }
  if (state.wizardStep === 2) {
    state.wizardData.theme = ["NET", "SYS", "SEC"].includes(val) ? val : "ALL";
    state.wizardStep = 3;
    printHtml(`  Étape 3/3 — Nombre de missions à tirer au sort [<span class="c-yellow">1-${TOTAL_MISSIONS}</span>] (défaut: 5) :`);
    return;
  }
  if (state.wizardStep === 3) {
    const count = parseInt(val, 10) || 5;
    const pool = MISSIONS.filter(m =>
      (state.wizardData.diff === "ALL" || m.diff === state.wizardData.diff) &&
      (state.wizardData.theme === "ALL" || m.theme === state.wizardData.theme)
    ).map(m => m.id);

    for (let i = pool.length - 1; i > 0; i--) {
      const r = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[r]] = [pool[r], pool[i]];
    }

    state.wizardStep = 0;
    state.playlist = pool.slice(0, Math.min(count, pool.length));
    state.mode = "CUSTOM";
    state.stepIdx = 0;
    state.sessionScore = 0;
    state.active = true;
    printMission();
  }
}

// Historique flèches Haut / Bas
inpEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    if (histIdx + 1 < cmdHistory.length) {
      histIdx++;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    }
  } else if (e.key === 'ArrowDown') {
    if (histIdx > 0) {
      histIdx--;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    } else if (histIdx === 0) {
      histIdx = -1;
      inpEl.value = "";
      e.preventDefault();
    }
  }
});

// Initialisation au démarrage
loadProfile();
drawAsciiHeader();
printText("");
printHtml(`  Bienvenue sur le simulateur <span class="c-cyan bold">GLOB-OPS</span>. Environnement : <span class="c-green">LC_ALL=C | shopt -s extglob nullglob</span>`);
printHtml(`  • Tape <span class="c-cyan bold">start</span> (ou clique sur <span class="c-cyan">[1:Campagne]</span> en bas) pour lancer la Mission #${String(profile.campaignUnlocked).padStart(2, '0')}/${TOTAL_MISSIONS}.`);
printHtml(`  • Tape <span class="c-cyan bold">custom</span> pour un entraînement sur-mesure (N1 à N5), <span class="c-cyan bold">memo</span> pour le cours, ou <span class="c-cyan bold">help</span>.`);
printText("");
</script>
