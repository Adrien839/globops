<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIM-OPS // Modal Tactical Editor Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-bg: #0f1419;
      --c-bar-bg: #090c10;
      --c-bar-fg: #e6edf3;
      --c-bar-dim: #7d8590;
      --c-fg: #e6edf3;
      --c-dim: #7d8590;
      --c-border: #30363d;
      --c-cyan: #39c5cf;
      --c-green: #3fb950;
      --c-red: #ff7b72;
      --c-yellow: #d29922;
      --c-magenta: #bc8cff;
      --c-blue: #58a6ff;
      --term-font: 'JetBrains Mono', monospace;
      --term-size: 14px;
      --cursor-bg: var(--c-cyan);
      --cursor-fg: var(--c-bg);
      --cursor-border: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--c-bg);
      color: var(--c-fg);
      font-family: var(--term-font);
      font-size: var(--term-size);
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      transition: background-color 0.15s, color 0.15s;
    }

    .terminal-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 18px 20px 28px 20px;
      cursor: text;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-inner {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    #term-output {
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;
    }

    .log-line {
      margin-bottom: 1px;
    }
    .box-line {
      white-space: pre;
      overflow-x: auto;
      font-variant-ligatures: none;
    }

    /* Classes de coloration sémantique ANSI */
    .c-fg { color: var(--c-fg); }
    .c-dim { color: var(--c-dim); }
    .c-cyan { color: var(--c-cyan); }
    .c-green { color: var(--c-green); }
    .c-red { color: var(--c-red); }
    .c-yellow { color: var(--c-yellow); }
    .c-magenta { color: var(--c-magenta); }
    .c-blue { color: var(--c-blue); }
    .bold { font-weight: bold; }

    .vim-cursor {
      background-color: var(--cursor-bg);
      color: var(--cursor-fg);
      border-bottom: var(--cursor-border);
      font-weight: bold;
    }

    .badge-tier {
      background-color: var(--c-blue);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }
    .badge-theme {
      background-color: var(--c-magenta);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }
    .badge-golf {
      background-color: var(--c-yellow);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }
    .badge-unlock {
      background-color: var(--c-green);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 7px;
      border-radius: 2px;
    }
    .badge-loot {
      background-color: var(--c-magenta);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 7px;
      border-radius: 2px;
    }

    .vim-helper-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--c-border);
      font-size: 12px;
      user-select: none;
    }

    .key-pill {
      background: var(--c-bar-bg);
      color: var(--c-cyan);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      padding: 1px 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      transition: border-color 0.12s;
    }
    .key-pill:hover {
      border-color: var(--c-cyan);
      color: var(--c-fg);
    }

    .prompt-line {
      display: flex;
      align-items: center;
      margin-top: 6px;
      width: 100%;
    }

    .prompt-prefix {
      white-space: nowrap;
      margin-right: 8px;
      user-select: none;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--c-fg);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: var(--c-cyan);
    }

    .status-footer {
      height: 38px;
      background-color: var(--c-bar-bg);
      color: var(--c-bar-fg);
      border-top: 1px solid var(--c-border);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      user-select: none;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .footer-inner {
      width: 100%;
      max-width: 1220px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .footer-left, .footer-right {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tmux-tag {
      background: var(--c-green);
      color: #000000;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 2px;
    }

    .streak-pill {
      background: var(--c-bar-bg);
      border: 1px solid var(--c-yellow);
      color: var(--c-yellow);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }

    .blitz-pill {
      background: var(--c-red);
      color: #000000;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
      display: none;
    }

    .nav-cmd {
      color: var(--c-bar-dim);
      cursor: pointer;
      padding: 2px 3px;
      transition: opacity 0.12s;
    }
    .nav-cmd:hover {
      color: var(--c-bar-fg);
      text-decoration: underline;
    }
    .nav-cmd b { color: var(--c-bar-fg); }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--c-bar-dim);
    }

    .term-select {
      background: var(--c-bg);
      color: var(--c-fg);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      padding: 2px 5px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }
    .term-select:hover, .term-select:focus {
      border-color: var(--c-cyan);
    }

    .terminal-viewport::-webkit-scrollbar { width: 8px; }
    .terminal-viewport::-webkit-scrollbar-track { background: var(--c-bg); }
    .terminal-viewport::-webkit-scrollbar-thumb {
      background: var(--c-border);
      border-radius: 4px;
    }
    .terminal-viewport::-webkit-scrollbar-thumb:hover { background: var(--c-dim); }
  </style>
</head>
<body>

  <!-- ESPACE TERMINAL CENTRÉ -->
  <main class="terminal-viewport" id="term-box" onclick="focusPrompt()">
    <div class="terminal-inner">
      <div id="term-output"></div>

      <form class="prompt-line" id="prompt-form" onsubmit="onPromptSubmit(event)" autocomplete="off">
        <span class="prompt-prefix" id="prompt-label"></span>
        <input type="text" id="cmd-input" autofocus spellcheck="false" placeholder="Séquence Vim (ex: ci&quot;prod<Esc> ou :%s/a/b/g<CR>) ou 'help'..." />
      </form>

      <!-- BARRE D'INSERTION DE TOUCHES SPÉCIALES VIM -->
      <div class="vim-helper-bar" id="vim-helper">
        <span class="c-dim">Touches Vim :</span>
        <button type="button" class="key-pill" onclick="insertToken('<Esc>')" title="Raccourci : touche Échap">&lt;Esc&gt;</button>
        <button type="button" class="key-pill" onclick="insertToken('<CR>')" title="Entrée pour valider :s ou /search">&lt;CR&gt;</button>
        <button type="button" class="key-pill" onclick="insertToken('<C-a>')" title="Ctrl+A : Incrémenter nombre">&lt;C-a&gt;</button>
        <button type="button" class="key-pill" onclick="insertToken('<C-x>')" title="Ctrl+X : Décrémenter nombre">&lt;C-x&gt;</button>
        <button type="button" class="key-pill" onclick="execFromNav('armory')" title="Voir tes Reliques & Curseurs">🎁 Armurerie</button>
        <button type="button" class="key-pill" onclick="execFromNav('vimrc')" title="Générer et télécharger ton .vimrc">⚙️ Forge .vimrc</button>
        <span class="c-dim" style="margin-left:auto;">[Échap] insère <span class="c-cyan">&lt;Esc&gt;</span></span>
      </div>
    </div>
  </main>

  <!-- PIED DE PAGE STYLE TMUX -->
  <footer class="status-footer">
    <div class="footer-inner">
      <div class="footer-left">
        <span class="tmux-tag">0:vim-ops*</span>
        <span class="streak-pill" id="footer-streak" title="Série sans indice (Multiplicateur)">🔥 0 (x1.0)</span>
        <span class="blitz-pill" id="footer-blitz">⏱ 60s</span>
        <span class="nav-cmd" onclick="execFromNav('start')">[<b>1</b>:Campagne]</span>
        <span class="nav-cmd" onclick="execFromNav('blitz')">[<b>2</b>:Blitz 60s]</span>
        <span class="nav-cmd" onclick="execFromNav('custom')">[<b>3</b>:Custom]</span>
        <span class="nav-cmd" onclick="execFromNav('stats')">[<b>4</b>:Profil]</span>
        <span class="nav-cmd" onclick="execFromNav('armory')">[<b>5</b>:Armurerie]</span>
        <span class="nav-cmd" onclick="execFromNav('vimrc')">[<b>6</b>:.vimrc]</span>
        <span class="nav-cmd" onclick="execFromNav('memo')">[<b>7</b>:Mémo]</span>
        <span class="nav-cmd" onclick="execFromNav('hint')">[<b>8</b>:Indice]</span>
        <span class="nav-cmd" onclick="window.location.href='../'">[<b>↩</b>:Portail]</span>
      </div>

      <div class="footer-right">
        <div class="ctrl-group">
          <span>Thème:</span>
          <select id="theme-select" class="term-select" onchange="setTheme(this.value)">
            <optgroup label="Standards Modernes">
              <option value="bash-classic">Bash / Pop!_OS</option>
              <option value="dracula">Dracula</option>
              <option value="catppuccin">Catppuccin Mocha</option>
              <option value="tokyo-night">Tokyo Night</option>
              <option value="gruvbox">Gruvbox Dark</option>
              <option value="nord">Nord Polar</option>
              <option value="solarized">Solarized Dark</option>
            </optgroup>
            <optgroup label="Univers Sci-Fi & Cyber">
              <option value="jensen">Jensen (Sarif Amber)</option>
              <option value="case">Case (Chiba Matrix)</option>
              <option value="smith">Smith (MegaCity CRT)</option>
              <option value="cyberdyne">Cyberdyne (Skynet HUD)</option>
              <option value="hill-valley">Hill Valley (1985 LED)</option>
              <option value="encom">Encom (MCP Grid)</option>
              <option value="tyrell">Tyrell (LA 2019)</option>
              <option value="nostromo">Nostromo (MU-TH-UR)</option>
              <option value="discovery">Discovery (HAL 9000)</option>
              <option value="black-mesa">Black Mesa (Sector C)</option>
              <option value="arrakis">Arrakis (Spice Melange)</option>
            </optgroup>
            <optgroup label="Machines Historiques">
              <option value="vt100">DEC VT100 (PDP-11)</option>
              <option value="ibm3270">IBM 3270 (Mainframe)</option>
              <option value="c64">Commodore 64</option>
              <option value="amiga">Amiga Workbench 1.3</option>
              <option value="apple2">Apple IIe</option>
              <option value="win98">Windows 98 (MS-DOS)</option>
            </optgroup>
          </select>
        </div>

        <div class="ctrl-group">
          <span>Police (100% Iso):</span>
          <select id="font-select" class="term-select" onchange="setFontFamily(this.value)">
            <option value="'JetBrains Mono', monospace">JetBrains Mono (Défaut)</option>
            <option value="'Fira Code', monospace">Fira Code</option>
            <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
          </select>
        </div>

        <div class="ctrl-group">
          <span>Taille:</span>
          <select id="size-select" class="term-select" onchange="setFontSize(this.value)">
            <option value="12px">12px</option>
            <option value="13px">13px</option>
            <option value="14px">14px</option>
            <option value="15px">15px</option>
            <option value="16px">16px</option>
          </select>
        </div>
      </div>
    </div>
  </footer>

const TOTAL_MISSIONS = MISSIONS.length;

// =============================================================================
// 4. MOTEUR D'EXÉCUTION VIM DÉTERMINISTE
// =============================================================================
function tokenizeVimInput(str) {
  const tokens = [];
  let i = 0;
  while (i < str.length) {
    if (str[i] === '<') {
      const close = str.indexOf('>', i);
      if (close !== -1) {
        const rawTag = str.slice(i + 1, close).toLowerCase();
        if (rawTag === 'esc' || rawTag === 'escape') { tokens.push('<Esc>'); i = close + 1; continue; }
        if (rawTag === 'cr' || rawTag === 'enter' || rawTag === 'return') { tokens.push('<CR>'); i = close + 1; continue; }
        if (rawTag === 'c-a' || rawTag === 'ctrl-a') { tokens.push('<C-a>'); i = close + 1; continue; }
        if (rawTag === 'c-x' || rawTag === 'ctrl-x') { tokens.push('<C-x>'); i = close + 1; continue; }
        if (rawTag === 'bs' || rawTag === 'backspace') { tokens.push('<BS>'); i = close + 1; continue; }
      }
    }
    tokens.push(str[i]);
    i++;
  }
  return tokens;
}

function isWordChar(ch, bigWord = false) {
  if (!ch) return false;
  if (bigWord) return !/\s/.test(ch);
  return /[a-zA-Z0-9_]/.test(ch);
}

function clampCol(lines, r, c, insertMode = false) {
  const len = (lines[r] || "").length;
  if (len === 0) return 0;
  return Math.max(0, Math.min(c, insertMode ? len : len - 1));
}

function findWordMotionCol(line, col, type, count) {
  let c = col;
  const len = line.length;
  const big = (type === 'W' || type === 'B' || type === 'E');
  const base = type.toLowerCase();

  for (let step = 0; step < count; step++) {
    if (base === 'w') {
      if (c < len && isWordChar(line[c], big)) {
        while (c < len && isWordChar(line[c], big)) c++;
      } else if (c < len && !/\s/.test(line[c])) {
        while (c < len && !isWordChar(line[c], big) && !/\s/.test(line[c])) c++;
      }
      while (c < len && /\s/.test(line[c])) c++;
    } else if (base === 'e') {
      if (c + 1 < len) c++;
      while (c < len && /\s/.test(line[c])) c++;
      if (c < len && isWordChar(line[c], big)) {
        while (c + 1 < len && isWordChar(line[c + 1], big)) c++;
      } else {
        while (c + 1 < len && !isWordChar(line[c + 1], big) && !/\s/.test(line[c + 1])) c++;
      }
    } else if (base === 'b') {
      if (c > 0) c--;
      while (c > 0 && /\s/.test(line[c])) c--;
      if (isWordChar(line[c], big)) {
        while (c > 0 && isWordChar(line[c - 1], big)) c--;
      } else {
        while (c > 0 && !isWordChar(line[c - 1], big) && !/\s/.test(line[c - 1])) c--;
      }
    }
  }
  return c;
}

function findTextObjectSpan(line, col, inner, objChar) {
  if (objChar === 'w' || objChar === 'W') {
    const big = (objChar === 'W');
    let s = col, e = col;
    if (isWordChar(line[col], big)) {
      while (s > 0 && isWordChar(line[s - 1], big)) s--;
      while (e < line.length && isWordChar(line[e], big)) e++;
    } else {
      while (s > 0 && !isWordChar(line[s - 1], big) && !/\s/.test(line[s - 1])) s--;
      while (e < line.length && !isWordChar(line[e], big) && !/\s/.test(line[e])) e++;
    }
    if (!inner) {
      while (e < line.length && /\s/.test(line[e])) e++;
    }
    return [s, e];
  }

  if (objChar === '"' || objChar === "'" || objChar === '`') {
    const q = objChar;
    const indices = [];
    for (let i = 0; i < line.length; i++) {
      if (line[i] === q) indices.push(i);
    }
    for (let k = 0; k + 1 < indices.length; k += 2) {
      const open = indices[k], close = indices[k + 1];
      if (col <= close) {
        return inner ? [open + 1, close] : [open, close + 1];
      }
    }
    return null;
  }

  if (objChar === 't') {
    const regex = /<([a-zA-Z0-9_-]+)[^>]*>(.*?)<\/\1>/g;
    let m;
    while ((m = regex.exec(line)) !== null) {
      const fullStart = m.index;
      const fullEnd = m.index + m[0].length;
      const openTagLen = m[0].indexOf('>') + 1;
      const closeTagStart = fullEnd - (`</${m[1]}>`).length;
      if (col <= fullEnd) {
        return inner ? [fullStart + openTagLen, closeTagStart] : [fullStart, fullEnd];
      }
    }
    return null;
  }

  const pairs = {
    '(': ['(', ')'], ')': ['(', ')'], 'b': ['(', ')'],
    '[': ['[', ']'], ']': ['[', ']'],
    '{': ['{', '}'], '}': ['{', '}'], 'B': ['{', '}'],
    '<': ['<', '>'], '>': ['<', '>']
  };
  if (pairs[objChar]) {
    const [op, cl] = pairs[objChar];
    let openIdx = -1;
    let depth = 0;
    for (let i = col; i >= 0; i--) {
      if (line[i] === cl && i !== col) depth++;
      if (line[i] === op) {
        if (depth === 0) { openIdx = i; break; }
        depth--;
      }
    }
    if (openIdx === -1) openIdx = line.indexOf(op, col);
    if (openIdx === -1) return null;
    depth = 0;
    for (let i = openIdx; i < line.length; i++) {
      if (line[i] === op) depth++;
      if (line[i] === cl) {
        depth--;
        if (depth === 0) {
          return inner ? [openIdx + 1, i] : [openIdx, i + 1];
        }
      }
    }
  }
  return null;
}

function vimRegexToJS(vimPat, flags) {
  let jsPat = "";
  for (let i = 0; i < vimPat.length; i++) {
    if (vimPat[i] === '\\' && i + 1 < vimPat.length) {
      const nxt = vimPat[i + 1];
      if (nxt === '(' || nxt === ')' || nxt === '+' || nxt === '?' || nxt === '|') {
        jsPat += nxt;
        i++;
        continue;
      }
      jsPat += '\\' + nxt;
      i++;
    } else if (vimPat[i] === '(' || vimPat[i] === ')' || vimPat[i] === '+') {
      jsPat += '\\' + vimPat[i];
    } else {
      jsPat += vimPat[i];
    }
  }
  return new RegExp(jsPat, flags);
}

function executeExCommand(cmdStr, stateObj) {
  let s = cmdStr.trim();
  if (!s) return;

  if (s.includes('|') && !s.includes('\\|')) {
    const subCmds = s.split('|');
    subCmds.forEach(sc => executeExCommand(sc, stateObj));
    return;
  }

  let { lines, r } = stateObj;

  const gMatch = s.match(/^(?:%|1,\$)?\s*(g!?|v)\/([^/]+)\/d$/);
  if (gMatch) {
    const mode = gMatch[1];
    const re = vimRegexToJS(gMatch[2], "");
    const invert = (mode === 'v' || mode === 'g!');
    stateObj.lines = lines.filter(ln => {
      const matched = re.test(ln);
      return invert ? matched : !matched;
    });
    if (stateObj.lines.length === 0) stateObj.lines = [""];
    stateObj.r = Math.min(r, stateObj.lines.length - 1);
    stateObj.c = clampCol(stateObj.lines, stateObj.r, stateObj.c);
    return;
  }

  const rangeMatch = s.match(/^([0-9.,$%]+)?\s*s([^\w\s])(.*)$/);
  if (rangeMatch) {
    const rangeSpec = rangeMatch[1] || ".";
    const delim = rangeMatch[2];
    const rest = rangeMatch[3];

    const parts = [];
    let cur = "";
    for (let i = 0; i < rest.length; i++) {
      if (rest[i] === '\\' && i + 1 < rest.length) {
        cur += rest[i] + rest[i + 1];
        i++;
      } else if (rest[i] === delim) {
        parts.push(cur);
        cur = "";
      } else {
        cur += rest[i];
      }
    }
    parts.push(cur);

    const pat = parts[0] || "";
    const rep = parts[1] !== undefined ? parts[1] : "";
    const flags = parts[2] || "";

    let startLine = r, endLine = r;
    if (rangeSpec === "%" || rangeSpec === "1,$") {
      startLine = 0; endLine = lines.length - 1;
    } else if (rangeSpec.includes(",")) {
      const [a, b] = rangeSpec.split(",");
      startLine = a === "." ? r : Math.max(0, parseInt(a, 10) - 1);
      endLine = b === "$" ? lines.length - 1 : (b === "." ? r : Math.min(lines.length - 1, parseInt(b, 10) - 1));
    } else if (/^\d+$/.test(rangeSpec)) {
      startLine = endLine = Math.max(0, parseInt(rangeSpec, 10) - 1);
    }

    const reFlags = (flags.includes('g') ? 'g' : '') + (flags.includes('i') ? 'i' : '');
    const regex = vimRegexToJS(pat, reFlags);
    const jsRep = rep.replace(/&/g, "$&").replace(/\\([1-9])/g, "$$$1");

    for (let lnIdx = startLine; lnIdx <= endLine; lnIdx++) {
      if (lines[lnIdx] !== undefined) {
        lines[lnIdx] = lines[lnIdx].replace(regex, jsRep);
      }
    }
    stateObj.c = clampCol(lines, stateObj.r, stateObj.c);
    return;
  }

  if (s === "d") {
    lines.splice(r, 1);
    if (lines.length === 0) lines.push("");
    stateObj.r = Math.min(r, lines.length - 1);
    return;
  }
}

function simulateVimKeystrokes(initialLines, initialCursor, rawKeystrokes) {
  const tokens = tokenizeVimInput(rawKeystrokes);
  const st = {
    lines: [...initialLines],
    r: initialCursor[0],
    c: initialCursor[1],
    reg: "",
    regLinewise: false,
    lastSearch: "",
    lastFind: null
  };

  let lastChangeTokens = [];
  let recordingChange = false;
  let currentChangeStart = 0;

  function runTokenStream(tkList, isReplay = false) {
    let idx = 0;
    let mode = "NORMAL";

    while (idx < tkList.length) {
      if (mode === "INSERT") {
        const tk = tkList[idx++];
        if (tk === '<Esc>') {
          mode = "NORMAL";
          st.c = Math.max(0, st.c - 1);
          if (recordingChange && !isReplay) {
            lastChangeTokens = tkList.slice(currentChangeStart, idx);
            recordingChange = false;
          }
        } else if (tk === '<BS>') {
          if (st.c > 0) {
            const ln = st.lines[st.r];
            st.lines[st.r] = ln.slice(0, st.c - 1) + ln.slice(st.c);
            st.c--;
          }
        } else if (tk === '<CR>') {
          const ln = st.lines[st.r];
          const before = ln.slice(0, st.c);
          const after = ln.slice(st.c);
          st.lines.splice(st.r, 1, before, after);
          st.r++;
          st.c = 0;
        } else if (tk.length === 1) {
          const ln = st.lines[st.r];
          st.lines[st.r] = ln.slice(0, st.c) + tk + ln.slice(st.c);
          st.c++;
        }
        continue;
      }

      let cmdStartIdx = idx;
      let countStr = "";
      while (idx < tkList.length && /^[0-9]$/.test(tkList[idx]) && !(countStr === "" && tkList[idx] === "0")) {
        countStr += tkList[idx++];
      }
      const count = countStr ? parseInt(countStr, 10) : 1;
      if (idx >= tkList.length) break;

      const tk = tkList[idx++];
      if (tk === '<Esc>') continue;

      if (tk === '.') {
        if (lastChangeTokens.length > 0) {
          for (let k = 0; k < count; k++) {
            runTokenStream(lastChangeTokens, true);
          }
        }
        continue;
      }

      if (tk === ':') {
        let exCmd = "";
        while (idx < tkList.length && tkList[idx] !== '<CR>' && tkList[idx] !== '<Esc>') {
          exCmd += tkList[idx++];
        }
        if (idx < tkList.length && (tkList[idx] === '<CR>' || tkList[idx] === '<Esc>')) idx++;
        executeExCommand(exCmd, st);
        continue;
      }

      if (tk === '/') {
        let pat = "";
        while (idx < tkList.length && tkList[idx] !== '<CR>' && tkList[idx] !== '<Esc>') {
          pat += tkList[idx++];
        }
        if (idx < tkList.length) idx++;
        st.lastSearch = pat;
        jumpToSearchMatch(st, pat, 1);
        continue;
      }

      if (tk === '*') {
        const ln = st.lines[st.r];
        const span = findTextObjectSpan(ln, st.c, true, 'w');
        if (span) {
          st.lastSearch = ln.slice(span[0], span[1]);
          jumpToSearchMatch(st, st.lastSearch, 1);
        }
        continue;
      }

      if (tk === 'n') {
        if (st.lastSearch) jumpToSearchMatch(st, st.lastSearch, count);
        continue;
      }

      if (tk === 'h') { st.c = clampCol(st.lines, st.r, st.c - count); continue; }
      if (tk === 'l' || tk === ' ') { st.c = clampCol(st.lines, st.r, st.c + count); continue; }
      if (tk === 'j') { st.r = Math.min(st.lines.length - 1, st.r + count); st.c = clampCol(st.lines, st.r, st.c); continue; }
      if (tk === 'k') { st.r = Math.max(0, st.r - count); st.c = clampCol(st.lines, st.r, st.c); continue; }
      if (tk === '0') { st.c = 0; continue; }
      if (tk === '^') {
        const m = st.lines[st.r].match(/\S/);
        st.c = m ? m.index : 0;
        continue;
      }
      if (tk === '$') { st.c = clampCol(st.lines, st.r, st.lines[st.r].length - 1); continue; }
      if ('wWbBeE'.includes(tk)) {
        st.c = clampCol(st.lines, st.r, findWordMotionCol(st.lines[st.r], st.c, tk, count));
        continue;
      }
      if (tk === 'G') {
        st.r = countStr ? Math.min(st.lines.length - 1, Math.max(0, count - 1)) : st.lines.length - 1;
        st.c = clampCol(st.lines, st.r, st.c);
        continue;
      }
      if (tk === 'g' && idx < tkList.length && tkList[idx] === 'g') {
        idx++;
        st.r = countStr ? Math.min(st.lines.length - 1, Math.max(0, count - 1)) : 0;
        st.c = 0;
        continue;
      }
      if (tk === '%') {
        const pos = findMatchingPairCol(st.lines[st.r], st.c);
        if (pos !== -1) st.c = pos;
        continue;
      }
      if ((tk === 'f' || tk === 't' || tk === 'F' || tk === 'T') && idx < tkList.length) {
        const target = tkList[idx++];
        st.lastFind = { dir: tk, target };
        const newCol = findCharOnLine(st.lines[st.r], st.c, tk, target, count);
        if (newCol !== -1) st.c = newCol;
        continue;
      }
      if (tk === ';' && st.lastFind) {
        const newCol = findCharOnLine(st.lines[st.r], st.c, st.lastFind.dir, st.lastFind.target, count);
        if (newCol !== -1) st.c = newCol;
        continue;
      }

      if (['i', 'a', 'I', 'A', 'o', 'O', 's', 'S', 'C'].includes(tk)) {
        if (!isReplay) { recordingChange = true; currentChangeStart = cmdStartIdx; }
        const ln = st.lines[st.r];
        if (tk === 'i') { mode = "INSERT"; }
        else if (tk === 'a') { st.c = Math.min(ln.length, st.c + 1); mode = "INSERT"; }
        else if (tk === 'I') { const m = ln.match(/\S/); st.c = m ? m.index : 0; mode = "INSERT"; }
        else if (tk === 'A') { st.c = ln.length; mode = "INSERT"; }
        else if (tk === 'o') { st.lines.splice(st.r + 1, 0, ""); st.r++; st.c = 0; mode = "INSERT"; }
        else if (tk === 'O') { st.lines.splice(st.r, 0, ""); st.c = 0; mode = "INSERT"; }
        else if (tk === 's') { st.lines[st.r] = ln.slice(0, st.c) + ln.slice(st.c + count); mode = "INSERT"; }
        else if (tk === 'S') { st.lines[st.r] = ""; st.c = 0; mode = "INSERT"; }
        else if (tk === 'C') { st.lines[st.r] = ln.slice(0, st.c); mode = "INSERT"; }
        continue;
      }

      if (tk === 'x') {
        const ln = st.lines[st.r];
        st.reg = ln.slice(st.c, st.c + count);
        st.regLinewise = false;
        st.lines[st.r] = ln.slice(0, st.c) + ln.slice(st.c + count);
        st.c = clampCol(st.lines, st.r, st.c);
        if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
        continue;
      }
      if (tk === 'D') {
        const ln = st.lines[st.r];
        st.reg = ln.slice(st.c);
        st.regLinewise = false;
        st.lines[st.r] = ln.slice(0, st.c);
        st.c = clampCol(st.lines, st.r, st.c);
        if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
        continue;
      }
      if (tk === 'r' && idx < tkList.length) {
        const repCh = tkList[idx++];
        const ln = st.lines[st.r];
        if (st.c < ln.length) {
          st.lines[st.r] = ln.slice(0, st.c) + repCh.repeat(Math.min(count, ln.length - st.c)) + ln.slice(st.c + count);
        }
        if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
        continue;
      }
      if (tk === '~') {
        let ln = st.lines[st.r];
        for (let k = 0; k < count && st.c < ln.length; k++) {
          const ch = ln[st.c];
          const toggled = ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase();
          ln = ln.slice(0, st.c) + toggled + ln.slice(st.c + 1);
          st.c++;
        }
        st.lines[st.r] = ln;
        st.c = clampCol(st.lines, st.r, st.c);
        if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
        continue;
      }
      if (tk === 'J') {
        for (let k = 0; k < count && st.r + 1 < st.lines.length; k++) {
          const nextLn = st.lines[st.r + 1].replace(/^\s+/, "");
          st.lines[st.r] = st.lines[st.r].replace(/\s+$/, "") + (nextLn ? " " + nextLn : "");
          st.lines.splice(st.r + 1, 1);
        }
        if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
        continue;
      }
      if (tk === '<C-a>' || tk === '<C-x>') {
        const delta = (tk === '<C-a>' ? 1 : -1) * count;
        const ln = st.lines[st.r];
        const numRegex = /-?\d+/g;
        let m;
        while ((m = numRegex.exec(ln)) !== null) {
          const nStart = m.index;
          const nEnd = m.index + m[0].length;
          if (nEnd > st.c) {
            const newVal = String(parseInt(m[0], 10) + delta);
            st.lines[st.r] = ln.slice(0, nStart) + newVal + ln.slice(nEnd);
            st.c = nStart + newVal.length - 1;
            break;
          }
        }
        if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
        continue;
      }
      if (tk === 'p' || tk === 'P') {
        if (st.regLinewise) {
          const insertAt = tk === 'p' ? st.r + 1 : st.r;
          const regLines = st.reg.split("\n");
          st.lines.splice(insertAt, 0, ...regLines);
          st.r = insertAt;
          st.c = 0;
        } else if (st.reg) {
          const ln = st.lines[st.r];
          const pos = tk === 'p' ? Math.min(ln.length, st.c + 1) : st.c;
          st.lines[st.r] = ln.slice(0, pos) + st.reg + ln.slice(pos);
          st.c = pos + st.reg.length - 1;
        }
        if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
        continue;
      }

      if (['d', 'c', 'y', '>', '<'].includes(tk) && idx < tkList.length) {
        const op = tk;
        let subCountStr = "";
        while (idx < tkList.length && /^[0-9]$/.test(tkList[idx]) && !(subCountStr === "" && tkList[idx] === "0")) {
          subCountStr += tkList[idx++];
        }
        const totalCount = count * (subCountStr ? parseInt(subCountStr, 10) : 1);
        if (idx >= tkList.length) break;
        const mTk = tkList[idx++];

        if (mTk === op || mTk === 'G') {
          let startR = st.r;
          let endR = mTk === 'G' ? (subCountStr ? parseInt(subCountStr, 10) - 1 : st.lines.length - 1) : Math.min(st.lines.length - 1, st.r + totalCount - 1);
          if (startR > endR) [startR, endR] = [endR, startR];
          const numLines = endR - startR + 1;

          if (op === 'y') {
            st.reg = st.lines.slice(startR, endR + 1).join("\n");
            st.regLinewise = true;
          } else if (op === 'd') {
            st.reg = st.lines.slice(startR, endR + 1).join("\n");
            st.regLinewise = true;
            st.lines.splice(startR, numLines);
            if (st.lines.length === 0) st.lines.push("");
            st.r = Math.min(startR, st.lines.length - 1);
            st.c = clampCol(st.lines, st.r, st.c);
            if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
          } else if (op === 'c') {
            if (!isReplay) { recordingChange = true; currentChangeStart = cmdStartIdx; }
            st.lines.splice(startR, numLines, "");
            st.r = startR;
            st.c = 0;
            mode = "INSERT";
          } else if (op === '>' || op === '<') {
            for (let rIdx = startR; rIdx <= endR; rIdx++) {
              if (op === '>') st.lines[rIdx] = "  " + st.lines[rIdx];
              else st.lines[rIdx] = st.lines[rIdx].replace(/^ {1,2}/, "");
            }
            if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
          }
          continue;
        }

        let span = null;
        const ln = st.lines[st.r];
        if ((mTk === 'i' || mTk === 'a') && idx < tkList.length) {
          const objCh = tkList[idx++];
          span = findTextObjectSpan(ln, st.c, mTk === 'i', objCh);
        } else if (mTk === '$') {
          span = [st.c, ln.length];
        } else if (mTk === '0') {
          span = [0, st.c];
        } else if ('wWbBeE'.includes(mTk)) {
          let targetCol = findWordMotionCol(ln, st.c, mTk, totalCount);
          if (op === 'c' && (mTk === 'w' || mTk === 'W')) {
            targetCol = findWordMotionCol(ln, st.c, mTk === 'w' ? 'e' : 'E', totalCount) + 1;
          } else if (mTk === 'e' || mTk === 'E') {
            targetCol++;
          }
          span = [Math.min(st.c, targetCol), Math.max(st.c, targetCol)];
        } else if ((mTk === 'f' || mTk === 't') && idx < tkList.length) {
          const targetCh = tkList[idx++];
          const found = findCharOnLine(ln, st.c, mTk, targetCh, totalCount);
          if (found !== -1) span = [st.c, found + 1];
        } else if (mTk === '%') {
          const matchCol = findMatchingPairCol(ln, st.c);
          if (matchCol !== -1) {
            span = [Math.min(st.c, matchCol), Math.max(st.c, matchCol) + 1];
          }
        }

        if (span) {
          const [sCol, eCol] = span;
          st.reg = ln.slice(sCol, eCol);
          st.regLinewise = false;
          if (op === 'd') {
            st.lines[st.r] = ln.slice(0, sCol) + ln.slice(eCol);
            st.c = clampCol(st.lines, st.r, sCol);
            if (!isReplay) lastChangeTokens = tkList.slice(cmdStartIdx, idx);
          } else if (op === 'c') {
            if (!isReplay) { recordingChange = true; currentChangeStart = cmdStartIdx; }
            st.lines[st.r] = ln.slice(0, sCol) + ln.slice(eCol);
            st.c = sCol;
            mode = "INSERT";
          }
        }
      }
    }
  }

  runTokenStream(tokens, false);
  return { lines: st.lines, cursor: [st.r, st.c], keystrokeCount: tokens.length };
}

function findCharOnLine(line, col, dir, target, count) {
  let c = col;
  for (let k = 0; k < count; k++) {
    if (dir === 'f' || dir === 't') {
      const start = (dir === 't' && k > 0) ? c + 2 : c + 1;
      const idx = line.indexOf(target, start);
      if (idx === -1) return -1;
      c = dir === 'f' ? idx : idx - 1;
    } else {
      const idx = line.lastIndexOf(target, c - 1);
      if (idx === -1) return -1;
      c = dir === 'F' ? idx : idx + 1;
    }
  }
  return c;
}

function findMatchingPairCol(line, col) {
  const openChars = "([{";
  const closeChars = ")]}";
  let pIdx = col;
  while (pIdx < line.length && !openChars.includes(line[pIdx]) && !closeChars.includes(line[pIdx])) pIdx++;
  if (pIdx >= line.length) return -1;
  const ch = line[pIdx];
  if (openChars.includes(ch)) {
    const cl = closeChars[openChars.indexOf(ch)];
    let depth = 0;
    for (let i = pIdx; i < line.length; i++) {
      if (line[i] === ch) depth++;
      else if (line[i] === cl && --depth === 0) return i;
    }
  } else {
    const op = openChars[closeChars.indexOf(ch)];
    let depth = 0;
    for (let i = pIdx; i >= 0; i--) {
      if (line[i] === ch) depth++;
      else if (line[i] === op && --depth === 0) return i;
    }
  }
  return -1;
}

function jumpToSearchMatch(st, pat, count) {
  if (!pat) return;
  const totalLines = st.lines.length;
  for (let step = 0; step < count; step++) {
    const curLn = st.lines[st.r];
    const sameIdx = curLn.indexOf(pat, st.c + 1);
    if (sameIdx !== -1) {
      st.c = sameIdx;
      continue;
    }
    for (let offset = 1; offset <= totalLines; offset++) {
      const rIdx = (st.r + offset) % totalLines;
      const found = st.lines[rIdx].indexOf(pat);
      if (found !== -1) {
        st.r = rIdx;
        st.c = found;
        break;
      }
    }
  }
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}

function printHtml(html = "", cls = "") {
  const div = document.createElement('div');
  div.className = "log-line" + (cls ? " " + cls : "");
  div.innerHTML = html;
  outEl.appendChild(div);
  boxEl.scrollTop = boxEl.scrollHeight;
  return div;
}

function printBoxLine(html = "") {
  return printHtml(html, "box-line");
}

function printText(text = "", cls = "") {
  printHtml(esc(text), cls);
}

function getMultiplier() {
  if (profile.streak >= 10) return 3.0;
  if (profile.streak >= 6) return 2.5;
  if (profile.streak >= 4) return 2.0;
  if (profile.streak >= 2) return 1.5;
  return 1.0;
}

function getRankTitle() {
  const n = profile.masteredIds.length;
  let title = RANKS[0].title;
  for (const r of RANKS) {
    if (n >= r.min) title = r.title;
  }
  return title;
}

function updateStreakDisplay() {
  const mult = getMultiplier().toFixed(1);
  footerStreakEl.textContent = `🔥 ${profile.streak} (x${mult})`;
}

function applyCursorSkin(skinId, silent = false) {
  const skin = CURSOR_SKINS.find(s => s.id === skinId) || CURSOR_SKINS[0];
  const unlocked = profile.masteredIds.length >= skin.reqMastered && profile.golfedIds.length >= skin.reqGolf;
  if (!unlocked && !silent) {
    printHtml(`  <span class="c-red">[✗] Curseur verrouillé.</span> Requis : ${skin.reqMastered} missions maîtrisées et ${skin.reqGolf} étoiles Vim-Golf.`);
    return false;
  }
  profile.cursorSkinId = skin.id;
  const r = document.documentElement.style;
  r.setProperty('--cursor-bg', skin.bg);
  r.setProperty('--cursor-fg', skin.fg);
  r.setProperty('--cursor-border', skin.border);
  saveProfile();
  if (!silent) {
    printHtml(`  <span class="c-green">[✓]</span> Style de curseur équipé : <span class="c-cyan bold">${esc(skin.name)}</span>`);
  }
  return true;
}

function checkAndUnlockRewards(elapsedSec) {
  const newBadges = [];
  const newRelics = [];

  function grantBadge(id) {
    if (!profile.badges.includes(id)) {
      profile.badges.push(id);
      const b = BADGES.find(x => x.id === id);
      if (b) newBadges.push(b);
    }
  }

  if (profile.masteredIds.length >= 1) grantBadge("first_blood");
  if (profile.streak >= 3) grantBadge("streak_3");
  if (profile.streak >= 7) grantBadge("streak_7");
  if (profile.streak >= 15) grantBadge("streak_15");
  if (profile.golfedIds.length >= 1) grantBadge("golf_1");
  if (profile.golfedIds.length >= 10) grantBadge("golf_10");
  if (elapsedSec !== null && elapsedSec <= 5) grantBadge("speed_demon");
  if (profile.bestBlitzCount >= 4) grantBadge("blitz_hero");
  if (profile.foundEasterEgg) grantBadge("heretic");

  const tier3Ids = [17, 18, 19, 20, 21, 22, 23, 24];
  if (tier3Ids.every(id => profile.masteredIds.includes(id))) grantBadge("text_surgeon");

  const tier5Ids = [33, 34, 35, 36, 37, 38, 39, 40];
  if (tier5Ids.every(id => profile.masteredIds.includes(id))) grantBadge("ex_alchemist");

  if (profile.masteredIds.length >= TOTAL_MISSIONS) grantBadge("grandmaster");

  RELICS.forEach(rel => {
    if (!profile.relics.includes(rel.id)) {
      if (rel.reqSecret) {
        if (profile.foundEasterEgg) {
          profile.relics.push(rel.id);
          newRelics.push(rel);
        }
        return;
      }
      const okM = profile.masteredIds.length >= rel.reqM;
      const okG = profile.golfedIds.length >= rel.reqG;
      const okB = rel.reqBlitz ? (profile.bestBlitzCount >= rel.reqBlitz) : true;
      if (okM && okG && okB && (rel.reqM > 0 || rel.reqG > 0 || rel.reqBlitz)) {
        profile.relics.push(rel.id);
        newRelics.push(rel);
      }
    }
  });

  if (newBadges.length > 0 || newRelics.length > 0) {
    saveProfile();
    newBadges.forEach(b => {
      printHtml(`  <span class="badge-unlock"> HAUT-FAIT DÉBLOQUÉ </span> <span class="c-yellow bold">${esc(b.name)}</span> — <span class="c-fg">${esc(b.desc)}</span>`);
    });
    newRelics.forEach(r => {
      printHtml(`  <span class="badge-loot"> NOUVELLE RELIQUE </span> <span class="c-cyan bold">${esc(r.name)}</span> <span class="c-dim">(tape 'armory' pour inspecter)</span>`);
    });
  }
}

function setTheme(themeKey, silent = false) {
  if (!THEMES[themeKey]) return false;
  profile.theme = themeKey;
  const t = THEMES[themeKey];
  const r = document.documentElement.style;
  r.setProperty('--c-bg', t.bg);
  r.setProperty('--c-bar-bg', t.bar);
  r.setProperty('--c-bar-fg', t.barFg || t.fg);
  r.setProperty('--c-bar-dim', t.barDim || t.dim);
  r.setProperty('--c-fg', t.fg);
  r.setProperty('--c-dim', t.dim);
  r.setProperty('--c-border', t.border);
  r.setProperty('--c-cyan', t.cyan);
  r.setProperty('--c-green', t.green);
  r.setProperty('--c-red', t.red);
  r.setProperty('--c-yellow', t.yellow);
  r.setProperty('--c-magenta', t.magenta);
  r.setProperty('--c-blue', t.blue);
  document.getElementById('theme-select').value = themeKey;
  saveProfile();
  if (!silent) printHtml(`<span class="c-green">[✓]</span> Thème appliqué : <span class="c-cyan bold">${esc(themeKey)}</span>`);
  return true;
}

function setFontFamily(fontVal, silent = false) {
  profile.fontFamily = fontVal;
  document.documentElement.style.setProperty('--term-font', fontVal);
  document.getElementById('font-select').value = fontVal;
  saveProfile();
  if (!silent) printHtml(`<span class="c-green">[✓]</span> Police isométrique : <span class="c-cyan bold">${esc(fontVal.split(',')[0])}</span>`);
}

function setFontSize(sizeVal, silent = false) {
  const normalized = String(sizeVal).endsWith('px') ? sizeVal : `${sizeVal}px`;
  profile.fontSize = normalized;
  document.documentElement.style.setProperty('--term-size', normalized);
  document.getElementById('size-select').value = normalized;
  saveProfile();
  if (!silent) printHtml(`<span class="c-green">[✓]</span> Taille de police : <span class="c-cyan bold">${esc(normalized)}</span>`);
}

function updatePromptLabel() {
  const u = esc(profile.pseudo || "op");
  if (state.wizardStep > 0) {
    promptLbl.innerHTML = `<span class="c-cyan bold">${u}@vim-ops</span>:<span class="c-blue bold">~/custom</span>$`;
  } else if (state.active) {
    const mid = state.playlist[state.stepIdx];
    const modeBadge = state.mode === "BLITZ" ? `<span class="c-red bold">BLITZ</span>` : `<span class="c-green bold">NORMAL</span>`;
    promptLbl.innerHTML = `${modeBadge} <span class="c-cyan bold">buf-${String(mid).padStart(2, '0')}</span> &gt;`;
  } else {
    promptLbl.innerHTML = `<span class="c-cyan bold">${u}@vim-ops</span>:<span class="c-blue bold">~</span>$`;
  }
  updateStreakDisplay();
}

function loadProfile() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) profile = { ...profile, ...JSON.parse(saved) };
  } catch (e) {}
  if (!setTheme(profile.theme, true)) setTheme("jensen", true);
  const validFonts = ["'JetBrains Mono', monospace", "'Fira Code', monospace", "'IBM Plex Mono', monospace"];
  if (!validFonts.includes(profile.fontFamily)) profile.fontFamily = "'JetBrains Mono', monospace";
  setFontFamily(profile.fontFamily, true);
  setFontSize(profile.fontSize, true);
  applyCursorSkin(profile.cursorSkinId || 1, true);
  updatePromptLabel();
}

function saveProfile() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(profile)); } catch (e) {}
  updatePromptLabel();
}

function focusPrompt() {
  if (!state.busy && window.getSelection().toString() === "") inpEl.focus();
}

function insertToken(tk) {
  const start = inpEl.selectionStart || inpEl.value.length;
  const end = inpEl.selectionEnd || inpEl.value.length;
  inpEl.value = inpEl.value.slice(0, start) + tk + inpEl.value.slice(end);
  inpEl.focus();
  inpEl.setSelectionRange(start + tk.length, start + tk.length);
}

function execFromNav(cmd) {
  if (state.busy) return;
  inpEl.value = cmd;
  handleInput(cmd);
  inpEl.value = "";
  inpEl.focus();
}

function tierName(d) {
  return {
    1: "TIER 1 : SURVIE & NAVIGATION RAPIDE (x, r, I, A, w, f, dd, J)",
    2: "TIER 2 : OPÉRATEURS & COMPTEURS (D, C, dt, 3dd, O, G, ~, d3w)",

    5: "TIER 5 : MAÎTRE EX, REGEX & GLOBAL (:s, :g/re/d, :v/re/d, &, \\1)"
  }[d] || "MODE MIXTE";

function formatLineWithCursor(lineStr, isCursorLine, cursorCol, width) {
  const padded = lineStr.padEnd(width, " ").slice(0, width);
  if (!isCursorLine) return esc(padded);
  const c = Math.min(Math.max(0, cursorCol), width - 1);
  const before = esc(padded.slice(0, c));
  const curChar = esc(padded[c] || " ");
  const after = esc(padded.slice(c + 1, width));
  return `${before}<span class="vim-cursor">${curChar}</span>${after}`;
}

function evaluateVimAttempt(rawSeq) {
  const mid = state.playlist[state.stepIdx];
  const m = MISSIONS.find(x => x.id === mid);

  state.attempts++;
  let res;
  try {
    res = simulateVimKeystrokes(m.initialLines, m.cursor, rawSeq);
  } catch (err) {
    printHtml(`  <span class="c-red">[✗] Erreur d'exécution : ${esc(err.message)}</span>`);
    return;
  }

  const isMatch =
    res.lines.length === m.expectedLines.length &&
    res.lines.every((ln, idx) => ln === m.expectedLines[idx]);

  if (isMatch) {
    const elapsed = Math.max(1, Math.floor((Date.now() - state.startTimeMs) / 1000));
    const strokes = res.keystrokeCount;
    const isGolf = strokes <= m.par && state.usedHint < 2;

    if (state.usedHint === 0) {
      profile.streak++;
      if (profile.streak > profile.bestStreak) profile.bestStreak = profile.streak;
    } else {
      profile.streak = 0;
    }

    const mult = getMultiplier();
    let basePts = 100 - (state.attempts - 1) * 15 - (state.usedHint === 1 ? 35 : 0);
    if (basePts < 25) basePts = 25;
    let speedBonus = elapsed <= 10 ? 35 : (elapsed <= 25 ? 15 : 0);
    let golfBonus = isGolf ? 40 : 0;

    let totalPts = Math.round((basePts + speedBonus + golfBonus) * mult);
    if (state.usedHint === 2) {
      totalPts = 10;
    } else {
      if (!profile.masteredIds.includes(m.id)) profile.masteredIds.push(m.id);
      if (isGolf && !profile.golfedIds.includes(m.id)) profile.golfedIds.push(m.id);
    }

    state.sessionScore += totalPts;
    profile.totalScore += totalPts;
    if (state.sessionScore > profile.bestScore) profile.bestScore = state.sessionScore;
    if (state.mode === "CAMPAIGN" && m.id >= profile.campaignUnlocked && profile.campaignUnlocked < TOTAL_MISSIONS) {
      profile.campaignUnlocked = m.id + 1;
    }

    if (state.mode === "BLITZ") {
      state.blitzSolved++;
      if (state.blitzSolved > profile.bestBlitzCount) profile.bestBlitzCount = state.blitzSolved;
      saveProfile();
      printHtml(`  <span class="c-green bold">[✓] BLITZ #${state.blitzSolved} VALIDÉ ! (+${totalPts} pts | ${strokes} frappes)</span>`);
      checkAndUnlockRewards(elapsed);
      state.stepIdx++;
      printMission();
      return;
    }

    saveProfile();
    state.awaitingNext = true;
    const bannerInner = ` [OK] BUFFER VALIDÉ ! (+${totalPts} pts | ${elapsed}s | Streak: ${profile.streak} [x${mult.toFixed(1)}])`.padEnd(76, " ");
    printText("");
    printBoxLine(`  <span class="c-green bold">╔════════════════════════════════════════════════════════════════════════════╗</span>`);
    printBoxLine(`  <span class="c-green bold">║${esc(bannerInner)}║</span>`);
    printBoxLine(`  <span class="c-green bold">╚════════════════════════════════════════════════════════════════════════════╝</span>`);
    const golfMsg = isGolf
      ? `<span class="badge-golf">* VIM-GOLF ATTEINT ! (${strokes}/${m.par} frappes, +40 pts)</span>`
      : `<span class="c-yellow">${strokes} frappes (Par optimal : ${m.par})</span>`;
    printHtml(`  <span class="bold">Ta séquence       :</span> <span class="c-green bold">${esc(rawSeq)}</span>  ➔  ${golfMsg}`);
    printHtml(`  <span class="bold">Solution optimale :</span> <span class="c-cyan bold">${esc(m.solution)}</span>`);
    printText("");
    printHtml(`  <span class="c-yellow bold">Débriefing Tactique :</span>`);
    printHtml(`  <span class="c-fg">${esc(m.debrief)}</span>`);
    checkAndUnlockRewards(state.usedHint < 2 ? elapsed : null);
    printText("");
    printHtml(`  <span class="c-dim">👉 Appuie sur [ENTRÉE] pour passer à la mission suivante...</span>`);
    return;
  }

  printText("");
  printHtml(`  <span class="c-red bold">[✗] Le buffer produit ne correspond pas à la cible :</span>`);
  res.lines.forEach((ln, idx) => {
    const expLn = m.expectedLines[idx];
    const ok = ln === expLn;
    const tag = ok ? `<span class="c-green">[OK]</span>` : `<span class="c-red">[KO]</span>`;
    const rendered = formatLineWithCursor(ln, idx === res.cursor[0], res.cursor[1], Math.max(ln.length + 1, 20));
    printBoxLine(`    ${tag} <span class="c-dim">L${idx + 1}:</span> ${rendered}`);
  });
  printHtml(`  <span class="c-dim">Astuce : n'oublie pas &lt;Esc&gt; après une insertion (ex: ci"prod&lt;Esc&gt;) ou &lt;CR&gt; après une commande Ex.</span>`);
}

function stopBlitzTimer() {
  if (state.blitzTimerId) {
    clearInterval(state.blitzTimerId);
    state.blitzTimerId = null;
  }
  footerBlitzEl.style.display = "none";
}

function startBlitzMode() {
  stopBlitzTimer();
  const pool = MISSIONS.filter(m => m.par <= 14).map(m => m.id);
  for (let i = pool.length - 1; i > 0; i--) {
    const r = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[r]] = [pool[r], pool[i]];
  }
  state.mode = "BLITZ";
  state.playlist = pool;
  state.stepIdx = 0;
  state.sessionScore = 0;
  state.blitzSolved = 0;
  state.active = true;
  state.wizardStep = 0;
  state.blitzEndMs = Date.now() + 60000;

  footerBlitzEl.style.display = "inline-block";
  footerBlitzEl.textContent = "⏱ 60s";

  printText("");
  printBoxLine(`  <span class="c-red bold">╔════════════════════════════════════════════════════════════════════════════╗</span>`);
  printBoxLine(`  <span class="c-red bold">║  ALERTE INTRUSION : MODE BLITZ 60 SECONDES ACTIVÉ !                        ║</span>`);
  printBoxLine(`  <span class="c-red bold">║  Valide un maximum de buffers avant la fin du compte à rebours (4 = Loot)  ║</span>`);
  printBoxLine(`  <span class="c-red bold">╚════════════════════════════════════════════════════════════════════════════╝</span>`);

  state.blitzTimerId = setInterval(() => {
    const rem = Math.max(0, Math.ceil((state.blitzEndMs - Date.now()) / 1000));

      `set shiftwidth=2            " Indentation de 2 espaces pour > et <`,
      `set tabstop=2 softtabstop=2`,
      `set ignorecase smartcase    " Recherche insensible à la casse sauf si une MAJUSCULE est tapée`,
      `set incsearch hlsearch      " Surlignage temps réel des motifs /pattern`
    );
  } else {
    lines.push(``, `" [VERROUILLÉ] Maîtrise 8 missions pour débloquer le bloc Recherche & Indentation Pro.`);
  }

  if (mCount >= 16) {
    lines.push(
      ``,
      `" --- [PALIER 3 : FLUIDITÉ SYSTÈME & PERSISTANCE (Débloqué à 16 missions)] ---`,
      `set hidden                  " Permet de changer de buffer sans sauvegarder immédiatement`,
      `set undofile                " Historique d'annulation (u) persistant même après fermeture !`,
      `set clipboard=unnamedplus   " Synchronise le registre Vim avec le presse-papier Linux (Pop!_OS)`,
      `set splitbelow splitright   " Ouvre les splits naturellement en bas et à droite`
    );
  } else {
    lines.push(`" [VERROUILLÉ] Maîtrise 16 missions pour débloquer le bloc Undo Persistant & Presse-Papier Linux.`);
  }

  if (mCount >= 24) {
    lines.push(
      ``,
      `" --- [PALIER 4 : RACCOURCIS LEADER & VITESSE PURE (Débloqué à 24 missions)] ---`,
      `let mapleader = " "         " Espace comme touche Leader ultra-accessible`,
      `nnoremap <leader>w :w<CR>   " Sauvegarde éclair avec Espace + w`,
      `nnoremap <leader>q :q<CR>   " Fermeture rapide avec Espace + q`,
      `nnoremap <Esc><Esc> :nohlsearch<CR> " Double Échap pour éteindre le surlignage de recherche`,
      `nnoremap Y y$               " Aligne Y sur le comportement logique de D et C`
    );
  } else {
    lines.push(`" [VERROUILLÉ] Maîtrise 24 missions pour débloquer les Keymaps Leader (Espace).`);
  }

  if (mCount >= 32) {
    lines.push(
      ``,
      `" --- [PALIER 5 : AUTOMATISATION SYSADMIN & SECOPS (Débloqué à 32 missions)] ---`,
      `" Supprime automatiquement les espaces parasites en fin de ligne à chaque sauvegarde :`,
      `autocmd BufWritePre * :%s/\\s\\+$//e`,
      `" Recharge la position exacte du curseur à la réouverture d'un fichier :`,
      `autocmd BufReadPost * if line("'\\"") > 1 && line("'\\"") <= line("$") | exe "normal! g'\\"" | endif`
    );
  } else {
    lines.push(`" [VERROUILLÉ] Maîtrise 32 missions pour débloquer les Autocommands SysAdmin.`);
  }

  return lines.join("\n");
}

function showVimrcForge(download = false) {
  const content = buildDynamicVimrc();
  printText("");
  printBoxLine(`  <span class="c-cyan bold">╔══════════════════════════ FORGE .VIMRC PROGRESSIVE ══════════════════════════╗</span>`);
  printBoxLine(`<span class="c-green">${esc(content)}</span>`);
  printBoxLine(`  <span class="c-cyan bold">╚══════════════════════════════════════════════════════════════════════════════╝</span>`);
  printHtml(`  Tape <span class="c-yellow bold">export</span> pour télécharger ce fichier <span class="c-cyan">.vimrc</span> sur ta machine.`);
  printText("");

  if (download) {
    const blob = new Blob([content + "\n"], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = ".vimrc";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    printHtml(`  <span class="c-green bold">[✓] Fichier '.vimrc' généré et téléchargé avec succès !</span>`);
  }
}

function showLeaderboard() {
  const list = [...profile.localBoard];
  const myBest = Math.max(profile.bestScore, profile.totalScore);
  const ex = list.find(x => x.pseudo === profile.pseudo);
  if (ex) {
    ex.score = Math.max(ex.score, myBest);
    ex.mastered = profile.masteredIds.length;
    ex.golfed = profile.golfedIds.length;
  } else {
    list.push({ pseudo: profile.pseudo, score: myBest, mastered: profile.masteredIds.length, golfed: profile.golfedIds.length });
  }
  list.sort((a, b) => b.score - a.score);

  printText("");
  printHtml(`  <span class="c-cyan bold">=== LEADERBOARD OPÉRATEURS VIM-OPS ===</span>`);
  printBoxLine(`  <span class="c-dim">RANG   PSEUDO               SCORE        MAÎTRISE   VIM-GOLF</span>`);
  printBoxLine(`  <span class="c-dim">────   ──────────────────   ──────────   ────────   ────────</span>`);
  list.slice(0, 10).forEach((r, idx) => {
    const rk = `#${String(idx + 1).padStart(2, '0')}`.padEnd(7);
    const ps = String(r.pseudo).slice(0, 18).padEnd(21);
    const sc = `${r.score} pts`.padEnd(13);
    const ma = `${r.mastered}/${TOTAL_MISSIONS}`.padEnd(11);
    const gf = `* ${r.golfed || 0}/${TOTAL_MISSIONS}`;
    printBoxLine(`  <span class="c-yellow bold">${esc(rk)}</span><span class="c-fg">${esc(ps)}</span><span class="c-green bold">${esc(sc)}</span><span class="c-cyan">${esc(ma)}</span><span class="c-yellow">${esc(gf)}</span>`);
  });
  printText("");
}

// =============================================================================
// 10. INTERPRÉTEUR DE COMMANDES SHELL & BOUCLE PRINCIPALE
// =============================================================================
function startCampaign(startAt) {
  stopBlitzTimer();
  const s = startAt || profile.campaignUnlocked || 1;
  state.playlist = [];
  for (let i = s; i <= TOTAL_MISSIONS; i++) state.playlist.push(i);
  state.mode = "CAMPAIGN";
  state.stepIdx = 0;
  state.sessionScore = 0;
  state.active = true;
  state.wizardStep = 0;
  printMission();
}

function onPromptSubmit(e) {
  e.preventDefault();
  if (state.busy) return;
  const raw = inpEl.value;
  inpEl.value = "";
  handleInput(raw);
}

function handleInput(rawInput) {
  const cmd = rawInput.trim();
  printHtml(`${promptLbl.innerHTML} ${esc(cmd)}`);

  if (state.awaitingNext && cmd === "") {
    state.stepIdx++;
    printMission();
    return;
  }

  if (!cmd) return;
  cmdHistory.unshift(cmd);
  histIdx = -1;

  if (state.wizardStep > 0) {
    handleCustomWizard(cmd);
    return;
  }

  const parts = cmd.split(/\s+/);
  const base = parts[0].toLowerCase();
  const arg = parts.slice(1).join(" ");

  // --- EASTER EGGS ---
  if (cmd === "rm -rf" || cmd === ":!rm -rf") {
    printHtml(`<span class="c-red">rm: permission denied (try harder)</span>`);
    return;
  }
  if (cmd.startsWith("rm -rf /") || cmd.startsWith(":!rm -rf /") || cmd.startsWith("sudo rm -rf /")) {
    runReaperEasterEgg();
    return;
  }
  if (base === "emacs" || cmd.startsWith(":!emacs")) {
    runEmacsEasterEgg();
    return;
  }
  if (base === "nano" || base === "pico" || cmd.startsWith(":!nano")) {
    runNanoEasterEgg();
    return;
  }
  if ((cmd === ":q" || cmd === ":q!" || cmd === ":wq" || cmd === ":qa!") && !state.active) {
    const randExit = Array.from({ length: 8 }, () => "hjkl:;!~@#$%^&*"[Math.floor(Math.random() * 15)]).join("");
    printHtml(`  <span class="c-red bold">E37: No write since last change (Quantum Modal Trap active).</span>`);
    printHtml(`  <span class="c-yellow">Pour quitter Vim, veuillez saisir la séquence de libération : <span class="c-cyan bold">${esc(randExit)}</span> (ou tape 'start').</span>`);
    profile.foundEasterEgg = true;
    checkAndUnlockRewards(null);
    return;
  }

  if (base === "help" || base === "man") {
    printText("");
    printHtml(`  <span class="c-cyan bold">COMMANDES DU SIMULATEUR VIM-OPS :</span>`);
    printHtml(`    <span class="c-green bold">start</span> / <span class="c-green bold">camp</span>       : Lancer la campagne au niveau débloqué (${profile.campaignUnlocked}/${TOTAL_MISSIONS})`);
    printHtml(`    <span class="c-green bold">blitz</span>              : Lancer le mode Contre-la-Montre (60 secondes, relique dédiée)`);
    printHtml(`    <span class="c-green bold">goto &lt;1-${TOTAL_MISSIONS}&gt;</span>        : Aller directement à une mission précise`);
    printHtml(`    <span class="c-green bold">custom</span>             : Configurer un entraînement sur-mesure (Palier N1..N5, Thème)`);
    printHtml(`    <span class="c-green bold">armory</span> / <span class="c-green bold">badges</span>    : Ouvrir l'Armurerie (13 Reliques Cyber, 6 Curseurs, 12 Badges)`);
    printHtml(`    <span class="c-green bold">cursor &lt;1-6&gt;</span>       : Équiper un nouveau style de curseur débloqué`);
    printHtml(`    <span class="c-green bold">vimrc</span> / <span class="c-green bold">export</span>     : Voir et télécharger ton fichier <span class="c-cyan">.vimrc</span> évolutif`);
    printHtml(`    <span class="c-green bold">stats</span> / <span class="c-green bold">board</span>      : Voir ton profil ou le Leaderboard`);
    printHtml(`    <span class="c-green bold">memo</span>               : Afficher l'aide-mémoire complet Vim (Motions, Text Objects, Ex)`);
    printHtml(`    <span class="c-green bold">clear</span>              : Nettoyer l'écran`);
    printText("");
    return;
  }

  if (base === "clear" || base === "cls") {
    outEl.innerHTML = "";
    drawAsciiHeader();
    if (state.active) printMission();
    return;
  }

  if (base === "theme") {
    if (!arg || !setTheme(arg.toLowerCase())) {
      printHtml(`  Thèmes disponibles : <span class="c-cyan">${Object.keys(THEMES).join(', ')}</span>`);
    }
    return;
  }

  if (base === "cursor") {
    const cid = parseInt(arg, 10);
    if (!cid || cid < 1 || cid > CURSOR_SKINS.length) {
      printHtml(`  Usage : <span class="c-cyan">cursor &lt;1-${CURSOR_SKINS.length}&gt;</span> (tape <span class="c-cyan">armory</span> pour voir la liste)`);
      return;
    }
    applyCursorSkin(cid, false);
    if (state.active) printMission();
    return;
  }

  if (base === "memo") { showMemo(); return; }
  if (base === "armory" || base === "badges" || base === "loot") { showArmory(); return; }
  if (base === "vimrc") { showVimrcForge(false); return; }
  if (base === "export") { showVimrcForge(true); return; }
  if (base === "board" || base === "leaderboard" || base === "submit") { showLeaderboard(); return; }
  if (base === "blitz") { startBlitzMode(); return; }

  if (base === "stats" || base === "tree" || base === "profil") {
    printText("");
    printHtml(`  <span class="c-cyan bold">Profil Opérateur : ${esc(profile.pseudo)}</span> — <span class="c-magenta bold">${esc(getRankTitle())}</span>`);
    printHtml(`  ├── <span class="bold">Campagne débloquée :</span> Mission ${profile.campaignUnlocked}/${TOTAL_MISSIONS}`);
    printHtml(`  ├── <span class="bold">Missions maîtrisées:</span> <span class="c-green bold">${profile.masteredIds.length}/${TOTAL_MISSIONS}</span>`);
    printHtml(`  ├── <span class="bold">Insignes Vim-Golf  :</span> <span class="c-yellow bold">* ${profile.golfedIds.length}/${TOTAL_MISSIONS}</span>`);
    printHtml(`  ├── <span class="bold">Reliques Cyber     :</span> <span class="c-cyan bold">${profile.relics.length}/${RELICS.length}</span> (tape 'armory')`);
    printHtml(`  ├── <span class="bold">Record Blitz 60s   :</span> <span class="c-red bold">${profile.bestBlitzCount} buffers</span>`);
    printHtml(`  ├── <span class="bold">Série actuelle     :</span> <span class="c-yellow bold">${profile.streak}</span> (Record : ${profile.bestStreak})`);
    printHtml(`  └── <span class="bold">Architecture des 5 Paliers :</span>`);
    printHtml(`      ├── <span class="c-cyan">[01..08]</span> Tier 1 : Survie &amp; Navigation Rapide (x, r, I, A, w, f, dd, J)`);
    printHtml(`      ├── <span class="c-cyan">[09..16]</span> Tier 2 : Opérateurs &amp; Compteurs (D, C, dt, 3dd, O, G, ~, d3w)`);
    printHtml(`      ├── <span class="c-cyan">[17..24]</span> Tier 3 : Chirurgie Text Objects (ci", di(, da[, ciw, cit, di{, daW)`);
    printHtml(`      ├── <span class="c-cyan">[25..32]</span> Tier 4 : Vitesse Pure, Point &amp; Registres (&lt;C-a&gt;, yyp, ddp, ., *, %)`);
    printHtml(`      └── <span class="c-cyan">[33..40]</span> Tier 5 : Maître Ex, Regex &amp; Global (:s, :g/re/d, :v/re/d, &amp;, \\1)`);
    printText("");
    return;
  }

  if (base === "nick") {
    if (!arg) { printHtml(`  Usage : <span class="c-cyan">nick &lt;ton_pseudo&gt;</span>`); return; }
    profile.pseudo = arg.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 20) || "op";
    saveProfile();
    printHtml(`  <span class="c-green">[✓]</span> Pseudo défini sur : <span class="c-cyan bold">${esc(profile.pseudo)}</span>`);
    return;
  }

  if (base === "start" || base === "camp") {
    startCampaign(parseInt(arg, 10) || profile.campaignUnlocked);
    return;
  }

  if (base === "goto") {
    const n = parseInt(arg, 10);
    if (!n || n < 1 || n > TOTAL_MISSIONS) {
      printHtml(`  Usage : <span class="c-cyan">goto &lt;1-${TOTAL_MISSIONS}&gt;</span>`);
      return;
    }
    startCampaign(n);
    return;
  }

  if (base === "custom") {
    stopBlitzTimer();
    state.active = false;
    state.wizardStep = 1;
    updatePromptLabel();
    printText("");
    printHtml(`  <span class="c-cyan bold">CONFIGURATION D'ENTRAÎNEMENT VIM SUR-MESURE</span>`);
    printHtml(`  Étape 1/3 — Palier [<span class="c-yellow">1</span>=Survie, <span class="c-yellow">2</span>=Opérateurs, <span class="c-yellow">3</span>=TextObjects, <span class="c-yellow">4</span>=Vitesse, <span class="c-yellow">5</span>=Ex/Regex, <span class="c-yellow">ALL</span>=Mixte] :`);
    return;
  }

  if (state.active) {
    const m = MISSIONS.find(x => x.id === state.playlist[state.stepIdx]);
    if (base === "exit" || base === "quit") {
      stopBlitzTimer();
      state.active = false;
      state.awaitingNext = false;
      updatePromptLabel();
      printHtml(`  <span class="c-dim">Session en pause. Tape 'start' pour reprendre.</span>`);
      return;
    }
    if (base === "hint" || base === "indice") {
      if (state.usedHint === 0) state.usedHint = 1;
      printHtml(`  <span class="c-yellow bold">[INDICE TACTIQUE] :</span> ${esc(m.hint)} <span class="c-dim">(Le Streak sera réinitialisé sur cette mission)</span>`);
      return;
    }
    if (base === "sol" || base === "solution") {
      state.usedHint = 2;
      printHtml(`  <span class="c-magenta bold">[SOLUTION OPTIMALE (${m.par} frappes)] :</span> <span class="bold">${esc(m.solution)}</span>`);
      return;
    }
    if (base === "skip" || base === "next") {
      state.stepIdx++;
      printMission();
      return;
    }
    if (state.awaitingNext) {
      state.stepIdx++;
      printMission();
      return;
    }
    evaluateVimAttempt(rawInput.trim());
    return;
  }

  printHtml(`  <span class="c-red">vim-ops: ${esc(base)}: commande inconnue.</span> Tape <span class="c-cyan bold">start</span>, <span class="c-cyan bold">blitz</span>, <span class="c-cyan bold">armory</span> ou <span class="c-cyan bold">help</span>.`);
}

function handleCustomWizard(input) {
  const val = input.trim().toUpperCase();
  if (val === "EXIT" || val === "QUIT") {
    state.wizardStep = 0;
    updatePromptLabel();
    printHtml(`  <span class="c-dim">Configuration annulée.</span>`);
    return;
  }
  if (state.wizardStep === 1) {
    state.wizardData.diff = ["1", "2", "3", "4", "5"].includes(val) ? Number(val) : "ALL";
    state.wizardStep = 2;
    printHtml(`  Étape 2/3 — Contexte [<span class="c-yellow">NET</span>, <span class="c-yellow">SYS</span>, <span class="c-yellow">SEC</span>, <span class="c-yellow">ALL</span>] (défaut: ALL) :`);
    return;
  }
  if (state.wizardStep === 2) {
    state.wizardData.theme = ["NET", "SYS", "SEC"].includes(val) ? val : "ALL";
    state.wizardStep = 3;
    printHtml(`  Étape 3/3 — Nombre de missions [<span class="c-yellow">1-${TOTAL_MISSIONS}</span>] (défaut: 5) :`);
    return;
  }
  if (state.wizardStep === 3) {
    const count = parseInt(val, 10) || 5;
    const pool = MISSIONS.filter(m =>
      (state.wizardData.diff === "ALL" || m.diff === state.wizardData.diff) &&
      (state.wizardData.theme === "ALL" || m.theme === state.wizardData.theme)
    ).map(m => m.id);

    for (let i = pool.length - 1; i > 0; i--) {
      const r = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[r]] = [pool[r], pool[i]];
    }

    state.wizardStep = 0;
    state.playlist = pool.slice(0, Math.min(count, pool.length));
    state.mode = "CUSTOM";
    state.stepIdx = 0;
    state.sessionScore = 0;
    state.active = true;
    printMission();
  }
}

inpEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    insertToken('<Esc>');
    return;
  }
  if (e.key === 'ArrowUp') {
    if (histIdx + 1 < cmdHistory.length) {
      histIdx++;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    }
  } else if (e.key === 'ArrowDown') {
    if (histIdx > 0) {
      histIdx--;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    } else if (histIdx === 0) {
      histIdx = -1;
      inpEl.value = "";
      e.preventDefault();
    }
  }
});
