      color: var(--c-fg);

      line-height: 1.5;
      display: flex;
      flex-direction: column;
      transition: background-color 0.15s, color 0.15s;
    }

    .terminal-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 24px 20px 32px 20px;
      cursor: text;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-inner {
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
    }

    #term-output {
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;

    .c-fg { color: var(--c-fg); }
    .c-dim { color: var(--c-dim); }
    .c-cyan { color: var(--c-cyan); }
    .c-green { color: var(--c-green); }
    .c-red { color: var(--c-red); }

    .c-magenta { color: var(--c-magenta); }

      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }
    .badge-theme {
      background-color: var(--c-magenta);
      color: var(--c-bg);
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }
    .badge-gold {
      background-color: var(--c-yellow);
      color: #000000;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 2px;
    }

    .box-frame {
      border: 1px solid var(--c-border);
      background: rgba(255, 255, 255, 0.02);
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 3px;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      margin-top: 4px;
      width: 100%;
    }

    .prompt-prefix {
      white-space: nowrap;
      margin-right: 8px;
      user-select: none;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--c-fg);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: var(--c-cyan);
    }

    .status-footer {
      height: 36px;
      background-color: var(--c-bar-bg);
      color: var(--c-bar-fg);
      border-top: 1px solid var(--c-border);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      user-select: none;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .footer-inner {
      width: 100%;
      max-width: 1140px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .footer-left, .footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .tmux-tag {
      background: var(--c-cyan);
      color: #000000;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 2px;
    }

    .nav-cmd {
      color: var(--c-bar-dim);
      cursor: pointer;
      padding: 2px 4px;
      transition: opacity 0.12s;
    }
    .nav-cmd:hover {
      color: var(--c-bar-fg);
      text-decoration: underline;
    }
    .nav-cmd b { color: var(--c-bar-fg); }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--c-bar-dim);
    }

    .term-select {
      background: var(--c-bg);
      color: var(--c-fg);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      padding: 2px 6px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }
    .term-select:hover, .term-select:focus {

    .terminal-viewport::-webkit-scrollbar-thumb {
      background: var(--c-border);
      border-radius: 4px;
    }

    canonical: "V P",
    hint: "A a un masque /8 (10.0.0.0/8) donc il voit C (10.0.2.4) en direct (V). Mais C a un masque /16 (10.0.0.0/16) : comment voit-il 10.11.2.1 ?",
    debrief: "Avec son masque /8, A considère 10.0.2.4 dans son réseau et lui envoie la trame directement sur le switch (V). À l'inverse, C a un masque /16 (10.0.0.0/16) : pour lui, A (10.11.2.1) est sur un réseau distant ! C envoie donc son paquet à sa passerelle 10.0.0.254 (qui est dans 10.0.0.0/16), et le routeur X le renvoie à A sur le Réseau 1 (P) !" },

  { id: 23, diff: 3, theme: "CLI", title: "Attribution d'adresse IPv4 en CIDR avec ip addr",

  { id: 24, diff: 3, theme: "CLI", title: "Purge du cache ARP / Voisinage sous Linux (ip neigh)",
    scenario: "Suite à un remplacement de routeur, le cache ARP d'un serveur Debian contient des entrées obsolètes. Quelle commande moderne de la suite 'iproute2' (mentionnée dans ton cours M5) permet de vider intégralement la table de voisinage ARP ?",

  { id: 25, diff: 3, theme: "CLI", title: "Protection contre l'ARP Spoofing : Entrée ARP statique",
    scenario: "Avec la commande 'arp' classique (Windows/Linux), ajoute un enregistrement ARP statique liant l'IP de la passerelle '192.168.1.1' à l'adresse MAC '00-14-22-01-23-45'.",

  { id: 26, diff: 3, theme: "CLI", title: "Diagnostic Windows : Adresses APIPA (169.254.x.x) & DHCP",
    scenario: "Un poste Windows affiche l'adresse IP 169.254.42.18 (masque 255.255.0.0) lors d'un 'ipconfig'. Quel protocole a attribué cette adresse suite à l'échec du serveur DHCP, et quelles sont les 2 commandes 'ipconfig' à enchaîner pour libérer puis redemander un bail DHCP ?",

    promptHint: "Format attendu : <Nom_Protocole> <Commande_1> <Commande_2>",

  { id: 27, diff: 3, theme: "CLI", title: "Résolution DNS corrompue sous Windows (ipconfig)",

  { id: 28, diff: 3, theme: "CLI", title: "Audit des ports en écoute et processus associés (ss / netstat)",
    scenario: "Un serveur Debian présente une activité suspecte. Quelles sont les 5 options classiques (combinées en un seul bloc, ex: -xxxxx) à passer à la commande moderne 'ss' (ou 'netstat') pour lister les sockets TCP (-t), UDP (-u), en écoute (-l), au format numérique (-n) avec le processus associé (-p) ?",

    debrief: "'ss -tulnp' (qui remplace 'netstat -tulnp' sous Debian/Ubuntu) est le réflexe numéro 1 d'un administrateur TSSR et d'un analyste SOC pour identifier quel démon écoute sur quel port." },

  { id: 29, diff: 3, theme: "CLI", title: "Test ICMP borné sous Linux (ping -c)",

  { id: 30, diff: 3, theme: "CLI", title: "Fonctionnement interne de traceroute / tracert (TTL & ICMP)",

  { id: 31, diff: 4, theme: "RTE", title: "Supernetting (TP Partie E #1) : Agrégation de 4 réseaux /24 contigus",
    scenario: "Le routeur R2 dessert les 4 sous-réseaux suivants : 212.56.132.0/24, 212.56.133.0/24, 212.56.134.0/24 et 212.56.135.0/24. Calcule le résumé de route (sur-réseau) en notation CIDR à annoncer au routeur R1.",
    diagram: [
      "  [ R1 ] ◄══════ (Annonce CIDR unique) ══════ [ R2 ] ───┬── 212.56.132.0/24 (10000100)",
      "                                                        ├── 212.56.133.0/24 (10000101)",
      "                                                        ├── 212.56.134.0/24 (10000110)",
      "                                                        └── 212.56.135.0/24 (10000111)"
    ],
    promptHint: "Format attendu : <IP_Sur_Réseau/CIDR>",
    accepted: ["212.56.132.0/22"],
    canonical: "212.56.132.0/22",
    hint: "Regarde les bits du 3e octet (132 à 135) : les 6 premiers bits (128 + 4 = 132) sont identiques. 16 + 6 = /22.",
    debrief: "132 (10000100) à 135 (10000111) est parfaitement aligné sur un multiple de 4 : les 22 premiers bits sont communs, donnant le résumé exact 212.56.132.0/22." },

  { id: 32, diff: 4, theme: "RTE", title: "Supernetting (TP Partie E #2) : Le piège du non-alignement binaire !",
    scenario: "On désire agréger en une seule route les 4 réseaux suivants : 212.56.146.0/24, 212.56.147.0/24, 212.56.148.0/24 et 212.56.149.0/24. Attention : 146 n'est pas un multiple de 4 ! Quel est le résumé de route CIDR englobant ces 4 réseaux ?",
    diagram: [
      "  146 = 10010010  │  147 = 10010011  │  148 = 10010100  │  149 = 10010101",
      "  Combien de bits à gauche sont réellement communs entre 146 et 149 ?"
    ],
    promptHint: "Format attendu : <IP_Sur_Réseau/CIDR>",
    accepted: ["212.56.144.0/21"],
    canonical: "212.56.144.0/21",
    hint: "Entre 147 (10010011) et 148 (10010100), le 6e bit change ! Seuls les 5 premiers bits du 3e octet (10010xxx = 144) sont communs (16 + 5 = /21).",
    debrief: "Piège classique du TP ENI : comme 146..149 chevauche la frontière binaire entre 147 et 148, un /22 ne suffit pas ! Les bits communs s'arrêtent au 21e bit (10010000 = 144), ce qui donne 212.56.144.0/21 (couvrant de .144.0 à .151.255)." },

  { id: 33, diff: 4, theme: "RTE", title: "Supernetting (TP Partie E #3) : Franchissement de la frontière 127/128",
    scenario: "Dans l'exercice E.3 du TP, on veut résumer en une seule route les 64 réseaux allant de 212.1.96.0/24 jusqu'à 212.1.159.0/24 (en passant par 212.1.127.0/24 et 212.1.128.0/24). Quel est le résumé CIDR ?",
    diagram: [
      "  De 212.1.96.0/24 (3e octet = 01100000) jusqu'à 212.1.159.0/24 (3e octet = 10011111)",
      "  Regarde le 1er bit (bit de poids fort) du 3e octet entre 127 (01111111) et 128 (10000000) !"
    ],
    promptHint: "Format attendu : <IP_Sur_Réseau/CIDR>",
    accepted: ["212.1.0.0/16"],
    canonical: "212.1.0.0/16",
    hint: "Comme la plage franchit 127 (0xxxxxxx) vers 128 (1xxxxxxx), AUCUN bit du 3e octet n'est commun ! Il ne reste que les 2 premiers octets (/16).",
    debrief: "Exactement comme dans la correction du TP : puisque la plage traverse la frontière médiane 127 -> 128, même le premier bit du 3e octet bascule de 0 à 1. Le plus grand préfixe commun se réduit aux 16 premiers bits : 212.1.0.0/16 !" },

  { id: 34, diff: 4, theme: "RTE", title: "Supernetting (TP Partie E #4, #5, #6) : Agréger les Classes A, B et C",
    scenario: "En utilisant les bits de poids fort historiques (RFC 790) : écris les 3 résumés de routes CIDR qui agrègent respectivement (1) toutes les adresses de Classe A, (2) toutes les adresses de Classe B, et (3) toutes les adresses de Classe C.",

    promptHint: "Format attendu : <CIDR_Classe_A> <CIDR_Classe_B> <CIDR_Classe_C>",
    accepted: ["0.0.0.0/1 128.0.0.0/2 192.0.0.0/3"],
    canonical: "0.0.0.0/1 128.0.0.0/2 192.0.0.0/3",
    hint: "Classe A fixe 1 bit à 0 (0.0.0.0/1) ; Classe B fixe 2 bits '10' (128.0.0.0/2) ; Classe C fixe 3 bits '110' (192.0.0.0/3).",
    debrief: "C'est la définition mathématique même des classes IPv4 : 0.0.0.0/1 (1er bit = 0), 128.0.0.0/2 (2 premiers bits = 10) et 192.0.0.0/3 (3 premiers bits = 110)." },

  { id: 35, diff: 4, theme: "RTE", title: "Tables de routage minimales (TP Partie D : Routeur R4)",

  { id: 36, diff: 4, theme: "RTE", title: "Commande Cisco IOS : Route statique inter-routeurs (TP Cisco PT)",
    scenario: "Sur un routeur Cisco R1 (interface WAN 10.0.0.1/8 reliée à R2 en 10.0.0.2/8), écris la commande IOS permettant de joindre le LAN distant '192.168.20.0' (masque '255.255.255.0') via le routeur voisin R2 ('10.0.0.2').",

  { id: 37, diff: 4, theme: "RTE", title: "Règle du Longest Prefix Match (LPM) dans une table de routage",
    scenario: "Un routeur reçoit un paquet destiné à '10.1.2.50'. Sa table contient 4 routes qui englobent toutes cette IP : (A) 0.0.0.0/0 via 192.168.1.1 (metric 1), (B) 10.0.0.0/8 via 192.168.1.2 (metric 5), (C) 10.1.0.0/16 via 192.168.1.3 (metric 50), (D) 10.1.2.0/24 via 192.168.1.4 (metric 200). Quel prochain saut (IP) le routeur choisit-il ?",
    diagram: [

    promptHint: "Format attendu : <IP_Prochain_Saut>",
    accepted: ["192.168.1.4", "d"],

    hint: "La longueur du masque (préfixe le plus spécifique : /24 > /16 > /8 > /0) est TOUJOURS prioritaire sur la métrique !",

  { id: 38, diff: 4, theme: "RTE", title: "Comparaison des protocoles de routage dynamique : RIP vs OSPF vs BGP",

    debrief: "Trois classiques d'examen TSSR : RIP plafonne à 15 sauts (16 = injoignable), OSPF construit l'arbre SPF avec l'algorithme de Dijkstra (coût lié à la bande passante), et BGP établit ses sessions entre Systèmes Autonomes (AS) sur le port TCP/179." },

  { id: 39, diff: 4, theme: "RTE", title: "Détection de Boucle de Routage Statique entre 2 Routeurs",

const TOTAL_MISSIONS = MISSIONS.length;

// =============================================================================
// 4. MOTEUR CALCULATEUR IP / CIDR ("TECHNIQUE DU PAS") & SIMULATEUR L2/L3
// =============================================================================
function ipToInt(ip) {
  const p = ip.trim().split('.').map(Number);
  if (p.length !== 4 || p.some(n => isNaN(n) || n < 0 || n > 255)) return null;
  return ((p[0] << 24) >>> 0) + ((p[1] << 16) >>> 0) + ((p[2] << 8) >>> 0) + (p[3] >>> 0);
}

function intToIp(intVal) {
  return [
    (intVal >>> 24) & 255,
    (intVal >>> 16) & 255,
    (intVal >>> 8) & 255,
    intVal & 255
  ].join('.');
}

function intToBinDots(intVal) {
  return [
    ((intVal >>> 24) & 255).toString(2).padStart(8, '0'),
    ((intVal >>> 16) & 255).toString(2).padStart(8, '0'),
    ((intVal >>> 8) & 255).toString(2).padStart(8, '0'),
    (intVal & 255).toString(2).padStart(8, '0')
  ].join('.');
}

function cidrToMaskInt(cidr) {
  if (cidr === 0) return 0;
  return (0xffffffff << (32 - cidr)) >>> 0;
}

function runIpCalc(arg) {
  const m = arg.trim().match(/^(\d+\.\d+\.\d+\.\d+)\s*\/\s*(\d{1,2})$/);
  if (!m) {
    printHtml(`  Usage : <span class="c-cyan bold">ipcalc &lt;IP/CIDR&gt;</span> (ex: <span class="c-green">ipcalc 120.146.80.1/20</span> ou <span class="c-green">ipcalc 172.16.5.40/28</span>)`);
    return;
  }
  const ipStr = m[1];
  const cidr = parseInt(m[2], 10);
  const ipInt = ipToInt(ipStr);
  if (ipInt === null || cidr < 1 || cidr > 32) {
    printHtml(`  <span class="c-red">[✗] Adresse IPv4 ou préfixe CIDR (/1 à /32) invalide.</span>`);
    return;
  }

  const maskInt = cidrToMaskInt(cidr);
  const netInt = (ipInt & maskInt) >>> 0;
  const bcastInt = (netInt | (~maskInt >>> 0)) >>> 0;
  const firstHost = cidr >= 31 ? netInt : (netInt + 1) >>> 0;
  const lastHost = cidr >= 31 ? bcastInt : (bcastInt - 1) >>> 0;
  const nbHosts = cidr >= 31 ? 0 : Math.pow(2, 32 - cidr) - 2;

  const targetOctet = Math.ceil(cidr / 8);
  const maxTranche = targetOctet * 8;
  const remBits = maxTranche - cidr;
  const pas = Math.pow(2, remBits);

  let status = `<span class="c-green bold">OUI (Adresse Hôte Valide)</span>`;
  if (ipInt === netInt) status = `<span class="c-red bold">NON (Adresse de Réseau — bits hôtes tous à 0)</span>`;
  else if (ipInt === bcastInt) status = `<span class="c-red bold">NON (Adresse de Broadcast — bits hôtes tous à 1)</span>`;

  printText("");
  printHtml(`  <span class="c-cyan bold">╔══════════════════ ANALYSEUR BINAIRES &amp; TECHNIQUE DU PAS ══════════════════╗</span>`);
  printHtml(`    <span class="bold">Entrée analysée :</span> <span class="c-yellow bold">${esc(ipStr)}/${cidr}</span>  (Masque : <span class="c-cyan">${intToIp(maskInt)}</span>)`);
  printHtml(`    <span class="bold">Technique du Pas:</span> Octet cible = <span class="c-magenta bold">${targetOctet}e octet</span> │ Bits restants = ${maxTranche}-${cidr} = ${remBits} │ <span class="c-green bold">Pas = 2^${remBits} = ${pas}</span>`);
  printHtml(`    <span class="c-dim">─────────────────────────────────────────────────────────────────────────</span>`);
  printHtml(`    <span class="bold">IP Binaire      :</span> <span class="c-fg">${intToBinDots(ipInt)}</span>`);
  printHtml(`    <span class="bold">Masque Binaire  :</span> <span class="c-dim">${intToBinDots(maskInt)}</span>`);
  printHtml(`    <span class="bold">ID Réseau (AND) :</span> <span class="c-cyan bold">${intToBinDots(netInt)}</span> ➔ <span class="c-cyan bold">${intToIp(netInt)}/${cidr}</span>`);
  printHtml(`    <span class="bold">Broadcast (OR)  :</span> <span class="c-yellow bold">${intToIp(bcastInt)}</span>`);
  printHtml(`    <span class="bold">Plage d'Hôtes   :</span> <span class="c-green">${intToIp(firstHost)}</span> à <span class="c-green">${intToIp(lastHost)}</span> (${nbHosts.toLocaleString('fr-FR')} hôtes utilisables)`);
  printHtml(`    <span class="bold">Valide pour Hôte:</span> ${status}`);
  printHtml(`  <span class="c-cyan bold">╚═══════════════════════════════════════════════════════════════════════════╝</span>`);
  printText("");
}

function runPacketSimulator(arg) {
  const parts = arg.trim().toUpperCase().replace("->", " ").replace("➔", " ").split(/\s+/);
  if (parts.length < 2 || !TP_HOSTS[parts[0]] || !TP_HOSTS[parts[1]]) {
    printHtml(`  Usage : <span class="c-cyan bold">sim &lt;Source&gt; &lt;Dest&gt;</span> parmi les postes du TP (<span class="c-green">A1..A6, B1..B6, C1..C6</span>). Ex: <span class="c-yellow">sim A4 B2</span>`);
    return;
  }
  const sName = parts[0], dName = parts[1];
  const s = TP_HOSTS[sName], d = TP_HOSTS[dName];
  const sIp = ipToInt(s.ip), sMask = ipToInt(s.mask), dIp = ipToInt(d.ip);
  const sNet = (sIp & sMask) >>> 0;
  const dSeenByS = (dIp & sMask) >>> 0;
  const isLocal = (sNet === dSeenByS);

  printText("");
  printHtml(`  <span class="c-magenta bold">📡 SIMULATION PAQUET L2/L3 (Aller simple) : ${sName} (${s.ip}/${s.cidr}) ➔ ${dName} (${d.ip}/${d.cidr})</span>`);
  printHtml(`  <span class="c-dim">├──</span> <span class="bold">[1. Calcul AND sur ${sName}]</span> Réseau logique de ${sName} : <span class="c-cyan bold">${intToIp(sNet)}/${s.cidr}</span>`);

  if (isLocal) {
    printHtml(`  <span class="c-dim">├──</span> <span class="bold">[2. Décision de routage]</span> ${d.ip} &amp; ${s.mask} = ${intToIp(dSeenByS)} ➔ Vue comme <span class="c-yellow bold">LOCALE</span> (Communication directe sans passerelle).`);
    printHtml(`  <span class="c-dim">├──</span> <span class="bold">[3. Résolution ARP L2]</span> ${sName} diffuse <span class="c-cyan">'Who has ${d.ip}? Tell ${s.ip}'</span> (FF:FF:FF:FF:FF:FF) sur le <span class="bold">Switch ${s.dom}</span>.`);
    if (s.dom === d.dom) {
      printHtml(`  <span class="c-dim">└──</span> <span class="c-green bold">[4. Résultat ALLER : OUI ✓]</span> ${dName} est bien branchée sur le Switch ${d.dom} ! Elle répond à l'ARP et reçoit le paquet.`);
    } else {
      printHtml(`  <span class="c-dim">└──</span> <span class="c-red bold">[4. Résultat ALLER : NON ✗]</span> ${dName} est branchée sur le Switch ${d.dom} (isolé par le routeur). Personne ne répond à l'ARP sur le Switch ${s.dom} !`);
    }
  } else {
    printHtml(`  <span class="c-dim">├──</span> <span class="bold">[2. Décision de routage]</span> ${d.ip} est hors de ${intToIp(sNet)}/${s.cidr} ➔ Vue comme <span class="c-yellow bold">DISTANTE</span> (Recours à la passerelle).`);
    if (!s.gw) {
      printHtml(`  <span class="c-dim">└──</span> <span class="c-red bold">[3. Résultat ALLER : NON ✗]</span> Aucune passerelle configurée sur ${sName} ! Paquet abandonné.`);
      printText("");
      return;
    }
    const gwInt = ipToInt(s.gw);
    if (((gwInt & sMask) >>> 0) !== sNet) {
      printHtml(`  <span class="c-dim">└──</span> <span class="c-red bold">[3. Résultat ALLER : NON ✗]</span> La passerelle configurée (${s.gw}) est HORS du sous-réseau ${intToIp(sNet)}/${s.cidr} de ${sName} !`);
      printText("");
      return;
    }
    const rtrIface = TP_ROUTER[s.dom];
    printHtml(`  <span class="c-dim">├──</span> <span class="bold">[3. ARP vers Passerelle]</span> ${sName} cherche sa passerelle <span class="c-cyan">${s.gw}</span> sur le Switch ${s.dom}.`);
    if (s.gw !== rtrIface.ip) {
      printHtml(`  <span class="c-dim">└──</span> <span class="c-red bold">[4. Résultat ALLER : NON ✗]</span> Sur le Switch ${s.dom}, le routeur a l'IP ${rtrIface.ip} (et non ${s.gw}). Aucune réponse ARP !`);
      printText("");
      return;
    }
    printHtml(`  <span class="c-dim">├──</span> <span class="bold">[4. Traversée Routeur]</span> Le routeur (${rtrIface.iface}) reçoit le paquet et consulte sa table de routage pour ${d.ip}.`);
    // Vérifie si l'IP de destination appartient à l'un des 3 réseaux du routeur ET si la machine est dans ce domaine
    let matchedDom = null;
    for (const [domKey, rInfo] of Object.entries(TP_ROUTER)) {

}

}

function populateThemeSelect() {
  const sel = document.getElementById('theme-select');
  const groups = {};
  for (const [k, v] of Object.entries(THEMES)) {
    if (!groups[v.group]) groups[v.group] = [];
    groups[v.group].push({ key: k, ...v });
  }
  sel.innerHTML = "";
  for (const [gName, items] of Object.entries(groups)) {
    const optg = document.createElement('optgroup');
    optg.label = gName;
    for (const it of items) {
      const opt = document.createElement('option');
      opt.value = it.key;
      const unlocked = isThemeUnlocked(it.key);
      opt.disabled = !unlocked;
      opt.textContent = unlocked ? it.label : `🔒 ${it.label} — [${it.unlockHint}]`;
      optg.appendChild(opt);
    }
    sel.appendChild(optg);
  }
  if (THEMES[profile.theme]) sel.value = profile.theme;
}

function setTheme(themeKey, silent = false) {
  if (!THEMES[themeKey]) return false;
  if (!isThemeUnlocked(themeKey)) {
    if (!silent) {
      printHtml(`  <span class="c-yellow">[🔒 Thème verrouillé]</span> Condition requise : <span class="c-cyan bold">${esc(THEMES[themeKey].unlockHint)}</span>`);
    }
    document.getElementById('theme-select').value = profile.theme;
    return false;
  }
  profile.theme = themeKey;
  const t = THEMES[themeKey];
  const r = document.documentElement.style;
  r.setProperty('--c-bg', t.bg);
  r.setProperty('--c-bar-bg', t.bar);
  r.setProperty('--c-bar-fg', t.barFg || t.fg);
  r.setProperty('--c-bar-dim', t.barDim || t.dim);
  r.setProperty('--c-fg', t.fg);
  r.setProperty('--c-dim', t.dim);
  r.setProperty('--c-border', t.border);
  r.setProperty('--c-cyan', t.cyan);
  r.setProperty('--c-green', t.green);
  r.setProperty('--c-red', t.red);
  r.setProperty('--c-yellow', t.yellow);
  r.setProperty('--c-magenta', t.magenta);
  r.setProperty('--c-blue', t.blue);

  if (!silent) printHtml(`<span class="c-green">[✓]</span> Thème appliqué : <span class="c-cyan bold">${esc(t.label)}</span>`);

function normalizeAnswer(str) {
  return str
    .trim()
    .toLowerCase()
    .replace(/[,;]+/g, " ")
    .replace(/\s*->\s*/g, " ")
    .replace(/\s*➔\s*/g, " ")
    .replace(/\s+/g, " ");
}

function evaluateNetAttempt(rawInput) {
  const mid = state.playlist[state.stepIdx];
  const m = MISSIONS.find(x => x.id === mid);
  const norm = normalizeAnswer(rawInput);

  state.attempts++;
  const isCorrect = m.accepted.some(a => normalizeAnswer(a) === norm);

  if (isCorrect) {
    const elapsed = Math.max(1, Math.floor((Date.now() - state.startTimeMs) / 1000));
    let pts = 100 - (state.attempts - 1) * 15 - (state.usedHint === 1 ? 30 : 0);
    if (pts < 20) pts = 20;

    let speed = elapsed <= 15 ? 30 : (elapsed <= 30 ? 15 : (elapsed <= 60 ? 5 : 0));
    let bonusTags = [];

    if (state.usedHint === 2) {
      pts = 10;
      speed = 0;
      profile.streak = 0;
    } else {
      if (!profile.masteredIds.includes(m.id)) profile.masteredIds.push(m.id);

      if (state.attempts === 1 && state.usedHint === 0) {
        profile.streak++;
        if (profile.streak > profile.bestStreak) profile.bestStreak = profile.streak;

        if (elapsed <= 7) {
          speed += 50;
          bonusTags.push("⚡ FAST-CONVERGENCE +50");
          unlockTheme("pipboy", "Mission résolue en moins de 7 secondes du 1er coup !");
          unlockBadge("ZERO-LATENCY", "Résoudre un diagnostic réseau en moins de 7 secondes.");
        }

        if (profile.streak === 3) {
          pts += 25;
          bonusTags.push("🔥 STREAK x3 (+25)");
        } else if (profile.streak === 5) {
          pts += 60;
          bonusTags.push("🔥 STREAK x5 (+60)");
          unlockTheme("wargames", "Série de 5 diagnostics réseau sans la moindre erreur !");
          unlockBadge("FIVE NINE UPTIME (99.999%)", "5 missions consécutives résolues du premier coup.");
        } else if (profile.streak >= 10 && profile.streak % 5 === 0) {
          pts += 120;
          bonusTags.push(`👑 STREAK x${profile.streak} (+120)`);
          unlockBadge("BGP CORE ROUTER", "10 missions consécutives résolues du premier coup.");
        }
      } else {
        profile.streak = 0;
      }
    }

    const totalPts = pts + speed;
    state.sessionScore += totalPts;
    profile.totalScore += totalPts;
    if (state.sessionScore > profile.bestScore) profile.bestScore = state.sessionScore;
    if (state.mode === "CAMPAIGN" && m.id >= profile.campaignUnlocked && profile.campaignUnlocked < TOTAL_MISSIONS) {
      profile.campaignUnlocked = m.id + 1;
    }

    state.awaitingNext = true;
    printText("");
    printHtml(`  <span class="c-green bold">╔══════════════════════════════════════════════════════════════════════════╗</span>`);
    printHtml(`  <span class="c-green bold">║  [✓] MISSION #${String(m.id).padStart(2, '0')} VALIDÉE ! (+${totalPts} pts | ⏱ ${elapsed}s | Streak: 🔥${profile.streak})</span>`);
    printHtml(`  <span class="c-green bold">╚══════════════════════════════════════════════════════════════════════════╝</span>`);
    if (bonusTags.length > 0) {
      printHtml(`  <span class="badge-gold"> BONUS PERFORMANCE </span> <span class="c-yellow bold">${esc(bonusTags.join("  •  "))}</span>`);
    }
    printHtml(`  <span class="bold">Ta réponse        :</span> <span class="c-green bold">${esc(rawInput)}</span>`);
    printHtml(`  <span class="bold">Réponse canonique :</span> <span class="c-cyan bold">${esc(m.canonical)}</span>`);
    printText("");
    printHtml(`  <span class="c-yellow bold">Explication &amp; Débriefing Réseau :</span>`);
    printHtml(`  <span class="c-fg">${esc(m.debrief)}</span>`);

    checkProgressionUnlocks();
    saveProfile();

    printText("");
    printHtml(`  <span class="c-dim">👉 Appuie sur [ENTRÉE] pour passer à la mission suivante...</span>`);
    return;
  }

  profile.streak = 0;
  saveProfile();
  printHtml(`  <span class="c-red">[✗] Diagnostic ou syntaxe incorrecte :</span> <span class="bold">${esc(rawInput)}</span>`);
  printHtml(`  <span class="c-dim">    Vérifie le format demandé (${esc(m.promptHint)}) ou utilise 'ipcalc', 'sim', 'hint'.</span>`);
}

}

async function showLeaderboard() {
  printHtml(`<span class="c-dim">Récupération du Leaderboard NET-OPS...</span>`);
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=pseudo,score,mastered&order=score.desc&limit=15`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (res.ok) {
        renderBoardTable(await res.json(), "LEADERBOARD PUBLIC EN LIGNE");
        return;
      }
    } catch (e) {}
  }
  const list = [...profile.localBoard];
  const myBest = Math.max(profile.bestScore, profile.totalScore);
  const ex = list.find(x => x.pseudo === profile.pseudo);
  if (ex) { ex.score = Math.max(ex.score, myBest); ex.mastered = profile.masteredIds.length; }
  else list.push({ pseudo: profile.pseudo, score: myBest, mastered: profile.masteredIds.length });
  list.sort((a, b) => b.score - a.score);
  renderBoardTable(list.slice(0, 10), "LEADERBOARD (Mode Local)");
}

function renderBoardTable(rows, title) {
  printText("");
  printHtml(`  <span class="c-cyan bold">=== ${esc(title)} ===</span>`);
  printHtml(`  <span class="c-dim">RANG   PSEUDO                 SCORE        MAÎTRISE</span>`);
  printHtml(`  <span class="c-dim">────   ────────────────────   ──────────   ────────</span>`);
  rows.forEach((r, idx) => {
    const rk = `#${String(idx + 1).padStart(2, '0')}`.padEnd(7);
    const ps = String(r.pseudo).slice(0, 20).padEnd(23);
    const sc = `${r.score} pts`.padEnd(13);
    const ma = `${r.mastered}/${TOTAL_MISSIONS}`;
    printHtml(`  <span class="c-yellow bold">${esc(rk)}</span><span class="c-fg">${esc(ps)}</span><span class="c-green bold">${esc(sc)}</span><span class="c-cyan">${esc(ma)}</span>`);
  });
  printHtml(`  <span class="c-dim">Commandes : 'nick &lt;pseudo&gt;' puis 'submit' pour publier ton score.</span>`);
  printText("");
}

async function submitScoreToBoard() {
  const best = Math.max(profile.bestScore, profile.totalScore);
  if (best <= 0) {
    printHtml(`<span class="c-yellow">[!] Résous au moins une mission avant de publier ton score.</span>`);
    return;
  }
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ pseudo: profile.pseudo, score: best, mastered: profile.masteredIds.length })
      });
      if (res.ok) {
        printHtml(`<span class="c-green bold">[✓] Score de ${best} pts publié sous '${esc(profile.pseudo)}' !</span>`);
        showLeaderboard();
        return;
      }
    } catch (e) {}
  }
  printHtml(`<span class="c-green bold">[✓] Score enregistré pour '${esc(profile.pseudo)}' (${best} pts).</span>`);
  showLeaderboard();
}

function startCampaign(startAt) {
  const s = startAt || profile.campaignUnlocked || 1;
  state.playlist = [];
  for (let i = s; i <= TOTAL_MISSIONS; i++) state.playlist.push(i);
  state.mode = "CAMPAIGN";
  state.stepIdx = 0;
  state.sessionScore = 0;
  state.active = true;
  state.wizardStep = 0;
  printMission();
}

function onPromptSubmit(e) {
  e.preventDefault();
  if (state.busy) return;
  const raw = inpEl.value;
  inpEl.value = "";
  handleInput(raw);
}

function handleInput(rawInput) {
  const cmd = rawInput.trim();
  printHtml(`${promptLbl.innerHTML} ${esc(cmd)}`);

  if (state.awaitingNext && cmd === "") {
    state.stepIdx++;
    printMission();
    return;
  }

  if (!cmd) return;
  cmdHistory.unshift(cmd);
  histIdx = -1;

  if (state.wizardStep > 0) {
    handleCustomWizard(cmd);
    return;
  }

  const parts = cmd.split(/\s+/);
  const base = parts[0].toLowerCase();
  const arg = parts.slice(1).join(" ");

  if (base === "help" || base === "man") {
    printText("");
    printHtml(`  <span class="c-cyan bold">COMMANDES &amp; OUTILS RÉSEAU DISPONIBLES :</span>`);
    printHtml(`    <span class="c-green bold">start</span> / <span class="c-green bold">camp</span>           : Lancer la campagne au niveau débloqué (${profile.campaignUnlocked}/${TOTAL_MISSIONS})`);
    printHtml(`    <span class="c-green bold">goto &lt;1-${TOTAL_MISSIONS}&gt;</span>            : Aller directement à une mission précise`);
    printHtml(`    <span class="c-green bold">custom</span>                 : Configurer une session sur-mesure (palier, thème, nombre)`);
    printHtml(`    <span class="c-yellow bold">ipcalc &lt;ip/cidr&gt;</span>       : Calculateur binaire &amp; Technique du Pas (ex: ipcalc 172.16.5.40/28)`);
    printHtml(`    <span class="c-yellow bold">topo</span>                   : Afficher la topologie complète du TP des 3 domaines (A1..C6)`);
    printHtml(`    <span class="c-yellow bold">sim &lt;src&gt; &lt;dst&gt;</span>        : Simuler un paquet L2/L3 entre 2 machines du TP (ex: sim A4 B2)`);
    printHtml(`    <span class="c-green bold">stats</span> / <span class="c-green bold">unlocks</span>        : Voir ton grade, tes thèmes Prestige et tes badges`);
    printHtml(`    <span class="c-green bold">board</span> / <span class="c-green bold">submit</span>         : Voir le Leaderboard ou publier ton score`);
    printHtml(`    <span class="c-green bold">nick &lt;pseudo&gt;</span>          : Changer ton pseudo (actuel : <span class="c-cyan">${esc(profile.pseudo)}</span>)`);
    printHtml(`    <span class="c-green bold">memo</span>                   : Afficher le manuel CIDR, Routage &amp; Commandes iproute2`);
    printHtml(`    <span class="c-green bold">theme &lt;nom&gt;</span>            : Changer de thème (${Object.keys(THEMES).join(', ')})`);
    printHtml(`    <span class="c-green bold">clear</span>                  : Nettoyer le terminal`);
    printText("");
    return;
  }

  if (base === "clear" || base === "cls" || base === "banner") {
    outEl.innerHTML = "";
    drawAsciiHeader();
    if (state.active) printMission();
    return;
  }

  if (base === "ipcalc" || (base === "ip" && parts[1] === "calc")) {
    const target = base === "ipcalc" ? arg : parts.slice(2).join(" ");
    runIpCalc(target);
    return;
  }

  if (base === "topo" || base === "topologie") {
    showTpTopology();
    return;
  }

  if (base === "sim" || base === "trace") {
    runPacketSimulator(arg);
    return;
  }

  if (base === "theme") {
    if (!arg || !setTheme(arg.toLowerCase())) {
      printHtml(`  Thèmes disponibles : <span class="c-cyan">${Object.keys(THEMES).join(', ')}</span>`);
    }
    return;
  }

  if (base === "size") {
    const sz = parseInt(arg, 10);
    if (!sz || sz < 11 || sz > 24) {
      printHtml(`  Usage : <span class="c-cyan">size &lt;12-20&gt;</span>`);
      return;
    }
    setFontSize(`${sz}px`);
    return;
  }

  // --- Easter Eggs Réseau ---
  if (base === "starwars" || (base === "traceroute" && arg.includes("216.81.59.173"))) {
    runStarWarsTraceroute();
    return;
  }
  if (cmd.toLowerCase().includes("blackhole") || cmd.includes("0.0.0.0/0")) {
    if (!state.active) { runBgpBlackholeEasterEgg(); return; }
  }
  if (cmd === "ping 127.0.0.1" || cmd === "ping ::1") {
    printHtml(`  <span class="c-green bold">64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.012 ms — "There's no place like 127.0.0.1 !"</span>`);
    unlockBadge("HOME SWEET HOME", "Pinger la boucle locale 127.0.0.1.");
    return;
  }
  if (cmd.includes("1337") && (base === "tcpdump" || base === "wireshark")) {
    triggerPcapSecretFlag();
    return;
  }

  if (base === "memo") { showMemo(); return; }

  if (base === "tree" || base === "stats" || base === "profil" || base === "unlocks") {
    const rk = getOperatorRank();
    printText("");
    printHtml(`  <span class="c-cyan bold">Profil Opérateur : ${esc(profile.pseudo)}</span> <span class="badge-theme">${esc(rk.title)}</span>`);
    printHtml(`  ├── <span class="bold">Progression Campagne :</span> Niveau ${profile.campaignUnlocked}/${TOTAL_MISSIONS}`);
    printHtml(`  ├── <span class="bold">Missions Maîtrisées  :</span> <span class="c-green bold">${profile.masteredIds.length}/${TOTAL_MISSIONS}</span>`);
    printHtml(`  ├── <span class="bold">Meilleure Série      :</span> <span class="c-yellow bold">🔥 ${profile.bestStreak} sans faute</span> (Actuelle : ${profile.streak})`);
    printHtml(`  ├── <span class="bold">Score Cumulé         :</span> <span class="c-yellow bold">${profile.totalScore} pts</span> (Record session : ${profile.bestScore} pts)`);
    printHtml(`  ├── <span class="bold">Hauts Faits (Badges) :</span> ${profile.badges.length ? profile.badges.map(b => `<span class="c-cyan bold">[🏅 ${esc(b)}]</span>`).join(' ') : '<span class="c-dim">Aucun pour le moment</span>'}`);
    printHtml(`  ├── <span class="bold">Thèmes Prestige      :</span>`);
    for (const [k, v] of Object.entries(THEMES)) {
      if (!v.locked) continue;
      const st = isThemeUnlocked(k) ? `<span class="c-green bold">[🔓 DÉBLOQUÉ : theme ${esc(k)}]</span>` : `<span class="c-dim">[🔒 Verrouillé : ${esc(v.unlockHint)}]</span>`;
      printHtml(`  │   ├── <span class="bold">${esc(v.label.padEnd(28))}</span> ${st}`);
    }
    printHtml(`  └── <span class="bold">Architecture des 5 Paliers NET-OPS :</span>`);
    printHtml(`      ├── <span class="c-cyan">[01..10]</span> Tier 1 : Adressage IPv4, CIDR, Technique du Pas &amp; VLSM`);
    printHtml(`      ├── <span class="c-cyan">[11..20]</span> Tier 2 : Domaines de Diffusion, ARP &amp; TP A1..C6`);
    printHtml(`      ├── <span class="c-cyan">[21..30]</span> Tier 3 : Commandes Linux iproute2, Windows &amp; Dépannage`);
    printHtml(`      ├── <span class="c-cyan">[31..39]</span> Tier 4 : Routage Statique R1..R8, Supernetting &amp; OSPF/BGP`);
    printHtml(`      └── <span class="c-cyan">[40..48]</span> Tier 5 : Captures tcpdump / Wireshark &amp; Forensics Réseau`);
    printText("");
    return;
  }

  if (base === "nick") {
    if (!arg) { printHtml(`  Usage : <span class="c-cyan">nick &lt;ton_pseudo&gt;</span>`); return; }
    profile.pseudo = arg.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 20) || "netadmin";
    saveProfile();
    printHtml(`  <span class="c-green">[✓]</span> Pseudo défini sur : <span class="c-cyan bold">${esc(profile.pseudo)}</span>`);
    return;
  }

  if (base === "board" || base === "leaderboard") { showLeaderboard(); return; }
  if (base === "submit") { submitScoreToBoard(); return; }

  if (base === "start" || base === "camp" || base === "campagne") {
    startCampaign(parseInt(arg, 10) || profile.campaignUnlocked);
    return;
  }

  if (base === "goto" || base === "cd") {
    const n = parseInt(arg, 10);
    if (!n || n < 1 || n > TOTAL_MISSIONS) {
      printHtml(`  Usage : <span class="c-cyan">goto &lt;1-${TOTAL_MISSIONS}&gt;</span>`);
      return;
    }
    startCampaign(n);
    return;
  }

  if (base === "custom") {
    state.active = false;
    state.wizardStep = 1;
    updatePromptLabel();
    printText("");
    printHtml(`  <span class="c-cyan bold">⚙️ CONFIGURATION D'OPÉRATION RÉSEAU SUR-MESURE</span>`);
    printHtml(`  Étape 1/3 — Difficulté [<span class="c-yellow">1</span>=N1 Subnet, <span class="c-yellow">2</span>=N2 ARP/TP, <span class="c-yellow">3</span>=N3 CLI, <span class="c-yellow">4</span>=N4 Routage, <span class="c-yellow">5</span>=N5 tcpdump, <span class="c-yellow">ALL</span>=Mixte] :`);
    return;
  }

  if (state.active) {
    const m = MISSIONS.find(x => x.id === state.playlist[state.stepIdx]);
    if (base === "exit" || base === "quit" || base === "menu") {
      state.active = false;
      state.awaitingNext = false;
      updatePromptLabel();
      printHtml(`  <span class="c-dim">Session mise en pause. Tape 'start' pour reprendre ou 'help'.</span>`);
      return;
    }
    if (base === "ls") { printMission(); return; }
    if (base === "hint" || base === "indice") {
      if (state.usedHint === 0) state.usedHint = 1;
      printHtml(`  <span class="c-yellow bold">💡 [INDICE NOC] :</span> ${esc(m.hint)}`);
      return;
    }
    if (base === "sol" || base === "solution") {
      state.usedHint = 2;
      printHtml(`  <span class="c-magenta bold">🔑 [SOLUTION CANONIQUE] :</span> <span class="bold">${esc(m.canonical)}</span>`);
      return;
    }
    if (base === "skip" || base === "next") {
      profile.streak = 0;
      saveProfile();
      state.stepIdx++;
      printMission();
      return;
    }
    if (state.awaitingNext) {
      state.stepIdx++;
      printMission();
      return;
    }
    evaluateNetAttempt(cmd);
    return;
  }

  printHtml(`  <span class="c-red">bash: ${esc(base)}: commande introuvable.</span> Tape <span class="c-cyan bold">help</span>, <span class="c-cyan bold">topo</span>, <span class="c-cyan bold">ipcalc</span> ou <span class="c-cyan bold">start</span>.`);
}

function handleCustomWizard(input) {
  const val = input.trim().toUpperCase();
  if (val === "EXIT" || val === "QUIT") {
    state.wizardStep = 0;
    updatePromptLabel();
    printHtml(`  <span class="c-dim">Configuration annulée.</span>`);
    return;
  }
  if (state.wizardStep === 1) {
    state.wizardData.diff = ["1", "2", "3", "4", "5"].includes(val) ? Number(val) : "ALL";
    state.wizardStep = 2;
    printHtml(`  Étape 2/3 — Catégorie [<span class="c-yellow">SUB</span>=Subnetting, <span class="c-yellow">ARP</span>=Diffusion/TP, <span class="c-yellow">CLI</span>=Commandes, <span class="c-yellow">RTE</span>=Routage, <span class="c-yellow">SEC</span>=tcpdump, <span class="c-yellow">ALL</span>] :`);
    return;
  }
  if (state.wizardStep === 2) {
    state.wizardData.theme = ["SUB", "ARP", "CLI", "RTE", "SEC"].includes(val) ? val : "ALL";
    state.wizardStep = 3;
    printHtml(`  Étape 3/3 — Nombre de missions [<span class="c-yellow">1-${TOTAL_MISSIONS}</span>] (défaut: 5) :`);
    return;
  }
  if (state.wizardStep === 3) {
    const count = parseInt(val, 10) || 5;
    const pool = MISSIONS.filter(m =>
      (state.wizardData.diff === "ALL" || m.diff === state.wizardData.diff) &&
      (state.wizardData.theme === "ALL" || m.theme === state.wizardData.theme)
    ).map(m => m.id);

    for (let i = pool.length - 1; i > 0; i--) {
      const r = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[r]] = [pool[r], pool[i]];
    }

    state.wizardStep = 0;
    state.playlist = pool.slice(0, Math.min(count, pool.length));
    state.mode = "CUSTOM";
    state.stepIdx = 0;
    state.sessionScore = 0;
    state.active = true;
    printMission();
  }
}

// Historique flèches Haut / Bas
inpEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    if (histIdx + 1 < cmdHistory.length) {
      histIdx++;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    }
  } else if (e.key === 'ArrowDown') {
    if (histIdx > 0) {
      histIdx--;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    } else if (histIdx === 0) {
      histIdx = -1;
      inpEl.value = "";
      e.preventDefault();
    }
  }
});
