<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOB-OPS // Terminal Training Mainframe</title>
  <style>
    :root {
      --bg-color: #141414;
      --font-color: #ff9d00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--font-color);
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px;
      transition: background-color 0.15s, color 0.15s;
    }

    h1.main-title {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 22px;
      text-align: center;
      user-select: none;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
      margin-bottom: 20px;
      font-size: 14px;
      user-select: none;
    }

    .top-nav span {
      cursor: pointer;
      opacity: 0.85;
    }

    .top-nav span:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* Cadre unique minimaliste type NetWatch */
    .terminal-frame {
      width: 100%;
      max-width: 1050px;
      height: 76vh;
      min-height: 480px;
      border: 1px solid var(--font-color);
      padding: 28px 34px;
      overflow-y: auto;
      cursor: text;
      display: flex;
      flex-direction: column;
    }

    #term-output {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line {
      margin-bottom: 2px;
    }

    .dim { opacity: 0.65; }
    .bold { font-weight: bold; }

    /* Ligne de prompt intégrée au flux */
    .prompt-line {
      display: flex;
      align-items: center;
      margin-top: 2px;
      flex-wrap: nowrap;
    }

    .prompt-prefix {
      white-space: nowrap;
      margin-right: 8px;
      user-select: none;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--font-color);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: var(--font-color);
    }

    /* Scrollbar minimaliste */
    .terminal-frame::-webkit-scrollbar { width: 6px; }
    .terminal-frame::-webkit-scrollbar-track { background: transparent; }
    .terminal-frame::-webkit-scrollbar-thumb { background: var(--font-color); opacity: 0.4; }
  </style>
</head>
<body>

  <h1 class="main-title">GlobWatch</h1>

  <nav class="top-nav">
    <span onclick="execFromNav('start')">[ Campagne ]</span>
    <span onclick="execFromNav('custom')">[ Custom ]</span>
    <span onclick="execFromNav('stats')">[ Profil ]</span>
    <span onclick="execFromNav('board')">[ Leaderboard ]</span>
    <span onclick="execFromNav('memo')">[ Memo ]</span>
    <span onclick="execFromNav('help')">[ Help ]</span>
  </nav>

  <main class="terminal-frame" id="term-box" onclick="focusPrompt()">
    <div id="term-output"></div>
    <form class="prompt-line" onsubmit="onPromptSubmit(event)" autocomplete="off">
      <span class="prompt-prefix" id="prompt-label">user@mainframe:~$</span>
      <input type="text" id="cmd-input" autofocus spellcheck="false" />
    </form>
  </main>

<script>

// =============================================================================
// 2. MOTEUR AST BASH GLOB & EXTGLOB (IDENTIQUE À BASH LC_ALL=C)
// =============================================================================
const POSIX_CLASSES = {
  digit: "0123456789",
  xdigit: "0123456789abcdefABCDEF",
  lower: "abcdefghijklmnopqrstuvwxyz",
  upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  alpha: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ",
  alnum: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ",
  punct: "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
};

function parseBracketExpression(pattern, startBracketIdx) {
  let i = startBracketIdx + 1;
  if (i >= pattern.length) return null;
  let negated = false;
  if (pattern[i] === '!' || pattern[i] === '^') { negated = true; i++; }
  const charSet = new Set();
  let first = true;
  while (i < pattern.length) {
    if (pattern[i] === ']' && !first) {
      return { token: { type: 'BRACKET', negated, charSet }, nextIdx: i + 1 };
    }
    first = false;
    if (pattern[i] === '[' && pattern[i + 1] === ':') {
      const closePosix = pattern.indexOf(':]', i + 2);
      if (closePosix !== -1) {
        const cls = pattern.slice(i + 2, closePosix);
        if (POSIX_CLASSES[cls]) {
          for (const ch of POSIX_CLASSES[cls]) charSet.add(ch);
          i = closePosix + 2;
          continue;
        }
      }
    }
    if (i + 2 < pattern.length && pattern[i + 1] === '-' && pattern[i + 2] !== ']') {
      for (let c = pattern.charCodeAt(i); c <= pattern.charCodeAt(i + 2); c++) {
        charSet.add(String.fromCharCode(c));
      }
      i += 3;
      continue;
    }
    charSet.add(pattern[i++]);
  }
  return null;
}

function findClosingParen(pattern, openIdx) {
  let depth = 1, i = openIdx + 1;
  while (i < pattern.length) {
    if (pattern[i] === '[') {
      const br = parseBracketExpression(pattern, i);
      if (br) { i = br.nextIdx; continue; }
    }
    if (pattern[i] === '(') depth++;
    else if (pattern[i] === ')' && --depth === 0) return i;
    i++;
  }
  return -1;
}

function splitTopLevelPipes(innerStr) {
  const branches = [];
  let depth = 0, last = 0, i = 0;
  while (i < innerStr.length) {
    if (innerStr[i] === '[') {
      const br = parseBracketExpression(innerStr, i);
      if (br) { i = br.nextIdx; continue; }
    }
    if (innerStr[i] === '(') depth++;
    else if (innerStr[i] === ')') depth--;
    else if (innerStr[i] === '|' && depth === 0) {
      branches.push(innerStr.slice(last, i));
      last = i + 1;
    }
    i++;
  }
  branches.push(innerStr.slice(last));
  return branches;
}

function parseGlobAST(pattern) {
  const tokens = [];
  let i = 0;
  while (i < pattern.length) {
    const ch = pattern[i];
    if ("?*+@!".includes(ch) && pattern[i + 1] === '(') {
      const closeIdx = findClosingParen(pattern, i + 1);
      if (closeIdx === -1) throw new Error(`Parenthèse ')' manquante pour '${ch}('`);
      const branches = splitTopLevelPipes(pattern.slice(i + 2, closeIdx)).map(parseGlobAST);
      tokens.push({ type: 'EXTGLOB', op: ch, branches });
      i = closeIdx + 1;
      continue;
    }
    if (ch === '*') { tokens.push({ type: 'STAR' }); i++; }
    else if (ch === '?') { tokens.push({ type: 'ANY_CHAR' }); i++; }
    else if (ch === '[') {
      const br = parseBracketExpression(pattern, i);
      if (br) { tokens.push(br.token); i = br.nextIdx; }
      else { tokens.push({ type: 'LITERAL', char: '[' }); i++; }
    } else {
      tokens.push({ type: 'LITERAL', char: ch });
      i++;
    }
  }
  return tokens;
}

function matchTokensExact(tokens, tIdx, str, sIdx, endIdx) {
  if (tIdx === tokens.length) return sIdx === endIdx;
  const tk = tokens[tIdx];
  const isLeadingDot = (sIdx === 0 && str.length > 0 && str[0] === '.');

  if (tk.type === 'LITERAL') {
    return (sIdx < endIdx && str[sIdx] === tk.char)
      ? matchTokensExact(tokens, tIdx + 1, str, sIdx + 1, endIdx) : false;
  }
  if (tk.type === 'ANY_CHAR') {
    if (isLeadingDot || sIdx >= endIdx) return false;
    return matchTokensExact(tokens, tIdx + 1, str, sIdx + 1, endIdx);
  }
  if (tk.type === 'BRACKET') {
    if (isLeadingDot || sIdx >= endIdx) return false;
    const inSet = tk.charSet.has(str[sIdx]);
    return (tk.negated ? !inSet : inSet)
      ? matchTokensExact(tokens, tIdx + 1, str, sIdx + 1, endIdx) : false;
  }
  if (tk.type === 'STAR') {
    if (isLeadingDot) return matchTokensExact(tokens, tIdx + 1, str, sIdx, endIdx);
    for (let k = sIdx; k <= endIdx; k++) {
      if (matchTokensExact(tokens, tIdx + 1, str, k, endIdx)) return true;
    }
    return false;
  }
  if (tk.type === 'EXTGLOB') {
    for (let k = sIdx; k <= endIdx; k++) {
      if (matchExtglobSegment(tk.op, tk.branches, str, sIdx, k) &&
          matchTokensExact(tokens, tIdx + 1, str, k, endIdx)) return true;
    }
    return false;
  }
  return false;
}

function matchesAnyBranch(branches, str, sIdx, endIdx) {
  return branches.some(b => matchTokensExact(b, 0, str, sIdx, endIdx));
}

function matchBranchRep(branches, str, sIdx, endIdx, count) {
  if (sIdx === endIdx) return count >= 1 ? true : matchesAnyBranch(branches, str, sIdx, endIdx);
  for (let m = sIdx + 1; m <= endIdx; m++) {
    if (matchesAnyBranch(branches, str, sIdx, m) &&
        matchBranchRep(branches, str, m, endIdx, count + 1)) return true;
  }
  return false;
}

function matchExtglobSegment(op, branches, str, sIdx, endIdx) {
  const consumesLeadingDot = (sIdx === 0 && endIdx > 0 && str[0] === '.');
  if (op === '@') return matchesAnyBranch(branches, str, sIdx, endIdx);
  if (op === '?') return (sIdx === endIdx) || matchesAnyBranch(branches, str, sIdx, endIdx);
  if (op === '!') return consumesLeadingDot ? false : !matchesAnyBranch(branches, str, sIdx, endIdx);
  if (op === '+') return matchBranchRep(branches, str, sIdx, endIdx, 0);
  if (op === '*') return (sIdx === endIdx) || matchBranchRep(branches, str, sIdx, endIdx, 0);
  return false;
}

function bashGlobMatch(pattern, filename) {
  const ast = parseGlobAST(pattern);
  return matchTokensExact(ast, 0, filename, 0, filename.length);
}

const outEl = document.getElementById('term-output');
const inpEl = document.getElementById('cmd-input');
const boxEl = document.getElementById('term-box');

function printLine(text = "", cls = "") {
  const div = document.createElement('div');
  div.className = "log-line" + (cls ? " " + cls : "");
  div.textContent = text;
  outEl.appendChild(div);
  boxEl.scrollTop = boxEl.scrollHeight;
}

function printBlock(lines, cls = "") {
  lines.forEach(l => printLine(l, cls));
}

function updatePromptLabel() {
  const u = profile.pseudo || "user";
  if (state.wizardStep > 0) {
    promptLbl.textContent = `${u}@mainframe:~/custom$`;
  } else if (state.active) {
    const mid = state.playlist[state.stepIdx];
    promptLbl.textContent = `${u}@glob-ops:mission-${String(mid).padStart(2, '0')}$`;
  } else {
    promptLbl.textContent = `${u}@mainframe:~$`;
  }
}

function applyTheme() {
  document.documentElement.style.setProperty('--bg-color', profile.bgColor);
  document.documentElement.style.setProperty('--font-color', profile.fontColor);
}

function loadProfile() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) profile = { ...profile, ...JSON.parse(saved) };
  } catch (e) {}
  applyTheme();
  updatePromptLabel();
}

function saveProfile() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(profile)); } catch (e) {}
  updatePromptLabel();
}

function focusPrompt() {
  if (window.getSelection().toString() === "") inpEl.focus();
}

function execFromNav(cmd) {
  inpEl.value = cmd;
  handleInput(cmd);
  inpEl.value = "";
  inpEl.focus();
}

function startCampaign(startAt) {
  const s = startAt || profile.campaignUnlocked || 1;
  state.playlist = [];
  for (let i = s; i <= MISSIONS.length; i++) state.playlist.push(i);
  state.mode = "CAMPAIGN";
  state.stepIdx = 0;
  state.sessionScore = 0;
  state.active = true;
  state.wizardStep = 0;
  printMission();
}

function printMission() {
  const mid = state.playlist[state.stepIdx];
  const m = MISSIONS.find(x => x.id === mid);
  if (!m) {
    state.active = false;
    state.awaitingNext = false;
    updatePromptLabel();
    printBlock([
      "",
      "========================================================================",
      `[SESSION TERMINEE] Score Session : ${state.sessionScore} pts | Maitrise : ${profile.masteredIds.length}/36`,
      "Tape 'submit' pour publier ton score sur le Leaderboard, ou 'menu'.",
      "========================================================================",
      ""
    ]);
    return;
  }

  state.attempts = 0;
  state.usedHint = 0;
  state.awaitingNext = false;
  state.startTimeMs = Date.now();
  updatePromptLabel();

  const mast = profile.masteredIds.includes(m.id) ? " [MAITRISEE]" : "";
  printLine("");
  printLine("------------------------------------------------------------------------");
  printLine(`[MISSION #${String(m.id).padStart(2, '0')}/36] ${m.title} (N${m.diff} | ${m.theme})${mast}`, "bold");
  printLine("------------------------------------------------------------------------");
  printLine(m.scenario);
  printLine("");

  const colWidth = 36;
  printLine("TARGETS (a capturer) :".padEnd(colWidth) + "DECOYS (pieges a exclure) :", "bold");
  const rows = Math.max(m.targets.length, m.decoys.length);
  for (let i = 0; i < rows; i++) {
    const t = m.targets[i] ? `  [+] ${m.targets[i]}` : "";
    const d = m.decoys[i] ? `  [-] ${m.decoys[i]}` : "";
    printLine(t.padEnd(colWidth) + d);
  }
  printLine("");
  printLine("Tape ton motif glob (ou 'hint', 'sol', 'memo', 'skip', 'goto <N>', 'exit').", "dim");
}

function evaluateGlobAttempt(pattern) {
  const mid = state.playlist[state.stepIdx];
  const m = MISSIONS.find(x => x.id === mid);

  if (/\s/.test(pattern)) {
    printLine("Erreur : espaces interdits. Ecris UN SEUL motif glob unifie.");
    return;
  }
  if (pattern.includes('{') && pattern.includes('}')) {
    printLine("Piege : '{a,b}' est de la Brace Expansion, pas du globbing ! Utilise '@(a|b)'.");
    return;
  }
  if (pattern.includes('/')) {
    printLine("Erreur : reste dans le repertoire courant (pas de '/').");
    return;
  }
  if (!/[*?\[(|!]/.test(pattern)) {
    printLine("Attention : ce motif ne contient aucun operateur glob (*, ?, [...], extglob).");
    return;
  }

  state.attempts++;
  let tp = [], fp = [], fn = [];
  try {
    for (const t of m.targets) {
      if (bashGlobMatch(pattern, t)) tp.push(t);
      else fn.push(t);
    }
    for (const d of m.decoys) {
      if (bashGlobMatch(pattern, d)) fp.push(d);
    }
  } catch (err) {
    printLine(`Erreur de syntaxe : ${err.message}`);
    return;
  }

  if (tp.length === 0 && fp.length === 0) {
    printLine(`[✗] Aucun fichier ne correspond au motif : ${pattern}`);
    return;
  }

  if (fp.length === 0 && fn.length === 0) {
    const elapsed = Math.max(1, Math.floor((Date.now() - state.startTimeMs) / 1000));
    let pts = 100 - (state.attempts - 1) * 15 - (state.usedHint === 1 ? 30 : 0);
    if (pts < 20) pts = 20;
    let speed = elapsed <= 15 ? 30 : (elapsed <= 30 ? 15 : (elapsed <= 60 ? 5 : 0));
    if (state.usedHint === 2) { pts = 10; speed = 0; }
    else if (!profile.masteredIds.includes(m.id)) profile.masteredIds.push(m.id);

    const totalPts = pts + speed;
    state.sessionScore += totalPts;
    profile.totalScore += totalPts;
    if (state.sessionScore > profile.bestScore) profile.bestScore = state.sessionScore;
    if (state.mode === "CAMPAIGN" && m.id >= profile.campaignUnlocked && profile.campaignUnlocked < MISSIONS.length) {
      profile.campaignUnlocked = m.id + 1;
    }
    saveProfile();

    state.awaitingNext = true;
    printBlock([
      "",
      `>>> [✓] MISSION #${String(m.id).padStart(2, '0')} ACCOMPLIE ! (+${totalPts} pts | ${elapsed}s | Bonus vitesse: +${speed})`,
      `    Ton motif         : ${pattern}`,
      `    Solution optimale : ${m.solution}`,
      `    Debriefing        : ${m.debrief}`,
      "",
      "Appuie sur [ENTREE] pour passer a la mission suivante..."
    ]);
    return;
  }

  printLine(`Analyse pour '${pattern}' :`);
  printLine(`  [✓] Cibles capturees (${tp.length}/${m.targets.length}) : ${tp.join(' ') || 'aucune'}`);
  if (fp.length > 0) printLine(`  [✗] FAUX POSITIFS (${fp.length} piege(s)) : ${fp.join(' ')}`);
  if (fn.length > 0) printLine(`  [!] Cibles manquees (${fn.length})  : ${fn.join(' ')}`);
}

// =============================================================================
// 5. LEADERBOARD (SUPABASE REST OU LOCAL FALLBACK)
// =============================================================================
async function showLeaderboard() {
  printLine("Recuperation du Leaderboard TSSR/SOC...");
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=pseudo,score,mastered&order=score.desc&limit=15`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (res.ok) {
        const rows = await res.json();
        renderBoardTable(rows, "LEADERBOARD PUBLIC EN LIGNE");
        return;
      }
    } catch (e) {}
  }
  // Classement local + joueur courant
  const list = [...profile.localBoard];
  const existing = list.find(x => x.pseudo === profile.pseudo);
  const myBest = Math.max(profile.bestScore, profile.totalScore);
  if (existing) {
    existing.score = Math.max(existing.score, myBest);
    existing.mastered = profile.masteredIds.length;
  } else {
    list.push({ pseudo: profile.pseudo, score: myBest, mastered: profile.masteredIds.length });
  }
  list.sort((a, b) => b.score - a.score);
  renderBoardTable(list.slice(0, 10), "LEADERBOARD (Mode Local - Configure SUPABASE_URL pour le mode Public)");
}

function renderBoardTable(rows, title) {
  printLine("");
  printLine(`=== ${title} ===`, "bold");
  printLine("RANG  PSEUDO                SCORE       MAITRISE");
  printLine("----  --------------------  ----------  --------");
  rows.forEach((r, idx) => {
    const rk = `#${String(idx + 1).padStart(2, '0')}`.padEnd(6);
    const ps = String(r.pseudo).slice(0, 20).padEnd(22);
    const sc = `${r.score} pts`.padEnd(12);
    const ma = `${r.mastered}/36`;
    printLine(`${rk}${ps}${sc}${ma}`);
  });
  printLine("");
  printLine("Astuce : tape 'nick <ton_pseudo>' puis 'submit' pour publier ton score.", "dim");
}

async function submitScoreToBoard() {
  const best = Math.max(profile.bestScore, profile.totalScore);
  if (best <= 0) {
    printLine("Resous au moins une mission avant de publier ton score.");
    return;
  }
  if (SUPABASE_URL && SUPABASE_KEY) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          pseudo: profile.pseudo,
          score: best,
          mastered: profile.masteredIds.length
        })
      });
      if (res.ok) {
        printLine(`[OK] Score de ${best} pts publie sous le pseudo '${profile.pseudo}' !`);
        showLeaderboard();
        return;
      }
    } catch (e) {}
  }
  printLine(`[OK] Score enregistre pour '${profile.pseudo}' (${best} pts | ${profile.masteredIds.length}/36).`);
  showLeaderboard();
}

// =============================================================================
// 6. INTERPRÉTEUR DE COMMANDES SHELL PRINCIPAL
// =============================================================================
function onPromptSubmit(e) {
  e.preventDefault();
  const raw = inpEl.value;
  inpEl.value = "";
  handleInput(raw);
}

function handleInput(rawInput) {
  const cmd = rawInput.trim();
  printLine(`${promptLbl.textContent} ${cmd}`);

  if (state.awaitingNext && cmd === "") {
    state.stepIdx++;
    printMission();
    return;
  }

  if (!cmd) return;
  cmdHistory.unshift(cmd);
  histIdx = -1;

  // Assistant interactif du mode Custom
  if (state.wizardStep > 0) {
    handleCustomWizard(cmd);
    return;
  }

  const parts = cmd.split(/\s+/);
  const base = parts[0].toLowerCase();
  const arg = parts.slice(1).join(" ");

  // Commandes globales disponibles partout (comme dans NetWatch)
  if (base === "help" || base === "man") {
    printBlock([
      "available commands :",
      "  start / camp       : lancer la campagne au niveau debloque (" + profile.campaignUnlocked + "/36)",
      "  goto <1-36>        : sauter directement a une mission specifique",
      "  custom             : generer une partie aleatoire (difficulte, theme, nombre)",
      "  stats / tree       : afficher ta progression et l'arborescence des missions",
      "  board              : afficher le classement (Leaderboard)",
      "  nick <pseudo>      : definir ton pseudo (actuel: " + profile.pseudo + ")",
      "  submit             : envoyer ton score sur le Leaderboard",
      "  memo               : afficher le manuel technique globbing & extglob",
      "  font <color>       : changer la couleur du texte (orange, green, cyan, red, white...)",
      "  bg <color>         : changer la couleur de fond (dark, black, white, #hex...)",
      "  clear              : effacer l'ecran du terminal",
      "  hint / sol / skip  : (en mission) indice, solution, ou passer la mission"
    ]);
    return;
  }

  if (base === "clear" || base === "cls") {
    outEl.innerHTML = "";
    if (state.active) printMission();
    return;
  }

  if (base === "font") {
    if (!arg || arg === "--help") {
      printLine("Usage: font <color>. Available: orange, green, cyan, red, yellow, magenta, white, matrix, or #hex.");
      return;
    }
    const c = VALID_COLORS[arg.toLowerCase()] || (arg.startsWith('#') ? arg : null);
    if (!c) {
      printLine(`Unknown color: ${arg}`);
      return;
    }
    profile.fontColor = c;
    applyTheme();
    saveProfile();
    printLine(`Font color set to ${arg}.`);
    return;
  }

  if (base === "bg") {
    if (!arg || arg === "--help") {
      printLine("Usage: bg <color>. Available: dark, black, white, or #hex.");
      return;
    }
    const c = VALID_COLORS[arg.toLowerCase()] || (arg.startsWith('#') ? arg : null);
    if (!c) {
      printLine(`Unknown color: ${arg}`);
      return;
    }
    profile.bgColor = c;
    applyTheme();
    saveProfile();
    printLine(`Background color set to ${arg}.`);
    return;
  }

  // Easter Egg NetWatch conservé !
  if (cmd === "rm -rf") {
    printLine("rm: permission denied");
    return;
  }
  if (cmd.startsWith("rm -rf /")) {
    printBlock([
      "CRITICAL ERROR: UNAUTHORIZED ROOT DELETION ATTEMPT DETECTED.",
      ">> Escalating threat level...",
      ">> Escalate to sysadmin: FAILED (sysadmin unresponsive).",
      ">> Engaging DEFCON 2 Automated Retaliation Protocol.",
      "[SYSTEM] Uplinking to secure military subnet (USCYBERCOM)...",
      "[SECURE-LINK] CONNECTION ESTABLISHED.",
      "root@pentagon.gov:~$ request_kinetic_strike --target=origin_ip",
      "[AUTH] Awaiting POTUS biometric signature...",
      "[AUTH] Biometric signature VERIFIED.",
      "[AUTH] Authorization code: DELTA-TANGO-77 ACCEPTED.",
      ">> UCAV MQ-9 Reaper drone deployment: CONFIRMED.",
      ">> Target locked on origin IP: 44.152.241.194",
      ">> ETA to target impact: 00:04:30.",
      "Please remain seated and do not leave the building."
    ]);
    return;
  }

  if (base === "memo") {
    printBlock([
      "=== MANUEL TECHNIQUE : GLOBBING POSIX & BASH EXTGLOB ===",
      "  *              : 0, 1 ou N caracteres (sauf '.' initial d'un fichier cache)",
      "  ?              : exactement 1 caractere quelconque (sauf '.' initial)",
      "  [abc] [0-9]    : 1 caractere parmi la liste ou la plage ASCII",
      "  [!abc]         : 1 caractere qui N'EST PAS dans la liste",
      "  [[:xdigit:]]   : Hexadecimal [0-9a-fA-F]. Aussi: [:digit:], [:upper:], [:lower:], [:punct:]",
      "  ?(p1|p2)       : 0 ou 1 occurrence des motifs (Optionnel)",
      "  *(p1|p2)       : 0, 1 ou N occurrences des motifs",
      "  +(p1|p2)       : 1 ou N occurrences (Au moins une occurrence !)",
      "  @(p1|p2)       : exactement 1 des motifs listes",
      "  !(p1|p2)       : tout SAUF les motifs listes (encadrable par prefixe/suffixe)"
    ]);
    return;
  }

  if (base === "tree" || base === "stats" || base === "profil") {
    printBlock([
      `Profil Joueur : ${profile.pseudo}`,
      `|_ progression_campagne : Niveau ${profile.campaignUnlocked}/36`,
      `|_ missions_maitrisees  : ${profile.masteredIds.length}/36`,
      `|_ meilleur_score       : ${profile.bestScore} pts`,
      `|_ score_cumule         : ${profile.totalScore} pts`,
      `|_ paliers :`,
      `   |_ [01..09] Tier 1 : Globs Standards (*, ?, [...], [!...] )`,
      `   |_ [10..18] Tier 2 : Classes POSIX ([:xdigit:]) & Dotfiles`,
      `   |_ [19..27] Tier 3 : Fondamentaux extglob (@, ?, *, +)`,
      `   |_ [28..36] Tier 4 : Exclusions !() & Imbrications APT`
    ]);
    return;
  }

  if (base === "nick") {
    if (!arg) { printLine("Usage: nick <ton_pseudo>"); return; }
    profile.pseudo = arg.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 20) || "user";
    saveProfile();
    printLine(`Pseudo defini sur : ${profile.pseudo}`);
    return;
  }

  if (base === "board" || base === "leaderboard") {
    showLeaderboard();
    return;
  }

  if (base === "submit") {
    submitScoreToBoard();
    return;
  }

  if (base === "start" || base === "camp" || base === "campagne") {
    startCampaign(parseInt(arg, 10) || profile.campaignUnlocked);
    return;
  }

  if (base === "goto" || base === "cd") {
    const n = parseInt(arg, 10);
    if (!n || n < 1 || n > MISSIONS.length) {
      printLine(`Usage: goto <1-${MISSIONS.length}>`);
      return;
    }
    startCampaign(n);
    return;
  }

  if (base === "custom") {
    state.active = false;
    state.wizardStep = 1;
    updatePromptLabel();
    printBlock([
      "=== CONFIGURATION D'OPERATION SUR-MESURE ===",
      "Etape 1/3 - Choisis la difficulte [1=N1, 2=N2, 3=N3, 4=N4, ALL=Mixte] (defaut: ALL) :"
    ]);
    return;
  }

  // Commandes spécifiques lorsqu'une mission est active
  if (state.active) {
    const m = MISSIONS.find(x => x.id === state.playlist[state.stepIdx]);
    if (base === "exit" || base === "quit" || base === "menu") {
      state.active = false;
      state.awaitingNext = false;
      updatePromptLabel();
      printLine("Retour au shell principal. Tape 'help' pour voir les commandes.");
      return;
    }
    if (base === "ls") {
      printMission();
      return;
    }
    if (base === "hint" || base === "indice") {
      if (state.usedHint === 0) state.usedHint = 1;
      printLine(`[INDICE SOC] : ${m.hint}`);
      return;
    }
    if (base === "sol" || base === "solution") {
      state.usedHint = 2;
      printLine(`[SOLUTION CANONIQUE] : ${m.solution}`);
      return;
    }
    if (base === "skip" || base === "next") {
      state.stepIdx++;
      printMission();
      return;
    }
    if (state.awaitingNext) {
      state.stepIdx++;
      printMission();
      return;
    }

    // Sinon, l'entrée est évaluée comme un motif glob !
    evaluateGlobAttempt(cmd);
    return;
  }

  printLine(`Unknown command: ${base}. Type 'help' for available commands.`);
}

function handleCustomWizard(input) {
  const val = input.trim().toUpperCase();
  if (val === "EXIT" || val === "QUIT") {
    state.wizardStep = 0;
    updatePromptLabel();
    printLine("Configuration annulee.");
    return;
  }

  if (state.wizardStep === 1) {
    state.wizardData.diff = ["1", "2", "3", "4"].includes(val) ? Number(val) : "ALL";
    state.wizardStep = 2;
    printLine("Etape 2/3 - Choisis le theme [NET, SYS, SEC, ALL] (defaut: ALL) :");
    return;
  }

  if (state.wizardStep === 2) {
    state.wizardData.theme = ["NET", "SYS", "SEC"].includes(val) ? val : "ALL";
    state.wizardStep = 3;
    printLine("Etape 3/3 - Nombre de missions a tirer au sort [1-36] (defaut: 5) :");
    return;
  }

  if (state.wizardStep === 3) {
    const count = parseInt(val, 10) || 5;
    const pool = MISSIONS.filter(m =>
      (state.wizardData.diff === "ALL" || m.diff === state.wizardData.diff) &&
      (state.wizardData.theme === "ALL" || m.theme === state.wizardData.theme)
    ).map(m => m.id);

    for (let i = pool.length - 1; i > 0; i--) {
      const r = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[r]] = [pool[r], pool[i]];
    }

    state.wizardStep = 0;
    state.playlist = pool.slice(0, Math.min(count, pool.length));
    state.mode = "CUSTOM";
    state.stepIdx = 0;
    state.sessionScore = 0;
    state.active = true;
    printMission();
  }
}

// Historique flèches Haut / Bas
inpEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    if (histIdx + 1 < cmdHistory.length) {
      histIdx++;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    }
  } else if (e.key === 'ArrowDown') {
    if (histIdx > 0) {
      histIdx--;
      inpEl.value = cmdHistory[histIdx];
      e.preventDefault();
    } else if (histIdx === 0) {
      histIdx = -1;
      inpEl.value = "";
      e.preventDefault();
    }
  }
});

// Démarrage initial façon NetWatch
loadProfile();
printBlock([
  "GlobWatch Mainframe OS v3.0 (LC_ALL=C | shopt -s extglob nullglob)",
  "available commands : start, custom, goto <1-36>, stats, board, nick <name>, memo, bg <color>, font <color>, help.",
  "Type 'start' (or click [ Campagne ]) to launch mission #" + String(profile.campaignUnlocked).padStart(2, '0') + "."
]);
</script>
